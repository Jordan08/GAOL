# The steps of the job mingw of windows.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: windows-mingw
description: The job mingw of windows.yml for one configuration
inputs:
  bin:
    description: The key bin of the row of the matrix of the job
    default: ''
  choco_flags:
    description: The key choco_flags of the row of the matrix of the job
    default: ''
  config:
    description: The key config of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
  opts:
    description: The key opts of the row of the matrix of the job
    default: ''
  version:
    description: The key version of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: MinGW-w64, from Chocolatey
      shell: bash
      run: |
        choco install -y -r --no-progress mingw --version=${{ inputs.version }} --force ${{ inputs.choco_flags }}
        echo '${{ inputs.bin }}' >> "$GITHUB_PATH"
    # The MinGW-w64 of this configuration is the first in PATH, whatever the
    # configurations before it of the job installed (GAOL v5)
    - name: The MinGW-w64 asked for is the one of PATH
      shell: bash
      run: |
        want=$(echo "${{ inputs.version }}" | cut -d. -f1-3)
        g++ --version | head -n 1
        g++ --version | head -n 1 | grep -F -e "$want"
    - name: Configure
      shell: bash
      run: |
        which gcc g++ mingw32-make
        g++ --version
        g++ -dumpmachine
        cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ inputs.config }} -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ inputs.opts }}
    # The SSE2 intervals on x86 as on x64, with -faligned-new=8 on x86, where
    # the C runtime aligns the memory of new on 8 bytes (GAOL v5)
    - name: The intervals
      shell: bash
      run: |
        sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
        if [ "$(g++ -dumpmachine | cut -c1-4)" = "i686" ]; then
          grep -F -e "-faligned-new=8" build/CMakeFiles/gaol.dir/flags.make
        fi
    - name: Build
      shell: bash
      run: cmake --build build -j 4
    # GAOL_FMA gives GCC for Windows on x64 and on x86 -mfma
    # -mprefer-vector-width=128 (CMakeLists.txt): the
    # objects of the Release builds hold fused multiply-add instructions,
    # which CORE-MATH and the integer powers need to be fast, and none on a
    # 256-bit register, which GCC would spill to a stack that Windows x64
    # aligns on 16 bytes (GCC bug 54412; on x86 the lines with %ymm are
    # listed and noticed, not an error). Not in Debug, where the vectorizer
    # does not run, nor without GAOL_FMA (GAOL v5)
    - name: Fused multiply-add instructions, and no 256-bit register in the objects
      if: inputs.config == 'Release' && !contains(inputs.opts, 'GAOL_FMA=OFF')
      shell: bash
      run: |
        PATH="$(cygpath -u '${{ inputs.bin }}'):$PATH"
        export PATH
        sh .github/scripts/check-gcc-windows-fma.sh build
    # The programs are run with the MinGW-w64 first in PATH: bash starts with the
    # mingw64/bin of Git for Windows before it, and the libstdc++-6.dll there (x64
    # only: an x86 program skips a 64-bit DLL) is older than the compiler's, without
    # std::streambuf::seekpos, so that gaol_test_numbers did not start (exit code
    # 0xc0000139, entry point not found).
    - name: Tests (make test)
      shell: bash
      run: |
        bindir=$(cygpath -u '${{ inputs.bin }}')
        export PATH="$bindir:$PATH"
        cmake --build build --target test
    - name: The test numbers ran under a locale writing a decimal comma
      shell: bash
      run: sh .github/scripts/comma-locale.sh check build
    # The test of misc with the stack aligned on 4 bytes (see the job
    # visual-studio): GCC for x86 stops on it where it does not align the
    # stack of the function. After the check of the locale, which reads the output of
    # the last ctest (LastTest.log)
    - name: The stack entered aligned on 4 bytes
      if: inputs.choco_flags == '--x86'
      shell: bash
      run: |
        bindir=$(cygpath -u '${{ inputs.bin }}')
        export PATH="$bindir:$PATH"
        ctest --test-dir build -R '^misc$' -V | tee misc.log
        grep -F "returned the bounds of the entry aligned on 16 with the stack aligned on 16 minus 4, 8 and 12 bytes at its entry" misc.log
    - name: Performance
      if: inputs.config == 'Release'
      shell: bash
      run: |
        bindir=$(cygpath -u '${{ inputs.bin }}')
        export PATH="$bindir:$PATH"
        build/tests/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Install
      shell: bash
      run: cmake --install build
    - name: Tests built with the installed GAOL
      shell: bash
      run: |
        bindir=$(cygpath -u '${{ inputs.bin }}')
        export PATH="$bindir:$PATH"
        cmake -S tests/find_package -B build-find-package -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ inputs.config }} -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
        cmake --build build-find-package -j 4
        cmake --build build-find-package --target test
