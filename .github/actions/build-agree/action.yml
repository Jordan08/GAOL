# The three builds give GAOL the same configuration (.github/audit)
# The steps of the job agree of build-systems.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: build-agree
description: The job agree of build-systems.yml for one configuration
inputs:
  cc:
    description: The key cc of the row of the matrix of the job
    default: ''
  cxx:
    description: The key cxx of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Tools
      shell: bash -e {0}
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make pipx
        else
          brew install pipx
        fi
        pipx install --force meson
        pipx install ninja
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Configure with the three builds and compare
      shell: bash -e {0}
      run: |
        sh .github/audit/audit.sh audit ${{ inputs.cc }} ${{ inputs.cxx }} . "$RUNNER_TEMP/audit" meson
        status=0; python3 .github/audit/compare.py --check "$RUNNER_TEMP/audit/audit.json" > agree.md || status=$?
        cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
        sh .github/audit/logs.sh "$RUNNER_TEMP/audit/audit" $status
