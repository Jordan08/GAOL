# The 128-bit integer computed with two 64-bit halves, which is the code
# Visual C++ and the 32-bit targets of GCC take: built and tested on an
# ordinary machine, where the native type is there to compare with
# (tests/u128.cpp), so that the path is checked at every change rather than
# only on the containers of containers.yml (GAOL v5)
# The steps of the job u128-emulation of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-u128-emulation
description: The job u128-emulation of linux.yml for one configuration
inputs:
  cc:
    description: The key cc of the row of the matrix of the job
    default: ''
  cxx:
    description: The key cxx of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh generate
    - name: Configure
      shell: bash -e {0}
      run: |
        set -o pipefail
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
          -DGAOL_U128_EMULATION=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_COMPILER=${{ inputs.cc }} -DCMAKE_CXX_COMPILER=${{ inputs.cxx }} | tee configure.log
        grep -q "128-bit integer: the two halves" configure.log
        # Every source of CORE-MATH compiled with the two halves: the option
        # once reached GAOL's sources only, and CORE-MATH kept the native type
        python3 - <<'EOF'
        import json, sys
        srcs = [e for e in json.load(open("build/compile_commands.json"))
                if "/3rd/math-core/" in e["file"]]
        native = [e["file"] for e in srcs if "GAOL_U128_FORCE_EMULATION" not in e.get("command", " ".join(e.get("arguments", [])))]
        print(len(srcs), "sources of CORE-MATH,", len(native), "without the emulation")
        sys.exit(1 if native or not srcs else 0)
        EOF
    - name: Build
      shell: bash -e {0}
      run: cmake --build build -j 4
    - name: Tests (make test)
      shell: bash -e {0}
      run: cmake --build build --target test
    - name: The test numbers ran under a locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh check build
