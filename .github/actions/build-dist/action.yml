# The archive of the sources made by the three builds, make dist, dist
# (package_source) of CMake and meson dist: gaol-<version>.tar.gz, with the
# same files, those of the commit as git archive gives them (without the notes
# of the work of the branch dev, which are export-ignore). make distcheck
# builds the archive with the tests and the examples, runs them, installs and
# uninstalls it (GAOL v5, doc/building.md).
# A file added to the repository and not to the EXTRA_DIST of a Makefile.am is
# missing from the archive of make dist, which fails the comparison
# The steps of the job dist of build-systems.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: build-dist
description: The job dist of build-systems.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Tools
      shell: bash -e {0}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q g++ cmake pipx
        pipx install --force meson
        pipx install ninja
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: make dist and make distcheck
      shell: bash -e {0}
      run: |
        mkdir build-autotools && cd build-autotools
        ../configure
        make dist
        make -j4 distcheck
    - name: dist of CMake (package_source)
      shell: bash -e {0}
      run: |
        cmake -S . -B build-cmake
        cmake --build build-cmake --target dist
    - name: meson dist
      shell: bash -e {0}
      run: |
        meson setup build-meson
        # meson dist builds the archive with meson and runs its tests too
        meson dist -C build-meson --formats gztar
    - name: The three archives have the same name and hold the same files
      shell: bash -e {0}
      run: |
        set -e
        version=$(cat VERSION.txt)
        git archive --prefix="gaol-$version/" HEAD | tar -t | grep -v '/$' | sort > git.list
        for a in "build-autotools/gaol-$version.tar.gz" "build-cmake/gaol-$version.tar.gz" "build-meson/meson-dist/gaol-$version.tar.gz"; do
          test -f "$a" || { echo "$a: missing"; exit 1; }
          tar -tzf "$a" | grep -v '/$' | sort > archive.list
          if ! diff git.list archive.list > diff.txt; then
            echo "$a does not hold the files of git archive (< git archive, > $a):"; cat diff.txt; exit 1
          fi
          echo "$a: $(wc -l < archive.list) files, those of git archive"
        done
