# The build types, configured only: GAOL_DEBUG builds the libraries of GAOL
# and CORE-MATH for debugging whatever the build type, a project bringing
# GAOL in included, and a generator of several configurations builds Release
# by default (tests/release_flags.py, GAOL v5)
# The steps of the job build-types of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-build-types
description: The job build-types of linux.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Tools
      shell: bash -e {0}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ninja-build
    - name: GAOL_DEBUG, GAOL built alone in Release
      shell: bash -e {0}
      run: |
        cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DGAOL_DEBUG=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        python3 tests/release_flags.py --debug build-debug "$PWD"
    - name: GAOL_DEBUG, GAOL brought in by FetchContent without a build type, and in Release
      shell: bash -e {0}
      run: |
        cmake -S tests/fetch_content -B build-fetch-content-debug -DFETCHCONTENT_SOURCE_DIR_GAOL="$PWD" -DGAOL_DEBUG=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        python3 tests/release_flags.py --debug build-fetch-content-debug "$PWD"
        cmake -S tests/fetch_content -B build-fetch-content-release-debug -DFETCHCONTENT_SOURCE_DIR_GAOL="$PWD" -DGAOL_DEBUG=ON \
          -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -DPROJECT_RELEASE" "-DCMAKE_CXX_FLAGS_DEBUG=-g -DPROJECT_DEBUG" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        python3 tests/release_flags.py --debug build-fetch-content-release-debug "$PWD"
    - name: GAOL_DEBUG reaches the libraries of GAOL alone, and keeps the other flags of the configuration
      shell: bash -e {0}
      run: |
        # GAOL takes the flags of the configuration less the optimization and
        # NDEBUG, never those of Debug, which may hold what the code of the
        # project does not get (a sanitizer, a C runtime); the tests of GAOL
        # and of the project keep theirs
        python3 - "$PWD" <<'EOF'
        import json, os, sys
        src = os.path.normpath(sys.argv[1])
        def commands(build):
            for e in json.load(open(os.path.join(build, 'compile_commands.json'))):
                if e['file'].endswith('.cpp'):
                    yield os.path.normpath(os.path.join(e['directory'], e['file'])), e['command'].split()
        gaol, tests = os.path.join(src, 'gaol') + os.sep, os.path.join(src, 'tests') + os.sep
        seen = 0
        for path, flags in commands('build-debug'):
            if path.startswith(tests):
                assert '-O3' in flags and '-DNDEBUG' in flags, (path, flags); seen += 1
        for path, flags in commands('build-fetch-content-release-debug'):
            if path.startswith(gaol):
                assert '-DPROJECT_RELEASE' in flags and '-DPROJECT_DEBUG' not in flags, (path, flags); seen += 1
            elif path.startswith(tests):
                assert '-O3' in flags and '-DNDEBUG' in flags and '-DPROJECT_RELEASE' in flags, (path, flags); seen += 1
        assert seen, 'no command checked'
        print(seen, 'commands checked')
        EOF
    - name: Ninja Multi-Config builds Release by default
      shell: bash -e {0}
      run: |
        cmake -G "Ninja Multi-Config" -S . -B build-multi
        grep '^CMAKE_CONFIGURATION_TYPES:' build-multi/CMakeCache.txt
        ninja -C build-multi -n > plan.txt
        grep -q 'CMakeFiles/gaol.dir/Release/' plan.txt
        if grep -q 'CMakeFiles/gaol.dir/Debug/' plan.txt; then echo "Debug built by default"; exit 1; fi
