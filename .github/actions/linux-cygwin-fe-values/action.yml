# The FE_* values of Cygwin (newlib: 0 to 3) for the sources of CORE-MATH,
# put over those of glibc (.github/scripts/newlib-fe-values.h): Cygwin, which
# the job cygwin of windows.yml builds, defines __x86_64__ but not __WIN32__,
# as Linux, and with upstream's cbrt.c, rsqrt.c and asinpi.c the downward and
# upward roundings were taken for toward zero there (tests/core_math.cpp,
# 3rd/README.md, item 6). Only the C sources, CORE-MATH's, take the header
# (GAOL v5)
# The steps of the job cygwin-fe-values of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-cygwin-fe-values
description: The job cygwin-fe-values of linux.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh generate
    - name: Configure
      shell: bash -e {0}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
          -DCMAKE_C_FLAGS="-include $PWD/.github/scripts/newlib-fe-values.h"
    - name: Build
      shell: bash -e {0}
      run: cmake --build build -j 4
    - name: Tests (make test)
      shell: bash -e {0}
      run: cmake --build build --target test
    - name: The test numbers ran under a locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh check build
