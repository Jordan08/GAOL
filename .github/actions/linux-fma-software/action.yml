# fma() computed by gaol_fma_upward() and gaol_fma() of gaol/math/gaol_fma.h,
# with integers, which is what GAOL calls where the C library's fma() is wrong
# and the build has no fused multiply-add instruction (the MinGW-w64 before
# version 12 or linked with msvcrt.dll, and Cygwin; GAOL_SOFT_FMA of
# gaol/gaol_config.h): built and tested
# on an ordinary machine, where the fma() of the library is right and
# tests/core_math.cpp compares gaol_fma() with it, or with the instruction when
# the build keeps -mfma (the input opts is empty), so that the path is checked
# at every change rather than only on the jobs of windows.yml, which check the
# toolchains it is for (GAOL v5)
# The steps of the job fma-software of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-fma-software
description: The job fma-software of linux.yml for one configuration
inputs:
  cc:
    description: The key cc of the row of the matrix of the job
    default: ''
  cxx:
    description: The key cxx of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
  opts:
    description: Options of CMake added to the configuration, -DGAOL_FMA=OFF to leave the instruction out
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh generate
    - name: Configure
      shell: bash -e {0}
      run: |
        set -o pipefail
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
          -DGAOL_FMA_SOFTWARE=ON ${{ inputs.opts }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_COMPILER=${{ inputs.cc }} -DCMAKE_CXX_COMPILER=${{ inputs.cxx }} | tee configure.log
        grep -q "fma(): gaol_fma_upward() and gaol_fma() of gaol/math/gaol_fma.h" configure.log
        # Every source of CORE-MATH compiled with the macro, and with -mfma
        # exactly where the instruction was not left out: the sources are in
        # gaol_core_math, which the definitions of gaol do not reach (as
        # GAOL_U128_FORCE_EMULATION)
        python3 - "${{ inputs.opts }}" <<'PYTHON'
        import json, sys
        left_out = "GAOL_FMA=OFF" in sys.argv[1]
        srcs = [e for e in json.load(open("build/compile_commands.json"))
                if "/3rd/math-core/" in e["file"]]
        command = lambda e: e.get("command", " ".join(e.get("arguments", [])))
        without = [e["file"] for e in srcs if "GAOL_FMA_FORCE_SOFTWARE=1" not in command(e)]
        fma = [e["file"] for e in srcs if ("-mfma" in command(e)) == left_out]
        print(len(srcs), "sources of CORE-MATH,", len(without), "without the macro,", len(fma), "with -mfma wrongly set or left out")
        sys.exit(1 if without or fma or not srcs else 0)
        PYTHON
    - name: Build
      shell: bash -e {0}
      run: cmake --build build -j 4
    # The sources of CORE-MATH and of the intervals call no fma() of the C
    # library: with the macro, __builtin_fma() is gaol_fma() in every one
    - name: No call of the fma() of the C library in the objects of the library
      shell: bash -e {0}
      run: sh .github/scripts/check-no-fma-call.sh build/CMakeFiles/gaol.dir build/CMakeFiles/gaol_core_math.dir
    - name: Tests (make test)
      shell: bash -e {0}
      run: cmake --build build --target test
    - name: The test numbers ran under a locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh check build
