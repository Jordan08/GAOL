# The coverage of the tests, and the page of conclusions of coverage/
# The steps of the job coverage of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-coverage
description: The job coverage of linux.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: gcovr
      shell: bash -e {0}
      run: pipx install gcovr
    - name: Locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh generate
    - name: Configure
      shell: bash -e {0}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DGAOL_COVERAGE=ON
    - name: Tests and report
      shell: bash -e {0}
      run: cmake --build build --target coverage
    - name: The test numbers ran under a locale writing a decimal comma
      shell: bash -e {0}
      run: sh .github/scripts/comma-locale.sh check build
    - name: The page of conclusions
      shell: bash -e {0}
      run: cat coverage/README.md >> "$GITHUB_STEP_SUMMARY"
    - name: The coverage of GAOL has to stay above 80 %
      shell: bash -e {0}
      run: |
        python3 - <<'EOF'
        import json, sys
        # the raw data of gcovr goes to the build directory, coverage/
        # holding only coverage.html and README.md (GAOL v5)
        d = json.load(open("build/coverage.json"))
        run = cov = 0
        for f in d["files"]:
            if f["file"].startswith("3rd/"):
                continue
            for l in f["lines"]:
                if l.get("gcovr/noncode") is True:
                    continue
                run += 1
                cov += l.get("count", 0) > 0
        p = 100.0 * cov / run if run else 0.0
        print("Coverage of GAOL: %.1f %% of %d lines" % (p, run))
        sys.exit(0 if p >= 80.0 else 1)
        EOF
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: coverage/
