# The steps of the job asm-order-library of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-asm-order-library
description: The job asm-order-library of linux.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    # One configuration (CMake alone, the compilations are those of the check) per step, each after the one before
    # whatever its outcome, so that a job that fails says which of the four
    - name: GCC
      shell: bash -e {0}
      run: |
        g++ --version | head -1
        cmake -S . -B build-gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=g++
        python3 tests/tools/asm-order/check_order.py --build build-gcc
    - name: GCC, rounding direction preserved
      if: ${{ !cancelled() }}
      shell: bash -e {0}
      run: |
        cmake -S . -B build-gcc-preserved -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_COMPILER=g++ -DGAOL_PRESERVE_ROUNDING=ON
        python3 tests/tools/asm-order/check_order.py --build build-gcc-preserved --preserve
    - name: Clang
      if: ${{ !cancelled() }}
      shell: bash -e {0}
      run: |
        clang++ --version | head -1
        cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=clang++
        python3 tests/tools/asm-order/check_order.py --build build-clang
    - name: Clang, rounding direction preserved
      if: ${{ !cancelled() }}
      shell: bash -e {0}
      run: |
        cmake -S . -B build-clang-preserved -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_COMPILER=clang++ -DGAOL_PRESERVE_ROUNDING=ON
        python3 tests/tools/asm-order/check_order.py --build build-clang-preserved --preserve
