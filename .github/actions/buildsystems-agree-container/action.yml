# The steps of the job agree-container of build-systems.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: buildsystems-agree-container
description: The job agree-container of build-systems.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
  image:
    description: The key image of the row of the matrix of the job
    default: ''
  platform:
    description: The key platform of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Configure with the three builds and compare
      shell: bash -e {0}
      run: |
        docker run --rm --platform ${{ inputs.platform }} -v "$PWD:/gaol" -w /gaol ${{ inputs.image }} sh -c "
          set -e
          apt-get update -qq && apt-get install -y -qq g++ cmake make meson ninja-build python3 > /dev/null
          sh .github/audit/audit.sh audit gcc g++ /gaol /tmp/audit meson
          status=0; python3 .github/audit/compare.py --check /tmp/audit/audit.json > /gaol/agree.md || status=\$?
          cat /gaol/agree.md
          sh .github/audit/logs.sh /tmp/audit/audit \$status"
        cat agree.md >> "$GITHUB_STEP_SUMMARY"
