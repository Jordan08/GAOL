# The AVX-512 path of the arithmetic with Visual C++ and clang-cl, run
# (GAOL v5): the runners for Windows have no AVX-512 instructions, and the
# jobs above that ask for the path leave it out there, with a warning. Intel
# SDE emulates a Skylake-X processor, 20 to 100 times as slowly: the
# configuration is told by hand that the machine runs the instructions
# (-DGAOL_MACHINE_RUNS_AVX512=1, which CMake takes for the result of its own
# check), and the unit tests run under SDE (.github/scripts/sde-tests.sh),
# those that compute with intervals only. Visual C++ orders the operations of
# the path by volatile accesses and calls (gaol/core/gaol_interval_avx512_impl.h),
# which only the tests of the rounding direction and of the flush-to-zero
# modes can show wrong. The action sets SDE up from the binaries of its own
# repository, after checking their SHA-256: by using it, the project accepts
# Intel's licence of SDE, which is in the files it extracts.
# The steps of the job visual-studio-sde of windows.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: windows-visual-studio-sde
description: The job visual-studio-sde of windows.yml for one configuration
inputs:
  config:
    description: The key config of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
  generator:
    description: The key generator of the row of the matrix of the job
    default: ''
  opts:
    description: The key opts of the row of the matrix of the job
    default: ''
  toolset:
    description: The key toolset of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G "${{ inputs.generator }}" -A x64 ${{ inputs.toolset }} -DWITH_TESTS=ON -DGAOL_MACHINE_RUNS_AVX512=1 ${{ inputs.opts }} | tee configure.log
        sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
        grep -E "^#define GAOL_(HAVE_AVX512_TARGET|PREFER_AVX512|AVX512_ARITHMETIC|PRESERVE_ROUNDING) " build/gaol/gaol_configuration.h || true
        if ! grep -q "^#define GAOL_AVX512_ARITHMETIC 1" build/gaol/gaol_configuration.h; then
          echo "::error::the AVX-512 path is not the one of the build"
          exit 1
        fi
    - name: Build
      shell: bash
      run: cmake --build build --config ${{ inputs.config }} -j 4
    - name: Tests under SDE
      shell: bash
      run: sh .github/scripts/sde-tests.sh "$(cygpath -u "$SDE_PATH")/sde.exe" build/tests/${{ inputs.config }}
