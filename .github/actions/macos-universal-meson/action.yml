# The steps of the job universal-meson of macos.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: macos-universal-meson
description: The job universal-meson of macos.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Rosetta, to run x86_64 programs on arm64
      shell: bash -e {0}
      run: sudo softwareupdate --install-rosetta --agree-to-license
    - name: Tools
      shell: bash -e {0}
      run: |
        brew install pipx
        pipx install --force meson
        pipx install ninja
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Configure
      shell: bash -e {0}
      run: |
        set -o pipefail
        c++ --version
        archs="-arch arm64 -arch x86_64"
        meson setup build-meson -Dwith-tests=true "-Dc_args=$archs" "-Dcpp_args=$archs" "-Dc_link_args=$archs" "-Dcpp_link_args=$archs" | tee configure.log
        grep -q "Universal build of macOS" configure.log
    - name: The intervals of each architecture
      shell: bash -e {0}
      run: |
        for spec in "arm64 NEON SSE2" "x86_64 SSE2 NEON"; do
          # shellcheck disable=SC2086
          set -- $spec
          echo '#include "gaol/gaol_configuration.h"' | c++ -arch "$1" -I build-meson -x c++ -dM -E - | grep GAOL_USING_ > "macros-$1.txt"
          cat "macros-$1.txt"
          grep -q "^#define GAOL_USING_$2_INSTRUCTIONS 1" "macros-$1.txt"
          if grep -q "^#define GAOL_USING_$3_INSTRUCTIONS 1" "macros-$1.txt"; then
            echo "::error::the $1 part has the $3 intervals"
            exit 1
          fi
        done
    - name: Build
      shell: bash -e {0}
      run: meson compile -C build-meson
    - name: Tests of the arm64 part (natively)
      shell: bash -e {0}
      run: |
        lipo -archs build-meson/tests/gaol_test_arithmetic
        meson test -C build-meson --print-errorlogs
    - name: Tests of the x86_64 part (Rosetta)
      shell: bash -e {0}
      run: |
        count=0
        for t in build-meson/tests/gaol_test_*; do
          if [ -f "$t" ] && [ -x "$t" ] && lipo -archs "$t" > /dev/null 2>&1; then
            echo "== $t"
            status=0
            arch -x86_64 "$t" || status=$?
            if [ "$status" != 0 ] && [ "$status" != 77 ]; then
              echo "::error::$t failed ($status)"
              exit 1
            fi
            count=$((count + 1))
          fi
        done
        echo "$count test programs ran under Rosetta"
        test "$count" -ge 20
    - name: Which intervals each part has
      shell: bash -e {0}
      run: |
        build-meson/tests/gaol_performance | head -n 1 | tee arm64.txt
        arch -x86_64 build-meson/tests/gaol_performance | head -n 1 | tee x86_64.txt
        grep -q "NEON intervals" arm64.txt
        grep -q "SSE2 intervals" x86_64.txt
