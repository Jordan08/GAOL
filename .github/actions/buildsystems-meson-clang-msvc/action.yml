# Clang with the target of Visual C++ and the driver of GCC (clang++, not
# clang-cl), in the environment of Visual Studio (GAOL v5), as the CMake job
# of windows.yml
# The steps of the job meson-clang-msvc of build-systems.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: buildsystems-meson-clang-msvc
description: The job meson-clang-msvc of build-systems.yml for one configuration
inputs:
  arch:
    description: The key arch of the row of the matrix of the job
    default: ''
  cpu:
    description: The key cpu of the row of the matrix of the job
    default: ''
  cpu_family:
    description: The key cpu_family of the row of the matrix of the job
    default: ''
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
  machine:
    description: The key machine of the row of the matrix of the job
    default: ''
  target:
    description: The key target of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch }}
    # The clang of an x86 configuration is the one of LLVM: the call of
    # ilammy/msvc-dev-cmd of an x64 configuration of the job leaves the clang of
    # Visual Studio for x64 first in PATH, and the call of an x86 one does not
    # remove it (GAOL v5)
    - name: The clang of the architecture asked for
      shell: pwsh
      run: |
        $clang = (Get-Command clang++).Source
        Write-Output $clang
        if ('${{ inputs.arch }}' -eq 'x86' -and $clang -like '*\Llvm\x64\*') { Write-Output 'the clang of Visual Studio for x64 is first in PATH'; exit 1 }
    - name: Tools
      shell: pwsh
      run: pip install meson ninja
    # meson gives the linker /MACHINE:X64 for Clang with the driver of GCC and
    # the target of Visual C++, whatever the target (the file of
    # cross-compilation names the machine, the target is in the command of the
    # compiler, and the machine is given again to the linker, whose last
    # option counts). The programs of x86 run on the runner, so that no wrapper
    # is needed
    - name: The file of cross-compilation
      shell: pwsh
      run: |
        @"
        [binaries]
        c = ['clang', '--target=${{ inputs.target }}']
        cpp = ['clang++', '--target=${{ inputs.target }}']

        [built-in options]
        c_link_args = ['-Wl,/MACHINE:${{ inputs.machine }}']
        cpp_link_args = ['-Wl,/MACHINE:${{ inputs.machine }}']

        [host_machine]
        system = 'windows'
        cpu_family = '${{ inputs.cpu_family }}'
        cpu = '${{ inputs.cpu }}'
        endian = 'little'

        [properties]
        needs_exe_wrapper = false
        "@ | Set-Content -Encoding ascii cross.txt
        Get-Content cross.txt
    - name: Configure, build and install
      shell: pwsh
      run: |
        clang++ --version
        $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
        meson setup build-meson --cross-file cross.txt --prefix="$prefix" --libdir=lib -Dwith-tests=true
        if ($LASTEXITCODE) { exit 1 }
        meson compile -C build-meson
        if ($LASTEXITCODE) { exit 1 }
        meson install -C build-meson
        if ($LASTEXITCODE) { exit 1 }
    - name: The intervals
      shell: bash
      run: sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h sse2
    - name: Tests (ninja test)
      shell: pwsh
      run: |
        ninja -C build-meson test
        if ($LASTEXITCODE) { Get-Content build-meson/meson-logs/testlog.txt; exit 1 }
