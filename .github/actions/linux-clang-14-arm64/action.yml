# Clang 14 does not honour the rounding direction on 64-bit ARM, for the C
# compiler, which builds CORE-MATH, as for the C++ compiler: each of the three
# builds has to refuse it for either alone (GAOL v5)
# The steps of the job clang-14-arm64 of linux.yml, for one configuration of
# the group of the job that calls this action (GAOL v5).
name: linux-clang-14-arm64
description: The job clang-14-arm64 of linux.yml for one configuration
inputs:
  desc:
    description: The key desc of the row of the matrix of the job
    default: ''
runs:
  using: composite
  steps:
    # In a group of configurations the job runs several of them: each
    # starts from the tree as git has it, and from a temporary directory
    # without what the previous ones left in it (GAOL v5)
    - name: The tree and the temporary directory as the job found them
      shell: bash
      env:
        DESC: ${{ inputs.desc }}
      run: |
        printf '\n## %s\n\n' "$DESC" >> "$GITHUB_STEP_SUMMARY"
        if [ "$RUNNER_OS" = Linux ]; then
          # the containers write as root in the tree
          sudo chown -R "$(id -u):$(id -g)" .
        fi
        git clean -ffdx -q
        git reset --hard -q
        for name in gaol gaol_installed.lib configure.log no-python build-no-python audit multi multi.log; do rm -rf "${RUNNER_TEMP:?}/$name"; done
        test -z "$(git status --porcelain --ignored)"
    - name: Configure with Clang 14, which does not honour the rounding direction on 64-bit ARM and has to be refused
      shell: bash -e {0}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q clang-14 cmake make meson ninja-build
        clang++-14 --version
        # refused <what> <command...>: the command has to fail, saying why
        refused() {
          what=$1; shift
          if "$@" > configure.log 2>&1; then
            cat configure.log
            echo "$what: Clang 14 was not refused"
            return 1
          fi
          cat configure.log
          grep -q "GAOL cannot be built with" configure.log
        }
        for pair in "clang-14 clang++-14" "clang-14 g++" "gcc clang++-14"; do
          # shellcheck disable=SC2086
          set -- $pair
          rm -rf build build-ac build-meson && mkdir build-ac
          refused "CMake with $1 and $2" env CC="$1" CXX="$2" cmake -S . -B build
          refused "configure with $1 and $2" sh -c "cd build-ac && CC=$1 CXX=$2 ../configure"
          refused "meson with $1 and $2" env CC="$1" CXX="$2" meson setup build-meson
        done
