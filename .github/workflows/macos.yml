# Builds GAOL with CMake on macOS, arm64 and x86_64 (natively or under Rosetta),
# runs its tests, installs it, and builds the tests again with the installed
# GAOL. Also with the sanitizers, with AppleClang, LLVM's Clang and GCC, and
# with AppleClang and -Wall -Wextra -Werror (GAOL v5). macOS has fr_FR.UTF-8, a
# locale writing a decimal comma: each job checks after its tests that numbers
# read and wrote numbers under it (.github/scripts/comma-locale.sh) (GAOL v5).
#
# A job is a group of configurations that run one after the other on the
# same image of runner, each one an action of .github/actions/ called
# with the row of the matrix it had when it was a job of its own: the
# configurations, their options and their checks are those of the jobs
# they replace (GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# By: Jordan NININ (created 2026-09-20)
#
# GAOL is a software distributed WITHOUT ANY WARRANTY. Read the associated
# COPYING.LIB file for information.

name: macOS

on:
  push:
    branches: [master, configure-clean, dev, experiment-ci-groups]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:

  m1:
    name: 'macOS 15 arm64 (4 configurations)'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 15 arm64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 15 arm64'
          arch: 'arm64'
      # The FPU intervals, which the NEON ones replace on arm64 (GAOL v5)
      - id: c2
        name: 'macOS 15 arm64, FPU intervals'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 15 arm64, FPU intervals'
          arch: 'arm64'
          opts: '-DGAOL_SIMD=OFF'
      - id: c3
        name: 'macOS 15 arm64, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 15 arm64, rounding direction preserved'
          arch: 'arm64'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
      - id: c4
        name: 'macOS 15 universal (arm64 and x86_64)'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal
        with:
          desc: 'macOS 15 universal (arm64 and x86_64)'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 15 arm64' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 15 arm64' ;;
              c2) name='macOS 15 arm64, FPU intervals' ;;
              c3) name='macOS 15 arm64, rounding direction preserved' ;;
              c4) name='macOS 15 universal (arm64 and x86_64)' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m2:
    name: 'macOS 15 universal, autotools and meson (2 configurations)'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 15 universal (arm64 and x86_64), autotools'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal-autotools
        with:
          desc: 'macOS 15 universal (arm64 and x86_64), autotools'
      - id: c2
        name: 'macOS 15 universal (arm64 and x86_64), meson'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal-meson
        with:
          desc: 'macOS 15 universal (arm64 and x86_64), meson'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 15 universal, autotools and meson' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 15 universal (arm64 and x86_64), autotools' ;;
              c2) name='macOS 15 universal (arm64 and x86_64), meson' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m3:
    name: 'macOS 15 x86_64 (2 configurations)'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 15 x86_64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 15 x86_64'
          arch: 'x86_64'
      # numbers took 182 to 577 s in 30 runs (9 to 11 November), more than
      # 400 six times: 900
      - id: c2
        name: 'macOS 15 x86_64 GCC Debug ASan+UBSan'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-sanitizers
        with:
          desc: 'macOS 15 x86_64 GCC Debug ASan+UBSan'
          compiler: 'gcc'
          timeout: '900'
        env:
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 15 x86_64' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 15 x86_64' ;;
              c2) name='macOS 15 x86_64 GCC Debug ASan+UBSan' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m4:
    name: 'macOS 26 arm64, sanitizers (3 configurations)'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 26 arm64 AppleClang Debug ASan+UBSan'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-sanitizers
        with:
          desc: 'macOS 26 arm64 AppleClang Debug ASan+UBSan'
          compiler: 'appleclang'
        env:
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      - id: c2
        name: 'macOS 26 arm64 GCC Debug ASan+UBSan'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-sanitizers
        with:
          desc: 'macOS 26 arm64 GCC Debug ASan+UBSan'
          compiler: 'gcc'
        env:
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      # numbers took 162 to 297 s in 28 runs (9 to 11 November), and once
      # more than 300: 600
      - id: c3
        name: 'macOS 26 arm64 LLVM Clang Debug ASan+UBSan'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-sanitizers
        with:
          desc: 'macOS 26 arm64 LLVM Clang Debug ASan+UBSan'
          compiler: 'llvm'
          timeout: '600'
        env:
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 26 arm64, sanitizers' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 26 arm64 AppleClang Debug ASan+UBSan' ;;
              c2) name='macOS 26 arm64 GCC Debug ASan+UBSan' ;;
              c3) name='macOS 26 arm64 LLVM Clang Debug ASan+UBSan' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m5:
    name: 'macOS 26, Xcode universal and arm64 (2 configurations)'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 26 Xcode generator, universal (arm64 and x86_64)'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-xcode
        with:
          desc: 'macOS 26 Xcode generator, universal (arm64 and x86_64)'
          archs: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          universal: 'true'
      - id: c2
        name: 'macOS 26 arm64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 26 arm64'
          arch: 'arm64'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 26, Xcode universal and arm64' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 26 Xcode generator, universal (arm64 and x86_64)' ;;
              c2) name='macOS 26 arm64' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m6:
    name: 'macOS 26, Xcode without architectures, universal autotools, -Werror (3 configurations)'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 26 Xcode generator, no architectures given'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-xcode
        with:
          desc: 'macOS 26 Xcode generator, no architectures given'
          archs: ''
          universal: 'false'
      - id: c2
        name: 'macOS 26 universal (arm64 and x86_64), autotools'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal-autotools
        with:
          desc: 'macOS 26 universal (arm64 and x86_64), autotools'
      - id: c3
        name: 'macOS 26 arm64 AppleClang, -Wall -Wextra -Werror'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-warnings
        with:
          desc: 'macOS 26 arm64 AppleClang, -Wall -Wextra -Werror'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 26, Xcode without architectures, universal autotools, -Werror' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 26 Xcode generator, no architectures given' ;;
              c2) name='macOS 26 universal (arm64 and x86_64), autotools' ;;
              c3) name='macOS 26 arm64 AppleClang, -Wall -Wextra -Werror' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m7:
    name: 'macOS 26 universal, CMake and meson, and Rosetta (3 configurations)'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 26 universal (arm64 and x86_64)'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal
        with:
          desc: 'macOS 26 universal (arm64 and x86_64)'
      - id: c2
        name: 'macOS 26 universal (arm64 and x86_64), meson'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-universal-meson
        with:
          desc: 'macOS 26 universal (arm64 and x86_64), meson'
      - id: c3
        name: 'macOS 26 x86_64 (Rosetta)'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 26 x86_64 (Rosetta)'
          arch: 'x86_64'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'macOS 26 universal, CMake and meson, and Rosetta' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='macOS 26 universal (arm64 and x86_64)' ;;
              c2) name='macOS 26 universal (arm64 and x86_64), meson' ;;
              c3) name='macOS 26 x86_64 (Rosetta)' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  m8:
    name: 'macOS 27 arm64'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'macOS 27 arm64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/macos-cmake
        with:
          desc: 'macOS 27 arm64'
          arch: 'arm64'
