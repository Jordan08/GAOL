# Builds GAOL with CMake on macOS, arm64 and x86_64 (natively or under Rosetta),
# runs its tests, installs it, and builds the tests again with the installed
# GAOL. Also with the sanitizers, with AppleClang, LLVM's Clang and GCC, and
# with AppleClang and -Wall -Wextra -Werror (GAOL v5). macOS has fr_FR.UTF-8, a
# locale writing a decimal comma: each job checks after its tests that numbers
# read and wrote numbers under it (.github/scripts/comma-locale.sh) (GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: macOS

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  cmake:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26,       arch: arm64,  desc: 'macOS 26 arm64' }
          - { os: macos-26,       arch: x86_64, desc: 'macOS 26 x86_64 (Rosetta)' }
          - { os: macos-15,       arch: arm64,  desc: 'macOS 15 arm64' }
          - { os: macos-15-intel, arch: x86_64, desc: 'macOS 15 x86_64' }
          - { os: macos-14,       arch: arm64,  desc: 'macOS 14 arm64' }
          - { os: macos-14,       arch: x86_64, desc: 'macOS 14 x86_64 (Rosetta)' }
          - { os: macos-15,       arch: arm64,  opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'macOS 15 arm64, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        if: matrix.cfg.arch == 'x86_64' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        run: |
          c++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cfg.arch }} -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: |
          file build/tests/gaol_test_arithmetic
          cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        run: |
          set -o pipefail
          build/tests/gaol_performance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cfg.arch }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  # -Wall -Wextra -Werror with the AppleClang of macOS 26 arm64 (GAOL v5), as
  # with GCC and Clang in linux.yml: the library, the sources of CORE-MATH
  # included, the tests and the examples, and each header GAOL installs,
  # included alone (.github/scripts/headers.sh). -Werror goes to the targets
  # only (CMAKE_COMPILE_WARNING_AS_ERROR), so that no check of CMake fails on a
  # warning of its test program.
  warnings:
    name: macOS 26 arm64 AppleClang, -Wall -Wextra -Werror
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          c++ --version
          flags="-Wall -Wextra"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DWITH_EXAMPLES=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Install
        run: cmake --install build
      - name: The headers of the installed GAOL, each alone, and their macros
        run: sh .github/scripts/headers.sh "$PWD/gaol-install"

  sanitizers:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26,       compiler: appleclang, desc: 'macOS 26 arm64 AppleClang Debug ASan+UBSan' }
          - { os: macos-26,       compiler: llvm,       desc: 'macOS 26 arm64 LLVM Clang Debug ASan+UBSan' }
          - { os: macos-26,       compiler: gcc,        desc: 'macOS 26 arm64 GCC Debug ASan+UBSan' }
          # numbers took 146 to 367 s on the same code, and once more than 400: 600
          - { os: macos-15-intel, compiler: gcc,        timeout: 600, desc: 'macOS 15 x86_64 GCC Debug ASan+UBSan' }
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Compiler
        run: |
          case "${{ matrix.cfg.compiler }}" in
            gcc)
              brew install gcc
              major=$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)
              echo "CC=gcc-$major" >> "$GITHUB_ENV"
              echo "CXX=g++-$major" >> "$GITHUB_ENV"
              ;;
            llvm)
              brew install llvm
              prefix=$(brew --prefix llvm)
              echo "CC=$prefix/bin/clang" >> "$GITHUB_ENV"
              echo "CXX=$prefix/bin/clang++" >> "$GITHUB_ENV"
              echo "LDFLAGS=-L$prefix/lib/c++ -Wl,-rpath,$prefix/lib/c++" >> "$GITHUB_ENV"
              ;;
            *)
              echo "CC=clang" >> "$GITHUB_ENV"
              echo "CXX=clang++" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Configure
        run: |
          $CXX --version
          # halt_on_error (UBSAN_OPTIONS) stops a test on its first undefined
          # behaviour; none is suppressed
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            -DGAOL_NUMBERS_TIMEOUT=${{ matrix.cfg.timeout || 300 }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
