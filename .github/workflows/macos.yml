# Builds GAOL with CMake on macOS, arm64 and x86_64 (natively or under Rosetta),
# runs its tests, installs it, and builds the tests again with the installed
# GAOL. Also with the sanitizers, with AppleClang, LLVM's Clang and GCC, and
# with AppleClang and -Wall -Wextra -Werror (GAOL v5). macOS has fr_FR.UTF-8, a
# locale writing a decimal comma: each job checks after its tests that numbers
# read and wrote numbers under it (.github/scripts/comma-locale.sh) (GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: macOS

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  cmake:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26,       arch: arm64,  desc: 'macOS 26 arm64' }
          - { os: macos-26,       arch: x86_64, desc: 'macOS 26 x86_64 (Rosetta)' }
          - { os: macos-15,       arch: arm64,  desc: 'macOS 15 arm64' }
          - { os: macos-15-intel, arch: x86_64, desc: 'macOS 15 x86_64' }
          - { os: macos-14,       arch: arm64,  desc: 'macOS 14 arm64' }
          - { os: macos-14,       arch: x86_64, desc: 'macOS 14 x86_64 (Rosetta)' }
          - { os: macos-15,       arch: arm64,  opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'macOS 15 arm64, rounding direction preserved' }
          # The FPU intervals, which the NEON ones replace on arm64 (GAOL v5)
          - { os: macos-15,       arch: arm64,  opts: '-DGAOL_SIMD=OFF', desc: 'macOS 15 arm64, FPU intervals' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        if: matrix.cfg.arch == 'x86_64' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        run: |
          c++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cfg.arch }} -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      # NEON on arm64, SSE2 on x86_64 (under Rosetta too), the FPU where
      # -DGAOL_SIMD=OFF asked for it (GAOL v5)
      - name: The intervals
        run: |
          expected=sse2
          if [ "${{ matrix.cfg.arch }}" = arm64 ]; then expected=neon; fi
          case "${{ matrix.cfg.opts }}" in *GAOL_SIMD=OFF*) expected=fpu ;; esac
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h $expected
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: |
          file build/tests/gaol_test_arithmetic
          cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        run: |
          set -o pipefail
          build/tests/gaol_performance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cfg.arch }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  # A universal build (arm64 and x86_64 compiled from one configuration, GAOL
  # v5): each architecture takes its own intervals, NEON for arm64 and SSE2 for
  # x86_64, which the configuration header derives from __aarch64__ and
  # __x86_64__ (GAOL_UNIVERSAL_NEON and GAOL_UNIVERSAL_SSE2). The macros are
  # read for each architecture by the preprocessor, then the tests run natively
  # (the arm64 part) and under Rosetta (the x86_64 part), and the program of
  # performance says which intervals each one has.
  universal:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26, desc: 'macOS 26 universal (arm64 and x86_64)' }
          - { os: macos-15, desc: 'macOS 15 universal (arm64 and x86_64)' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        run: |
          c++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: The intervals of each architecture
        run: |
          for spec in "arm64 NEON SSE2" "x86_64 SSE2 NEON"; do
            set -- $spec
            echo '#include "gaol/gaol_configuration.h"' | c++ -arch $1 -I build -x c++ -dM -E - | grep GAOL_USING_ > macros-$1.txt
            cat macros-$1.txt
            grep -q "^#define GAOL_USING_$2_INSTRUCTIONS 1" macros-$1.txt
            if grep -q "^#define GAOL_USING_$3_INSTRUCTIONS 1" macros-$1.txt; then
              echo "::error::the $1 part has the $3 intervals"
              exit 1
            fi
          done
      - name: Build
        run: cmake --build build -j 4
      - name: Tests of the arm64 part (natively)
        run: |
          lipo -archs build/tests/gaol_test_arithmetic
          cmake --build build --target test
      # The test programs themselves, not ctest, which is arm64 only on the
      # runner (Homebrew): a program that skips gives 77
      - name: Tests of the x86_64 part (Rosetta)
        run: |
          for t in build/tests/gaol_test_*; do
            if [ -f "$t" ] && [ -x "$t" ]; then
              echo "== $t"
              status=0
              arch -x86_64 "$t" || status=$?
              if [ "$status" != 0 ] && [ "$status" != 77 ]; then
                echo "::error::$t failed ($status)"
                exit 1
              fi
            fi
          done
      - name: Which intervals each part has
        run: |
          build/tests/gaol_performance | head -n 1 | tee arm64.txt
          arch -x86_64 build/tests/gaol_performance | head -n 1 | tee x86_64.txt
          grep -q "NEON intervals" arm64.txt
          grep -q "SSE2 intervals" x86_64.txt

  # The generator of Xcode builds the architectures of $(ARCHS_STANDARD), arm64
  # and x86_64, when CMAKE_OSX_ARCHITECTURES is not given, from one
  # configuration (GAOL v5): CMake gives Xcode the architecture of the machine
  # then, as the other generators, configure and meson build for it alone, and
  # the configuration has the intervals of that architecture. With the list
  # "arm64;x86_64" the build is universal, as with the other generators, and its
  # programs run natively (arm64) and under Rosetta (x86_64). The programs of
  # the generator of Xcode are in build/tests/Release.
  xcode:
    name: ${{ matrix.cfg.desc }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { archs: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64', universal: true,  desc: 'macOS 26 Xcode generator, universal (arm64 and x86_64)' }
          - { archs: '',                                       universal: false, desc: 'macOS 26 Xcode generator, no architectures given' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        if: matrix.cfg.universal
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        env:
          ARCHS: ${{ matrix.cfg.archs }}
        run: |
          xcodebuild -version
          cmake -S . -B build -G Xcode -DWITH_TESTS=ON ${ARCHS:+"$ARCHS"}
      - name: The intervals of each architecture
        if: matrix.cfg.universal
        run: |
          for spec in "arm64 NEON SSE2" "x86_64 SSE2 NEON"; do
            # shellcheck disable=SC2086
            set -- $spec
            echo '#include "gaol/gaol_configuration.h"' | c++ -arch "$1" -I build -x c++ -dM -E - | grep GAOL_USING_ > "macros-$1.txt"
            cat "macros-$1.txt"
            grep -q "^#define GAOL_USING_$2_INSTRUCTIONS 1" "macros-$1.txt"
            if grep -q "^#define GAOL_USING_$3_INSTRUCTIONS 1" "macros-$1.txt"; then
              echo "::error::the $1 part has the $3 intervals"
              exit 1
            fi
          done
      - name: The intervals of the architecture of the machine
        if: ${{ !matrix.cfg.universal }}
        run: sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h neon
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: The architectures built
        run: |
          archs=$(lipo -archs build/tests/Release/gaol_test_arithmetic)
          echo "lipo: $archs"
          if [ "${{ matrix.cfg.universal }}" = true ]; then
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac
          else
            [ "$archs" = arm64 ] || { echo "::error::the architecture of the machine alone was expected: $archs"; exit 1; }
          fi
      - name: Tests of the arm64 part (natively)
        run: cd build && ctest -C Release --output-on-failure -j 4
      - name: Tests of the x86_64 part (Rosetta)
        if: matrix.cfg.universal
        run: |
          count=0
          for t in build/tests/Release/gaol_test_*; do
            if [ -f "$t" ] && [ -x "$t" ]; then
              echo "== $t"
              status=0
              arch -x86_64 "$t" || status=$?
              if [ "$status" != 0 ] && [ "$status" != 77 ]; then
                echo "::error::$t failed ($status)"
                exit 1
              fi
              count=$((count + 1))
            fi
          done
          test "$count" -ge 20
      - name: Which intervals each part has
        if: matrix.cfg.universal
        run: |
          build/tests/Release/gaol_performance | head -n 1 | tee arm64.txt
          arch -x86_64 build/tests/Release/gaol_performance | head -n 1 | tee x86_64.txt
          grep -q "NEON intervals" arm64.txt
          grep -q "SSE2 intervals" x86_64.txt

  # The same universal build with autotools and with meson (GAOL v5): the
  # architectures are in the flags of the compilers (-arch twice), configure and
  # meson reading them, and the configuration is the one CMake gives
  # (GAOL_UNIVERSAL_SSE2 and GAOL_UNIVERSAL_NEON of gaol_configuration.h): the
  # intervals of each architecture are read by the preprocessor, the tests run
  # natively (arm64) and under Rosetta (x86_64), and the program of performance
  # says which intervals each part has. Not checked on a machine other than the
  # runner (the maintainer's has no macOS).
  universal-autotools:
    name: ${{ matrix.cfg.desc }}, autotools
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26, desc: 'macOS 26 universal (arm64 and x86_64)' }
          - { os: macos-15, desc: 'macOS 15 universal (arm64 and x86_64)' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        run: |
          set -o pipefail
          c++ --version
          archs="-arch arm64 -arch x86_64"
          ./configure CFLAGS="$archs" CXXFLAGS="$archs" LDFLAGS="$archs" --with-tests | tee configure.log
          grep -q "universal build of macOS" configure.log
      - name: The intervals of each architecture
        run: |
          for spec in "arm64 NEON SSE2" "x86_64 SSE2 NEON"; do
            set -- $spec
            echo '#include "gaol/gaol_configuration.h"' | c++ -arch $1 -I . -x c++ -dM -E - | grep GAOL_USING_ > macros-$1.txt
            cat macros-$1.txt
            grep -q "^#define GAOL_USING_$2_INSTRUCTIONS 1" macros-$1.txt
            if grep -q "^#define GAOL_USING_$3_INSTRUCTIONS 1" macros-$1.txt; then
              echo "::error::the $1 part has the $3 intervals"
              exit 1
            fi
          done
      - name: Build
        run: make -j 4
      - name: Tests of the arm64 part (natively)
        run: |
          lipo -archs tests/arithmetic
          make -j 4 test || { cat tests/test-suite.log; exit 1; }
      # The test programs themselves: a program that skips gives 77
      - name: Tests of the x86_64 part (Rosetta)
        run: |
          count=0
          for t in tests/*; do
            case "$t" in */gaol_performance) continue ;; esac
            if [ -f "$t" ] && [ -x "$t" ] && lipo -archs "$t" > /dev/null 2>&1; then
              echo "== $t"
              status=0
              arch -x86_64 "$t" || status=$?
              if [ "$status" != 0 ] && [ "$status" != 77 ]; then
                echo "::error::$t failed ($status)"
                exit 1
              fi
              count=$((count + 1))
            fi
          done
          echo "$count test programs ran under Rosetta"
          test "$count" -ge 20
      - name: Which intervals each part has
        run: |
          tests/gaol_performance | head -n 1 | tee arm64.txt
          arch -x86_64 tests/gaol_performance | head -n 1 | tee x86_64.txt
          grep -q "NEON intervals" arm64.txt
          grep -q "SSE2 intervals" x86_64.txt

  universal-meson:
    name: ${{ matrix.cfg.desc }}, meson
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26, desc: 'macOS 26 universal (arm64 and x86_64)' }
          - { os: macos-15, desc: 'macOS 15 universal (arm64 and x86_64)' }
    steps:
      - uses: actions/checkout@v7
      - name: Rosetta, to run x86_64 programs on arm64
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Tools
        run: |
          brew install pipx
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          set -o pipefail
          c++ --version
          archs="-arch arm64 -arch x86_64"
          meson setup build-meson -Dwith-tests=true "-Dc_args=$archs" "-Dcpp_args=$archs" "-Dc_link_args=$archs" "-Dcpp_link_args=$archs" | tee configure.log
          grep -q "Universal build of macOS" configure.log
      - name: The intervals of each architecture
        run: |
          for spec in "arm64 NEON SSE2" "x86_64 SSE2 NEON"; do
            set -- $spec
            echo '#include "gaol/gaol_configuration.h"' | c++ -arch $1 -I build-meson -x c++ -dM -E - | grep GAOL_USING_ > macros-$1.txt
            cat macros-$1.txt
            grep -q "^#define GAOL_USING_$2_INSTRUCTIONS 1" macros-$1.txt
            if grep -q "^#define GAOL_USING_$3_INSTRUCTIONS 1" macros-$1.txt; then
              echo "::error::the $1 part has the $3 intervals"
              exit 1
            fi
          done
      - name: Build
        run: meson compile -C build-meson
      - name: Tests of the arm64 part (natively)
        run: |
          lipo -archs build-meson/tests/gaol_test_arithmetic
          meson test -C build-meson --print-errorlogs
      - name: Tests of the x86_64 part (Rosetta)
        run: |
          count=0
          for t in build-meson/tests/gaol_test_*; do
            if [ -f "$t" ] && [ -x "$t" ] && lipo -archs "$t" > /dev/null 2>&1; then
              echo "== $t"
              status=0
              arch -x86_64 "$t" || status=$?
              if [ "$status" != 0 ] && [ "$status" != 77 ]; then
                echo "::error::$t failed ($status)"
                exit 1
              fi
              count=$((count + 1))
            fi
          done
          echo "$count test programs ran under Rosetta"
          test "$count" -ge 20
      - name: Which intervals each part has
        run: |
          build-meson/tests/gaol_performance | head -n 1 | tee arm64.txt
          arch -x86_64 build-meson/tests/gaol_performance | head -n 1 | tee x86_64.txt
          grep -q "NEON intervals" arm64.txt
          grep -q "SSE2 intervals" x86_64.txt

  # -Wall -Wextra -Werror with the AppleClang of macOS 26 arm64 (GAOL v5), as
  # with GCC and Clang in linux.yml: the library, the sources of CORE-MATH
  # included, the tests and the examples, and each header GAOL installs,
  # included alone (.github/scripts/headers.sh). -Werror goes to the targets
  # only (CMAKE_COMPILE_WARNING_AS_ERROR), so that no check of CMake fails on a
  # warning of its test program.
  warnings:
    name: macOS 26 arm64 AppleClang, -Wall -Wextra -Werror
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          c++ --version
          flags="-Wall -Wextra"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DWITH_EXAMPLES=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Install
        run: cmake --install build
      - name: The headers of the installed GAOL, each alone, and their macros
        run: sh .github/scripts/headers.sh "$PWD/gaol-install"

  sanitizers:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-26,       compiler: appleclang, desc: 'macOS 26 arm64 AppleClang Debug ASan+UBSan' }
          - { os: macos-26,       compiler: llvm,       desc: 'macOS 26 arm64 LLVM Clang Debug ASan+UBSan' }
          - { os: macos-26,       compiler: gcc,        desc: 'macOS 26 arm64 GCC Debug ASan+UBSan' }
          # numbers took 146 to 367 s on the same code, and once more than 400: 600
          - { os: macos-15-intel, compiler: gcc,        timeout: 600, desc: 'macOS 15 x86_64 GCC Debug ASan+UBSan' }
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Compiler
        run: |
          case "${{ matrix.cfg.compiler }}" in
            gcc)
              brew install gcc
              major=$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)
              echo "CC=gcc-$major" >> "$GITHUB_ENV"
              echo "CXX=g++-$major" >> "$GITHUB_ENV"
              ;;
            llvm)
              brew install llvm
              prefix=$(brew --prefix llvm)
              echo "CC=$prefix/bin/clang" >> "$GITHUB_ENV"
              echo "CXX=$prefix/bin/clang++" >> "$GITHUB_ENV"
              echo "LDFLAGS=-L$prefix/lib/c++ -Wl,-rpath,$prefix/lib/c++" >> "$GITHUB_ENV"
              ;;
            *)
              echo "CC=clang" >> "$GITHUB_ENV"
              echo "CXX=clang++" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Configure
        run: |
          $CXX --version
          # halt_on_error (UBSAN_OPTIONS) stops a test on its first undefined
          # behaviour; none is suppressed
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            -DGAOL_NUMBERS_TIMEOUT=${{ matrix.cfg.timeout || 300 }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
