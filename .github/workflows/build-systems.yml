# Checks that GAOL still builds the ways it did before its CMake build: with
# autotools and with meson, which compile the sources of CORE-MATH into libgaol
# as the CMake build does. Each build runs the unit tests (make test, ninja
# test), and the tests are built again with each installed GAOL, on Linux
# (x86_64, arm64, and i386 and armhf in containers), macOS (arm64, x86_64) and
# Windows (MSYS2, and Visual C++ with meson). Checks that the three builds give
# GAOL the same configuration on each kind of machine (.github/audit). Each job
# that runs the unit tests checks that numbers read and wrote numbers under a
# locale writing a decimal comma, which the Linux jobs and the containers
# generate first, macOS and Windows having one (.github/scripts/comma-locale.sh,
# GAOL v5). The autotools jobs check that make distclean gives the sources back
# as git has them.
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Autotools and meson

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The flags code using GAOL is compiled with (see CMakeLists.txt); on a
  # 32-bit x86 processor, tests.sh adds -msse2 -mfpmath=sse
  TEST_FLAGS: -std=c++17 -O2 -frounding-math -fno-fast-math -ffp-contract=off
  # Four tests at a time with make test (automake) and ninja test (meson)
  MESON_TESTTHREADS: 4

jobs:
  autotools:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     configure: '',                           desc: 'Autotools, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, configure: '',                           desc: 'Autotools, Ubuntu 24.04 arm64' }
          - { os: macos-15,         configure: '',                           desc: 'Autotools, macOS 15 arm64' }
          - { os: macos-15-intel,   configure: '',                           desc: 'Autotools, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 arm64, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake make
          fi
      - name: configure generated for the version of VERSION.txt
        run: |
          # configure reads VERSION.txt when it runs, but configure --version
          # and --help give the version of the last generation of configure,
          # which is to be generated again when VERSION.txt changes
          # (doc/building.md). With the commands of configure.ac, without the
          # byte order mark that an editor may have written at the start of
          # the file, nor the blanks around the version
          version=$(LC_ALL=C tr -d '\000' < VERSION.txt | LC_ALL=C sed -e "1s/^$(printf '\357\273\277')//" -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | tr '\n' ' ' | sed -e 's/ $//')
          ./configure --version | head -n 1
          test "$(./configure --version | head -n 1)" = "gaol configure $version" || {
            echo "configure was not generated again for GAOL $version (see doc/building.md)"; exit 1; }
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        run: sh .github/scripts/version-file.sh configure
      - name: VERSION.txt read by autoconf, as by configure
        # Once per runner: the jobs with configure's options read the same file
        if: runner.os == 'Linux' && matrix.cfg.configure == ''
        run: |
          # autoconf reads VERSION.txt for the version of configure --version
          # when it generates configure, which no build does: the script
          # generates configure in a copy of the sources (the autoconf of
          # Ubuntu, 2.71, warns that aclocal.m4 was generated for autoconf
          # 2.72, and works)
          sudo apt-get install -y -q autoconf
          sh .github/scripts/version-file.sh autoconf
      - name: Configure, build and install
        run: |
          # The same date on every file, as in a release archive: make then
          # does not regenerate configure, the Makefile.in or the lexer
          find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
          # The output of configure out of the sources, which make distclean
          # is to give back as git has them
          ./configure --prefix="$RUNNER_TEMP/gaol" --with-tests ${{ matrix.cfg.configure }} | tee "$RUNNER_TEMP/configure.log"
          # config.status writes each of its files again when given its name,
          # as the rules of make that follow the templates do: the m4 macro of
          # the version named gaol_version made it refuse
          # manual/v5/gaol_version.tex, which it knew as manual/v5/5.0.0.tex
          ./config.status gaol.pc manual/v4/gaol_version.tex manual/v5/gaol_version.tex
          grep -E "^(CXXFLAGS|CPPFLAGS) =" gaol/Makefile
          make -j 4
          make install
          # CORE-MATH is compiled into libgaol: no other library is installed
          grep -q "elementary functions" "$RUNNER_TEMP/configure.log"
          ls "$RUNNER_TEMP/gaol/lib"
          ! ls "$RUNNER_TEMP/gaol/lib" | grep "^lib" | grep -v "^libgaol"
      - name: Locale writing a decimal comma
        if: runner.os == 'Linux'
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests (make test)
        run: make -j 4 test || { cat tests/test-suite.log; exit 1; }
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check tests/numbers.log
      - name: make distclean gives the sources back as git has them
        run: |
          # make clean keeps what configure made, for make to build again
          # without configure; make distclean erases it too, the .deps and
          # .dirstamp of the dependencies and of CORE-MATH among them
          # (doc/building.md). Before tests.sh, which compiles its tests at the
          # root of the sources. git status shows no empty directory, as the
          # .deps that make distclean left, emptied, before GAOL v5's
          # distclean-local: find looks for them, a checkout having none
          make distclean
          git status --short --ignored
          empty=$(find . -path ./.git -prune -o -type d -empty -print)
          echo "$empty"
          test -z "$(git status --porcelain --ignored)$empty" || {
            echo "make distclean left the files or the empty directories above, or changed files"; exit 1; }
      - name: Tests built with the installed GAOL
        run: |
          sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" static
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  meson:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     options: '',                                desc: 'Meson, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, options: '',                                desc: 'Meson, Ubuntu 24.04 arm64' }
          - { os: macos-15,         options: '',                                desc: 'Meson, macOS 15 arm64' }
          - { os: macos-15-intel,   options: '',                                desc: 'Meson, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     options: '-Denable-preserve-rounding=true', desc: 'Meson, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: macos-15,         options: '-Denable-preserve-rounding=true', desc: 'Meson, macOS 15 arm64, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake pipx
          else
            brew install pipx
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        run: sh .github/scripts/version-file.sh meson
      - name: meson setup with no Python on PATH
        if: runner.os == 'Linux'
        run: |
          # meson.build reads VERSION.txt with find_program('python3', 'python'):
          # when PATH holds neither, meson takes the Python that runs it, as the
          # meson.exe of the Windows installer does on a machine without Python,
          # but only for a first name that ends with python3 (doc/building.md).
          # PATH is here a directory of links to the programs of PATH but
          # Python's; meson itself runs, the interpreter of its script being
          # named by its absolute path
          nopython="$RUNNER_TEMP/no-python"
          mkdir "$nopython"
          echo "$PATH" | tr ':' '\n' | while read -r dir; do
            for program in "$dir"/*; do
              name=${program##*/}
              case "$name" in python*) continue ;; esac
              if [ -f "$program" ] && [ -x "$program" ] && [ ! -e "$nopython/$name" ]; then
                ln -s "$program" "$nopython/$name"
              fi
            done
          done
          if PATH="$nopython" command -v python3 || PATH="$nopython" command -v python; then
            echo "a Python is on PATH"; exit 1
          fi
          PATH="$nopython" meson setup "$RUNNER_TEMP/build-no-python"
      - name: Configure, build and install
        run: |
          meson --version
          meson setup build-meson --prefix="$RUNNER_TEMP/gaol" --libdir=lib -Dwith-tests=true ${{ matrix.cfg.options }} | tee configure.log
          meson compile -C build-meson
          meson install -C build-meson
          # CORE-MATH is compiled into libgaol: no other library is installed
          grep -qi "elementary functions" configure.log
          ls "$RUNNER_TEMP/gaol/lib"
          ! ls "$RUNNER_TEMP/gaol/lib" | grep "^lib" | grep -v "^libgaol"
      - name: Locale writing a decimal comma
        if: runner.os == 'Linux'
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests (ninja test, make test of meson)
        run: ninja -C build-meson test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" shared
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # meson with Visual C++: the static libgaol, as CMake builds it, its tests,
  # and the installed GAOL, with which a test is compiled again (GAOL v5). In
  # PowerShell: the link of Git Bash would hide the linker of Visual C++.
  meson-msvc:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2022,        arch: x64, desc: 'Meson, Visual Studio 2022 x64' }
          - { os: windows-2025-vs2026, arch: x64, desc: 'Meson, Visual Studio 2026 x64' }
          - { os: windows-2022,        arch: x86, desc: 'Meson, Visual Studio 2022 x86' }
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cfg.arch }}
      - name: Tools
        run: pip install meson ninja
      - name: Configure, build and install
        run: |
          meson --version
          $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson setup build-meson --prefix="$prefix" --libdir=lib -Dwith-tests=true
          if ($LASTEXITCODE) { exit 1 }
          meson compile -C build-meson
          if ($LASTEXITCODE) { exit 1 }
          meson install -C build-meson
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem -Recurse -File $prefix | ForEach-Object { $_.FullName }
          # What the code using GAOL includes with Visual C++, and the
          # configuration, in include/gaol under the prefix
          foreach ($f in 'gaol_configuration.h', 'gaol_fpu_msvc.h', 'sysdeps/gaol_exact_msvc.h') {
            if (-not (Test-Path "$prefix/include/gaol/$f")) { Write-Output "$f is not installed"; exit 1 }
          }
      - name: Tests (ninja test, make test of meson)
        run: |
          ninja -C build-meson test
          if ($LASTEXITCODE) { Get-Content build-meson/meson-logs/testlog.txt; exit 1 }
      - name: The test numbers ran under a locale writing a decimal comma
        shell: bash
        run: sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
      - name: A test built with the installed GAOL
        run: |
          $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
          $lib = Get-ChildItem "$prefix/lib" | Where-Object { $_.Name -match 'gaol\.(lib|a)$' } | Select-Object -First 1
          # /MD: the C runtime of the DLLs, which meson builds libgaol with
          cl /nologo /MD /O2 /EHsc /std:c++17 /fp:strict /D__GAOL_PUBLIC__= /D_CRT_SECURE_NO_WARNINGS "/I$prefix/include" /Itests tests/rounding_direction.cpp $lib.FullName /Fe:rounding_direction.exe
          if ($LASTEXITCODE) { exit 1 }
          ./rounding_direction.exe
          if ($LASTEXITCODE) { exit 1 }

  container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: autotools, desc: 'Autotools, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: meson,     desc: 'Meson, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: autotools, desc: 'Autotools, Debian 13 Trixie armhf' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: meson,     desc: 'Meson, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Build and tests
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol -e TEST_FLAGS -e MESON_TESTTHREADS ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ make meson ninja-build locales > /dev/null
            uname -m && c++ --version | head -1
            sh .github/scripts/comma-locale.sh generate
            if [ ${{ matrix.cfg.build }} = autotools ]; then
              find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
              ./configure --prefix=/tmp/gaol --with-tests
              grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
              make -j 4 && make install
              make -j 4 test
              sh .github/scripts/comma-locale.sh check tests/numbers.log
              sh .github/scripts/tests.sh /tmp/gaol static
            else
              meson setup build-meson --prefix=/tmp/gaol --libdir=lib -Dwith-tests=true
              meson compile -C build-meson && meson install -C build-meson
              ninja -C build-meson test
              sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
              sh .github/scripts/tests.sh /tmp/gaol shared
            fi
            ./performance | tee /gaol/performance.md"
          cat performance.md >> "$GITHUB_STEP_SUMMARY"

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, desc: 'Autotools, MSYS2 UCRT64 GCC x64' }
          - { build: meson,     desc: 'Meson, MSYS2 UCRT64 GCC x64' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson make libtool
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        if: matrix.cfg.build == 'meson'
        run: sh .github/scripts/version-file.sh meson
      - name: Configure, build and install
        run: |
          prefix="$(cygpath -m "$RUNNER_TEMP")/gaol"
          if [ ${{ matrix.cfg.build }} = autotools ]; then
            find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
            ./configure --prefix="$prefix" --with-tests
            grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
            make -j 4 && make install
            make -j 4 test
            sh .github/scripts/comma-locale.sh check tests/numbers.log
          else
            meson setup build-meson --prefix="$prefix" --libdir=lib -Dwith-tests=true
            meson compile -C build-meson && meson install -C build-meson
            ninja -C build-meson test
            sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
          fi
          # CORE-MATH is compiled into libgaol: no other library is installed
          ls "$prefix/lib"
          ! ls "$prefix/lib" | grep "^lib" | grep -v "^libgaol"
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$(cygpath -m "$RUNNER_TEMP")/gaol" static
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # The three builds give GAOL the same configuration (.github/audit)
  agree:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 arm64 Clang' }
          - { os: macos-15,         cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 arm64' }
          - { os: macos-15-intel,   cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 x86_64' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ clang cmake make pipx
          else
            brew install pipx
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure with the three builds and compare
        run: |
          sh .github/audit/audit.sh audit ${{ matrix.cfg.cc }} ${{ matrix.cfg.cxx }} . "$RUNNER_TEMP/audit" meson
          status=0; python3 .github/audit/compare.py --check "$RUNNER_TEMP/audit/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$RUNNER_TEMP/audit/audit" $status

  agree-container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', desc: 'The builds agree, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   desc: 'The builds agree, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure with the three builds and compare
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ cmake make meson ninja-build python3 > /dev/null
            sh .github/audit/audit.sh audit gcc g++ /gaol /tmp/audit meson
            status=0; python3 .github/audit/compare.py --check /tmp/audit/audit.json > /gaol/agree.md || status=\$?
            cat /gaol/agree.md
            sh .github/audit/logs.sh /tmp/audit/audit \$status"
          cat agree.md >> "$GITHUB_STEP_SUMMARY"

  agree-msys2:
    name: The builds agree, MSYS2 UCRT64 GCC x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-python make libtool
      - name: Configure with the three builds and compare
        run: |
          export CMAKE_GENERATOR=Ninja
          out="$(cygpath -m "$RUNNER_TEMP")/audit"
          sh .github/audit/audit.sh audit gcc g++ . "$out" meson
          status=0; python3 .github/audit/compare.py --check "$out/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$out/audit" $status

