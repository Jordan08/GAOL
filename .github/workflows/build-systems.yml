# Checks that GAOL still builds the ways it did before its CMake build: with
# autotools and with meson, which compile the sources of CORE-MATH into libgaol
# as the CMake build does. Each build runs the unit tests (make test, ninja
# test), and the tests are built again with each installed GAOL, on Linux
# (x86_64, arm64, and i386 and armhf in containers), macOS (arm64, x86_64) and
# Windows (MSYS2 for x64 and for x86, Cygwin, and Visual C++ and Clang with
# meson). Checks that the three builds give GAOL the same configuration on each
# kind of machine (.github/audit). Each job that runs the unit tests checks
# that numbers read and wrote numbers under a locale writing a decimal comma,
# which the Linux jobs and the containers generate first, macOS and Windows
# having one (.github/scripts/comma-locale.sh, GAOL v5). The autotools jobs
# check that make distclean gives the sources back as git has them. One job
# builds GAOL as a subproject of a meson project (tests/meson_subproject, GAOL
# v5). An autotools job (--disable-exceptions) and a meson job
# (-Denable-exception=false) build GAOL without exceptions, where an error ends
# the program, and run the examples and the tests, which leave out the checks
# of an exception there (GAOL v5). One job builds and tests GAOL with meson
# 0.53.2, the oldest meson the build takes (GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Autotools and meson

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The flags code using GAOL is compiled with (see CMakeLists.txt); on a
  # 32-bit x86 processor, tests.sh adds -msse2 -mfpmath=sse
  TEST_FLAGS: -std=c++17 -O2 -frounding-math -fno-fast-math -ffp-contract=off
  # Four tests at a time with make test (automake) and ninja test (meson)
  MESON_TESTTHREADS: 4

jobs:
  autotools:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     configure: '',                           desc: 'Autotools, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, configure: '',                           desc: 'Autotools, Ubuntu 24.04 arm64' }
          - { os: macos-15,         configure: '',                           desc: 'Autotools, macOS 15 arm64' }
          - { os: macos-15-intel,   configure: '',                           desc: 'Autotools, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 arm64, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, configure: '--disable-simd',             desc: 'Autotools, Ubuntu 24.04 arm64, FPU intervals' }
          - { os: ubuntu-24.04,     configure: '--disable-exceptions --with-examples', desc: 'Autotools, Ubuntu 24.04 x86_64, without exceptions' }
          - { os: ubuntu-24.04,     configure: '--enable-shared',            desc: 'Autotools, Ubuntu 24.04 x86_64, shared library', linking: shared }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake make
          fi
      - name: configure generated for the version of VERSION.txt
        run: |
          # configure reads VERSION.txt when it runs, but configure --version
          # and --help give the version of the last generation of configure,
          # which is to be generated again when VERSION.txt changes
          # (doc/building.md). With the commands of configure.ac, without the
          # byte order mark that an editor may have written at the start of
          # the file, nor the blanks around the version
          version=$(LC_ALL=C tr -d '\000' < VERSION.txt | LC_ALL=C sed -e "1s/^$(printf '\357\273\277')//" -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | tr '\n' ' ' | sed -e 's/ $//')
          ./configure --version | head -n 1
          test "$(./configure --version | head -n 1)" = "gaol configure $version" || {
            echo "configure was not generated again for GAOL $version (see doc/building.md)"; exit 1; }
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        run: sh .github/scripts/version-file.sh configure
      - name: VERSION.txt read by autoconf, as by configure
        # Once per runner: the jobs with configure's options read the same file
        if: runner.os == 'Linux' && matrix.cfg.configure == ''
        run: |
          # autoconf reads VERSION.txt for the version of configure --version
          # when it generates configure, which no build does: the script
          # generates configure in a copy of the sources (the autoconf of
          # Ubuntu, 2.71, warns that aclocal.m4 was generated for autoconf
          # 2.72, and works)
          sudo apt-get install -y -q autoconf
          sh .github/scripts/version-file.sh autoconf
      - name: Configure, build and install
        run: |
          set -o pipefail
          # The same date on every file, as in a release archive: make then
          # does not regenerate configure, the Makefile.in or the lexer
          find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
          # The output of configure out of the sources, which make distclean
          # is to give back as git has them
          ./configure --prefix="$RUNNER_TEMP/gaol" --with-tests ${{ matrix.cfg.configure }} | tee "$RUNNER_TEMP/configure.log"
          # config.status writes each of its files again when given its name,
          # as the rules of make that follow the templates do: the m4 macro of
          # the version named gaol_version made it refuse
          # manual/v5/gaol_version.tex, which it knew as manual/v5/5.0.0.tex
          ./config.status gaol.pc manual/v4/gaol_version.tex manual/v5/gaol_version.tex
          grep -E "^(CXXFLAGS|CPPFLAGS) =" gaol/Makefile
          make -j 4
          make install
          # CORE-MATH is compiled into libgaol: no other library is installed
          grep -q "elementary functions" "$RUNNER_TEMP/configure.log"
          ls "$RUNNER_TEMP/gaol/lib"
          for f in "$RUNNER_TEMP"/gaol/lib/lib*; do
            case "${f##*/}" in libgaol*) ;; *) echo "$f: not GAOL's"; exit 1 ;; esac
          done
      # NEON on 64-bit ARM, SSE2 on x86-64, the FPU where --disable-simd
      # asked for it (GAOL v5)
      - name: The intervals
        run: |
          case "$(uname -m)" in aarch64|arm64) expected=neon ;; *) expected=sse2 ;; esac
          case "${{ matrix.cfg.configure }}" in *--disable-simd*) expected=fpu ;; esac
          sh .github/scripts/check-intervals.sh gaol/gaol_configuration.h $expected
      - name: Locale writing a decimal comma
        if: runner.os == 'Linux'
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests (make test)
        run: make -j 4 test || { cat tests/test-suite.log; exit 1; }
      - name: The examples
        if: contains(matrix.cfg.configure, '--with-examples')
        run: make -j 4 -C examples check || { cat examples/test-suite.log; exit 1; }
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check tests/numbers.log
      - name: make distclean gives the sources back as git has them
        run: |
          # make clean keeps what configure made, for make to build again
          # without configure; make distclean erases it too, the .deps and
          # .dirstamp of the dependencies and of CORE-MATH among them
          # (doc/building.md). Before tests.sh, which compiles its tests at the
          # root of the sources. git status shows no empty directory, as the
          # .deps that make distclean left, emptied, before GAOL v5's
          # distclean-local: find looks for them, a checkout having none
          make distclean
          git status --short --ignored
          empty=$(find . -path ./.git -prune -o -type d -empty -print)
          echo "$empty"
          test -z "$(git status --porcelain --ignored)$empty" || {
            echo "make distclean left the files or the empty directories above, or changed files"; exit 1; }
      - name: Tests built with the installed GAOL
        run: |
          sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" ${{ matrix.cfg.linking || 'static' }}
      - name: Performance
        run: |
          set -o pipefail
          ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  meson:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     options: '',                                desc: 'Meson, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, options: '',                                desc: 'Meson, Ubuntu 24.04 arm64' }
          - { os: macos-15,         options: '',                                desc: 'Meson, macOS 15 arm64' }
          - { os: macos-15-intel,   options: '',                                desc: 'Meson, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     options: '-Denable-preserve-rounding=true', desc: 'Meson, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: macos-15,         options: '-Denable-preserve-rounding=true', desc: 'Meson, macOS 15 arm64, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, options: '-Denable-simd=false',             desc: 'Meson, Ubuntu 24.04 arm64, FPU intervals' }
          - { os: ubuntu-24.04,     options: '-Denable-exception=false -Dwith-examples=true', desc: 'Meson, Ubuntu 24.04 x86_64, without exceptions' }
          - { os: ubuntu-24.04,     options: '-Ddefault_library=shared',      desc: 'Meson, Ubuntu 24.04 x86_64, shared library', linking: shared }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake pipx
          else
            brew install pipx
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        run: sh .github/scripts/version-file.sh meson
      - name: meson setup with no Python on PATH
        if: runner.os == 'Linux'
        run: |
          # meson.build reads VERSION.txt with find_program('python3', 'python'):
          # when PATH holds neither, meson takes the Python that runs it, as the
          # meson.exe of the Windows installer does on a machine without Python,
          # but only for a first name that ends with python3 (doc/building.md).
          # PATH is here a directory of links to the programs of PATH but
          # Python's; meson itself runs, the interpreter of its script being
          # named by its absolute path
          nopython="$RUNNER_TEMP/no-python"
          mkdir "$nopython"
          echo "$PATH" | tr ':' '\n' | while read -r dir; do
            for program in "$dir"/*; do
              name=${program##*/}
              case "$name" in python*) continue ;; esac
              if [ -f "$program" ] && [ -x "$program" ] && [ ! -e "$nopython/$name" ]; then
                ln -s "$program" "$nopython/$name"
              fi
            done
          done
          if PATH="$nopython" command -v python3 || PATH="$nopython" command -v python; then
            echo "a Python is on PATH"; exit 1
          fi
          PATH="$nopython" meson setup "$RUNNER_TEMP/build-no-python"
      - name: Configure, build and install
        run: |
          set -o pipefail
          meson --version
          meson setup build-meson --prefix="$RUNNER_TEMP/gaol" --libdir=lib -Dwith-tests=true ${{ matrix.cfg.options }} | tee configure.log
          meson compile -C build-meson
          meson install -C build-meson
          # CORE-MATH is compiled into libgaol: no other library is installed
          grep -qi "elementary functions" configure.log
          ls "$RUNNER_TEMP/gaol/lib"
          for f in "$RUNNER_TEMP"/gaol/lib/lib*; do
            case "${f##*/}" in libgaol*) ;; *) echo "$f: not GAOL's"; exit 1 ;; esac
          done
      # NEON on 64-bit ARM, SSE2 on x86-64, the FPU where -Denable-simd=false
      # asked for it (GAOL v5)
      - name: The intervals
        run: |
          case "$(uname -m)" in aarch64|arm64) expected=neon ;; *) expected=sse2 ;; esac
          case "${{ matrix.cfg.options }}" in *-Denable-simd=false*) expected=fpu ;; esac
          sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h $expected
      # enable-prefer-avx512=false refuses the AVX-512 path where
      # enable-preserve-rounding asks for it by default: the option was a
      # boolean, whose false meson could not tell from the default, and a
      # library built so on a runner with the AVX-512 instructions needed them
      # (GAOL v5, point AA of TODO.md)
      - name: enable-prefer-avx512=false refuses the AVX-512 path
        if: contains(matrix.cfg.options, '-Denable-preserve-rounding=true')
        run: |
          meson setup build-no-avx512 -Denable-preserve-rounding=true -Denable-prefer-avx512=false
          ! grep -E "^#define GAOL_(PREFER_AVX512|AVX512_ARITHMETIC) 1" build-no-avx512/gaol/gaol_configuration.h
      - name: Locale writing a decimal comma
        if: runner.os == 'Linux'
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests (ninja test, make test of meson)
        run: ninja -C build-meson test
      - name: The examples
        if: contains(matrix.cfg.options, '-Dwith-examples=true')
        run: meson test -C build-meson --setup check --suite examples --print-errorlogs
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" ${{ matrix.cfg.linking || 'static' }}
      - name: Performance
        run: |
          set -o pipefail
          ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # meson 0.53.2, the oldest that the meson build takes, the meson of Ubuntu
  # 20.04 (doc/building.md), from pipx, as the other jobs take the latest: the
  # maintainer's machine checked it, as its meson of the system, until it
  # moved to Ubuntu 26.04 and meson 1.10, and nothing checked it then (GAOL
  # v5). meson compile needs meson 0.54: ninja builds, as doc/building.md
  # says. It runs on the Python 3.12 of Ubuntu 24.04 (and on 3.14).
  meson-oldest:
    name: Meson 0.53.2, Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ ninja-build pipx
          pipx install meson==0.53.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure, build and install
        run: |
          set -o pipefail
          test "$(meson --version)" = 0.53.2
          meson setup build-meson --prefix="$RUNNER_TEMP/gaol" --libdir=lib -Dwith-tests=true -Dwith-examples=true | tee configure.log
          ninja -C build-meson
          meson install -C build-meson
          grep -qi "elementary functions" configure.log
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests and examples
        run: meson test -C build-meson --print-errorlogs
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" static

  # GAOL as a subproject of a meson project, tests/meson_subproject, which
  # builds tests of tests/ with gaol_dep and checks that their code gets the
  # flags of interval arithmetic, and that GAOL is built in release in the
  # default build type of meson: meson refused the add_global_arguments() of
  # meson.build in a subproject, and before 1.8.4 gives a subproject the build
  # type of the project, which the meson of Ubuntu 24.04 (1.3.2) checks (GAOL
  # v5)
  meson-subproject:
    name: ${{ matrix.cfg.desc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { meson: pipx, desc: 'Meson, Ubuntu 24.04 x86_64, GAOL as a subproject' }
          - { meson: apt,  desc: 'Meson of Ubuntu 24.04, x86_64, GAOL as a subproject' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.cfg.meson }}" = pipx ]; then
            sudo apt-get install -y -q g++ pipx
            pipx install meson
            pipx install ninja
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get install -y -q g++ meson ninja-build
          fi
      - name: Configure tests/meson_subproject, a project bringing GAOL in as a subproject, from this checkout
        run: |
          set -o pipefail
          meson --version
          # The meson of Ubuntu has to be older than 1.8.4, which builds a
          # subproject in its own default build type itself
          if [ "${{ matrix.cfg.meson }}" = apt ]; then
            python3 -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split(".")[:3])) >= (1, 8, 4))' "$(meson --version)"
          fi
          mkdir tests/meson_subproject/subprojects
          ln -s "$PWD" tests/meson_subproject/subprojects/gaol
          meson setup build-meson-subproject tests/meson_subproject | tee configure.log
          grep -q "Elementary functions: CORE-MATH" configure.log
      - name: Build
        run: meson compile -C build-meson-subproject
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Tests (ninja test, make test of meson), the flags of their code among them
        run: ninja -C build-meson-subproject test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build-meson-subproject/meson-logs/testlog.txt
      - name: enable-debug builds GAOL for debugging, as a subproject and alone
        run: |
          meson setup build-meson-subproject-debug tests/meson_subproject -Dgaol:enable-debug=true
          python3 tests/release_flags.py --debug build-meson-subproject-debug "$PWD/tests/meson_subproject/subprojects/gaol"
          meson setup build-meson-debug -Denable-debug=true
          python3 tests/release_flags.py --debug build-meson-debug "$PWD"

  # meson with Visual C++: the static libgaol, as CMake builds it, its tests,
  # and the installed GAOL, with which a test is compiled again (GAOL v5). In
  # PowerShell: the link of Git Bash would hide the linker of Visual C++.
  meson-msvc:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2022,        arch: x64, desc: 'Meson, Visual Studio 2022 x64' }
          - { os: windows-2025-vs2026, arch: x64, desc: 'Meson, Visual Studio 2026 x64' }
          - { os: windows-2022,        arch: x86, desc: 'Meson, Visual Studio 2022 x86' }
          - { os: windows-11-vs2026-arm, arch: arm64, desc: 'Meson, Visual Studio 2026 arm64' }
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cfg.arch }}
      - name: Tools
        run: pip install meson ninja
      - name: Configure, build and install
        run: |
          meson --version
          $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson setup build-meson --prefix="$prefix" --libdir=lib -Dwith-tests=true
          if ($LASTEXITCODE) { exit 1 }
          meson compile -C build-meson
          if ($LASTEXITCODE) { exit 1 }
          meson install -C build-meson
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem -Recurse -File $prefix | ForEach-Object { $_.FullName }
          # What the code using GAOL includes with Visual C++, and the
          # configuration, in include/gaol under the prefix, but not the
          # headers of the sources of GAOL only (GAOL v5)
          foreach ($f in 'gaol_configuration.h', 'gaol_fpu_msvc.h', 'parser/gaol_expression.h') {
            if (-not (Test-Path "$prefix/include/gaol/$f")) { Write-Output "$f is not installed"; exit 1 }
          }
          foreach ($f in 'parser/gaol_interval_parser.h') {
            if (Test-Path "$prefix/include/gaol/$f") { Write-Output "$f is installed"; exit 1 }
          }
      # The intervals meson took, as CMake does (windows.yml): the SSE2 ones on
      # x64 and on x86, where their bounds are two doubles, and the NEON ones on
      # arm64 (GAOL v5)
      - name: The intervals
        shell: bash
        run: |
          case "${{ matrix.cfg.arch }}" in x64|x86) expected=sse2 ;; arm64) expected=neon ;; *) expected=fpu ;; esac
          sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h $expected
      - name: Tests (ninja test, make test of meson)
        run: |
          ninja -C build-meson test
          if ($LASTEXITCODE) { Get-Content build-meson/meson-logs/testlog.txt; exit 1 }
      - name: The test numbers ran under a locale writing a decimal comma
        shell: bash
        run: sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
      - name: A test built with the installed GAOL
        run: |
          $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
          $lib = Get-ChildItem "$prefix/lib" | Where-Object { $_.Name -match 'gaol\.(lib|a)$' } | Select-Object -First 1
          # cl takes a file it does not know by its name, libgaol.a with meson, for an
          # object file, and warns (D9024): the same library, named .lib
          $gaol_lib = "$env:RUNNER_TEMP/gaol_installed.lib"
          Copy-Item $lib.FullName $gaol_lib
          # /MD: the C runtime of the DLLs, which meson builds libgaol with
          cl /nologo /MD /O2 /EHsc /std:c++17 /fp:strict /D_CRT_SECURE_NO_WARNINGS "/I$prefix/include" /Itests tests/rounding_direction.cpp $gaol_lib /Fe:rounding_direction.exe
          if ($LASTEXITCODE) { exit 1 }
          ./rounding_direction.exe
          if ($LASTEXITCODE) { exit 1 }

  # Clang with the target of Visual C++ and the driver of GCC (clang++, not
  # clang-cl), in the environment of Visual Studio (GAOL v5), as the CMake job
  # of windows.yml
  meson-clang-msvc:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { arch: x64, target: x86_64-pc-windows-msvc, cpu_family: x86_64, cpu: x86_64, machine: X64, desc: 'Meson, Clang for Visual C++ x64 (clang++)' }
          - { arch: x86, target: i686-pc-windows-msvc,   cpu_family: x86,    cpu: i686,   machine: X86, desc: 'Meson, Clang for Visual C++ x86 (clang++)' }
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cfg.arch }}
      - name: Tools
        run: pip install meson ninja
      # meson gives the linker /MACHINE:X64 for Clang with the driver of GCC and
      # the target of Visual C++, whatever the target (the file of
      # cross-compilation names the machine, the target is in the command of the
      # compiler, and the machine is given again to the linker, whose last
      # option counts). The programs of x86 run on the runner, so that no wrapper
      # is needed
      - name: The file of cross-compilation
        run: |
          @"
          [binaries]
          c = ['clang', '--target=${{ matrix.cfg.target }}']
          cpp = ['clang++', '--target=${{ matrix.cfg.target }}']

          [built-in options]
          c_link_args = ['-Wl,/MACHINE:${{ matrix.cfg.machine }}']
          cpp_link_args = ['-Wl,/MACHINE:${{ matrix.cfg.machine }}']

          [host_machine]
          system = 'windows'
          cpu_family = '${{ matrix.cfg.cpu_family }}'
          cpu = '${{ matrix.cfg.cpu }}'
          endian = 'little'

          [properties]
          needs_exe_wrapper = false
          "@ | Set-Content -Encoding ascii cross.txt
          Get-Content cross.txt
      - name: Configure, build and install
        run: |
          clang++ --version
          $prefix = "$env:RUNNER_TEMP/gaol" -replace '\\', '/'
          meson setup build-meson --cross-file cross.txt --prefix="$prefix" --libdir=lib -Dwith-tests=true
          if ($LASTEXITCODE) { exit 1 }
          meson compile -C build-meson
          if ($LASTEXITCODE) { exit 1 }
          meson install -C build-meson
          if ($LASTEXITCODE) { exit 1 }
      - name: The intervals
        shell: bash
        run: sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h sse2
      - name: Tests (ninja test)
        run: |
          ninja -C build-meson test
          if ($LASTEXITCODE) { Get-Content build-meson/meson-logs/testlog.txt; exit 1 }

  # Autotools with Clang for the target of Visual C++ and the driver of GCC
  # (clang++, not clang-cl), in the shell of MSYS2 with the environment of Visual
  # Studio (GAOL v5): the link.exe of MSYS2 (coreutils) comes before that of
  # Visual Studio in PATH, so that the linker is lld, and the archiver that of
  # LLVM
  autotools-clang-msvc:
    name: Autotools, Clang for Visual C++ x64 (clang++)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make libtool
      - name: Configure, build and test
        run: |
          clang++ --version
          export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib LDFLAGS=-fuse-ld=lld
          ./configure --with-tests
          sh .github/scripts/check-intervals.sh gaol/gaol_configuration.h sse2
          grep -E '^GAOL_CXX_STD = -std=c\+\+14$' gaol/Makefile
          make -j 4
          make -j 4 test

  container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: autotools, desc: 'Autotools, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: meson,     desc: 'Meson, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: autotools, desc: 'Autotools, Debian 13 Trixie armhf' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: meson,     desc: 'Meson, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Build and tests
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol -e TEST_FLAGS -e MESON_TESTTHREADS ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ make meson ninja-build locales > /dev/null
            uname -m && c++ --version | head -1
            sh .github/scripts/comma-locale.sh generate
            if [ ${{ matrix.cfg.build }} = autotools ]; then
              find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
              ./configure --prefix=/tmp/gaol --with-tests
              grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
              make -j 4 && make install
              make -j 4 test
              sh .github/scripts/comma-locale.sh check tests/numbers.log
              sh .github/scripts/tests.sh /tmp/gaol static
            else
              meson setup build-meson --prefix=/tmp/gaol --libdir=lib -Dwith-tests=true
              meson compile -C build-meson && meson install -C build-meson
              ninja -C build-meson test
              sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
              sh .github/scripts/tests.sh /tmp/gaol static
            fi
            ./performance > /gaol/performance.md
            cat /gaol/performance.md"
          cat performance.md >> "$GITHUB_STEP_SUMMARY"

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, msystem: UCRT64,  pkg: mingw-w64-ucrt-x86_64, intervals: sse2, desc: 'Autotools, MSYS2 UCRT64 GCC x64' }
          - { build: meson,     msystem: UCRT64,  pkg: mingw-w64-ucrt-x86_64, intervals: sse2, desc: 'Meson, MSYS2 UCRT64 GCC x64' }
          # The 32-bit Windows of MinGW-w64 with configure and meson, which
          # only simulated it (CXXFLAGS=-D_WIN32) before, and the CMake jobs of
          # windows.yml (Chocolatey) built alone: the SSE2 intervals need
          # -faligned-new=8 there, the memory of new being aligned on 8 bytes
          - { build: autotools, msystem: MINGW32, pkg: mingw-w64-i686,        intervals: sse2, desc: 'Autotools, MSYS2 MINGW32 GCC x86' }
          - { build: meson,     msystem: MINGW32, pkg: mingw-w64-i686,        intervals: sse2, desc: 'Meson, MSYS2 MINGW32 GCC x86' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.cfg.msystem }}
          install: ${{ matrix.cfg.pkg }}-toolchain ${{ matrix.cfg.pkg }}-cmake ${{ matrix.cfg.pkg }}-ninja ${{ matrix.cfg.pkg }}-meson make libtool
      - name: VERSION.txt with a byte order mark and the line ends of Windows
        if: matrix.cfg.build == 'meson'
        run: sh .github/scripts/version-file.sh meson
      - name: Configure, build and install
        run: |
          prefix="$(cygpath -m "$RUNNER_TEMP")/gaol"
          if [ ${{ matrix.cfg.build }} = autotools ]; then
            find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
            ./configure --prefix="$prefix" --with-tests
            grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
            sh .github/scripts/check-intervals.sh gaol/gaol_configuration.h ${{ matrix.cfg.intervals }}
            if [ "$MSYSTEM" = MINGW32 ]; then grep -F -e -faligned-new=8 gaol/Makefile; fi
            make -j 4 && make install
            make -j 4 test
            sh .github/scripts/comma-locale.sh check tests/numbers.log
          else
            meson setup build-meson --prefix="$prefix" --libdir=lib -Dwith-tests=true
            sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h ${{ matrix.cfg.intervals }}
            if [ "$MSYSTEM" = MINGW32 ]; then grep -F -e -faligned-new=8 build-meson/compile_commands.json > /dev/null; fi
            meson compile -C build-meson && meson install -C build-meson
            ninja -C build-meson test
            sh .github/scripts/comma-locale.sh check build-meson/meson-logs/testlog.txt
          fi
          # CORE-MATH is compiled into libgaol: no other library is installed
          ls "$prefix/lib"
          ! ls "$prefix/lib" | grep "^lib" | grep -v "^libgaol"
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$(cygpath -m "$RUNNER_TEMP")/gaol" static
      - name: Performance
        run: |
          set -o pipefail
          ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # Cygwin, GCC for x86-64 (GAOL v5), with autotools and with meson as with
  # CMake in windows.yml: GAOL_FMA gives it -mfma -mprefer-vector-width=128,
  # without which gaol/gaol_config.h refuses it (its fma() is not correctly
  # rounded). Cygwin is not mingw-w64 (__CYGWIN__, not __MINGW32__).
  cygwin:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, desc: 'Autotools, Cygwin GCC x64' }
          - { build: meson,     desc: 'Meson, Cygwin GCC x64' }
    steps:
      - run: git config --global core.autocrlf input
        shell: pwsh
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            gcc-g++
            make
            binutils
            pkg-config
            meson
            ninja
      - name: Configure, build and install
        run: |
          g++ --version
          g++ -dumpmachine
          prefix="$PWD/../gaol-prefix"
          # The compilers of Cygwin: meson would find the ccache of Strawberry
          # Perl, first in PATH, which cannot run them ("cannot compile programs")
          export CC=gcc CXX=g++
          if [ ${{ matrix.cfg.build }} = autotools ]; then
            ./configure --prefix="$prefix" --with-tests
            sh .github/scripts/check-intervals.sh gaol/gaol_configuration.h sse2
            grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
            grep -F -e "-mfma -mprefer-vector-width=128" gaol/Makefile
            make -j 4 && make install
            make -j 4 test
          else
            meson setup build-meson --prefix="$prefix" --libdir=lib -Dwith-tests=true
            sh .github/scripts/check-intervals.sh build-meson/gaol/gaol_configuration.h sse2
            grep -F -e "-mfma" build-meson/compile_commands.json > /dev/null
            meson compile -C build-meson && meson install -C build-meson
            ninja -C build-meson test
          fi
          # CORE-MATH is compiled into libgaol: no other library is installed
          ls "$prefix/lib"
          for f in "$prefix"/lib/lib*; do
            case "${f##*/}" in libgaol*) ;; *) echo "$f: not GAOL's"; exit 1 ;; esac
          done
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$PWD/../gaol-prefix" static

  # The three builds give GAOL the same configuration (.github/audit)
  agree:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 arm64 Clang' }
          - { os: macos-15,         cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 arm64' }
          - { os: macos-15-intel,   cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 x86_64' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ clang cmake make pipx
          else
            brew install pipx
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure with the three builds and compare
        run: |
          sh .github/audit/audit.sh audit ${{ matrix.cfg.cc }} ${{ matrix.cfg.cxx }} . "$RUNNER_TEMP/audit" meson
          status=0; python3 .github/audit/compare.py --check "$RUNNER_TEMP/audit/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$RUNNER_TEMP/audit/audit" $status

  agree-container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', desc: 'The builds agree, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   desc: 'The builds agree, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure with the three builds and compare
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ cmake make meson ninja-build python3 > /dev/null
            sh .github/audit/audit.sh audit gcc g++ /gaol /tmp/audit meson
            status=0; python3 .github/audit/compare.py --check /tmp/audit/audit.json > /gaol/agree.md || status=\$?
            cat /gaol/agree.md
            sh .github/audit/logs.sh /tmp/audit/audit \$status"
          cat agree.md >> "$GITHUB_STEP_SUMMARY"

  agree-msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { msystem: UCRT64,  pkg: mingw-w64-ucrt-x86_64, desc: 'The builds agree, MSYS2 UCRT64 GCC x64' }
          - { msystem: MINGW32, pkg: mingw-w64-i686,        desc: 'The builds agree, MSYS2 MINGW32 GCC x86' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.cfg.msystem }}
          install: ${{ matrix.cfg.pkg }}-toolchain ${{ matrix.cfg.pkg }}-cmake ${{ matrix.cfg.pkg }}-ninja ${{ matrix.cfg.pkg }}-meson ${{ matrix.cfg.pkg }}-python make libtool
      - name: Configure with the three builds and compare
        run: |
          export CMAKE_GENERATOR=Ninja
          out="$(cygpath -m "$RUNNER_TEMP")/audit"
          sh .github/audit/audit.sh audit gcc g++ . "$out" meson
          status=0; python3 .github/audit/compare.py --check "$out/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$out/audit" $status

