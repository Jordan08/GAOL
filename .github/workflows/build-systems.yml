# Checks that GAOL still builds the ways it did before its CMake build: with
# autotools and with meson, which compile the sources of CORE-MATH into libgaol
# as the CMake build does. Each build runs the unit tests (make test, ninja
# test), and the tests are built again with each installed GAOL, on Linux
# (x86_64, arm64, and i386 and armhf in containers), macOS (arm64, x86_64) and
# Windows (MSYS2 for x64 and for x86, Cygwin, and Visual C++ and Clang with
# meson). Checks that the three builds give GAOL the same configuration on each
# kind of machine (.github/audit). Each job that runs the unit tests checks
# that numbers read and wrote numbers under a locale writing a decimal comma,
# which the Linux jobs and the containers generate first, macOS and Windows
# having one (.github/scripts/comma-locale.sh, GAOL v5). The autotools jobs
# check that make distclean gives the sources back as git has them. One job
# builds GAOL as a subproject of a meson project (tests/meson_subproject, GAOL
# v5). An autotools job (--disable-exceptions) and a meson job
# (-Denable-exception=false) build GAOL without exceptions, where an error ends
# the program, and run the examples and the tests, which leave out the checks
# of an exception there (GAOL v5). One job builds and tests GAOL with meson
# 0.53.2, the oldest meson the build takes (GAOL v5). One job makes the
# archive of the sources with the three builds, and checks that they hold the
# same files (GAOL v5).
#
# A job is a group of configurations that run one after the other on the
# same image of runner, each one an action of .github/actions/ called
# with the row of the matrix it had when it was a job of its own: the
# configurations, their options and their checks are those of the jobs
# they replace (GAOL v5). Below, a job is one of these configurations.
#
# Copyright (c) 2026 ENSTA, France
#
# By: Jordan NININ (created 2026-09-20)
#
# GAOL is a software distributed WITHOUT ANY WARRANTY. Read the associated
# COPYING.LIB file for information.

name: Autotools and meson

on:
  push:
    branches: [master, configure-clean, dev, experiment-ci-groups]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The flags code using GAOL is compiled with (see CMakeLists.txt); on a
  # 32-bit x86 processor, tests.sh adds -msse2 -mfpmath=sse
  TEST_FLAGS: -std=c++17 -O2 -frounding-math -fno-fast-math -ffp-contract=off
  # Four tests at a time with make test (automake) and ninja test (meson)
  MESON_TESTTHREADS: 4

jobs:

  b1:
    name: 'Ubuntu 24.04 x86_64, the three builds (8 configurations)'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'Meson of Ubuntu 24.04, x86_64, GAOL as a subproject'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-meson-subproject
        with:
          desc: 'Meson of Ubuntu 24.04, x86_64, GAOL as a subproject'
          meson: 'apt'
      - id: c2
        name: 'Archives of the sources, Ubuntu 24.04 x86_64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-dist
        with:
          desc: 'Archives of the sources, Ubuntu 24.04 x86_64'
      - id: c3
        name: 'The builds agree, Ubuntu 24.04 x86_64 GCC'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-agree
        with:
          desc: 'The builds agree, Ubuntu 24.04 x86_64 GCC'
          cc: 'gcc'
          cxx: 'g++'
      - id: c4
        name: 'The builds agree, Ubuntu 24.04 x86_64 Clang'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-agree
        with:
          desc: 'The builds agree, Ubuntu 24.04 x86_64 Clang'
          cc: 'clang'
          cxx: 'clang++'
      - id: c5
        name: 'Meson 0.53.2, Ubuntu 24.04 x86_64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-meson-oldest
        with:
          desc: 'Meson 0.53.2, Ubuntu 24.04 x86_64'
      - id: c6
        name: 'Meson, Ubuntu 24.04 x86_64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-meson
        with:
          desc: 'Meson, Ubuntu 24.04 x86_64'
          options: ''
      - id: c7
        name: 'Meson, Ubuntu 24.04 x86_64, GAOL as a subproject'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-meson-subproject
        with:
          desc: 'Meson, Ubuntu 24.04 x86_64, GAOL as a subproject'
          meson: 'pipx'
      - id: c8
        name: 'Autotools, Ubuntu 24.04 x86_64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-autotools
        with:
          desc: 'Autotools, Ubuntu 24.04 x86_64'
          configure: ''
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }} c5=${{ steps.c5.outcome }} c6=${{ steps.c6.outcome }} c7=${{ steps.c7.outcome }} c8=${{ steps.c8.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'Ubuntu 24.04 x86_64, the three builds' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Meson of Ubuntu 24.04, x86_64, GAOL as a subproject' ;;
              c2) name='Archives of the sources, Ubuntu 24.04 x86_64' ;;
              c3) name='The builds agree, Ubuntu 24.04 x86_64 GCC' ;;
              c4) name='The builds agree, Ubuntu 24.04 x86_64 Clang' ;;
              c5) name='Meson 0.53.2, Ubuntu 24.04 x86_64' ;;
              c6) name='Meson, Ubuntu 24.04 x86_64' ;;
              c7) name='Meson, Ubuntu 24.04 x86_64, GAOL as a subproject' ;;
              c8) name='Autotools, Ubuntu 24.04 x86_64' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  b2:
