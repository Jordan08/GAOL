# Checks that GAOL still builds the ways it did before the CMake build of this
# fork: with autotools and with meson, with the mathlib of 3rd/mathlib they
# build themselves, and on Ubuntu x86_64 against a mathlib installed apart
# (scripts/install-mathlib.sh), as the CMake build (MATHLIB_DIR). The tests
# are built with each installed GAOL, on Linux (x86_64, arm64, and i386 and
# armhf in containers), macOS (arm64, x86_64) and Windows (MSYS2). Checks that
# the three builds give GAOL the same configuration on each kind of machine
# (.github/audit), and that autotools and meson refuse the MinGW-w64 CMake
# refuses (mingw-w64 older than version 13). Builds GAOL with the two other
# mathematical libraries autotools and meson offer, CRlibm and the math library
# of the system, which no other job compiles.

name: Autotools and meson

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The flags code using GAOL is compiled with (see CMakeLists.txt); on a
  # 32-bit x86 processor, tests.sh adds -msse2 -mfpmath=sse
  TEST_FLAGS: -std=c++17 -O2 -frounding-math -fno-fast-math -ffp-contract=off

jobs:
  autotools:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     configure: '',                           desc: 'Autotools, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, configure: '',                           desc: 'Autotools, Ubuntu 24.04 arm64' }
          - { os: macos-15,         configure: '',                           desc: 'Autotools, macOS 15 arm64' }
          - { os: macos-15-intel,   configure: '',                           desc: 'Autotools, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, configure: '--enable-preserve-rounding', desc: 'Autotools, Ubuntu 24.04 arm64, rounding direction preserved' }
          - { os: ubuntu-24.04,     configure: '', installed_mathlib: true,  desc: 'Autotools, Ubuntu 24.04 x86_64, installed mathlib' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake make
          fi
      - name: mathlib installed apart, for the job using one rather than the mathlib of 3rd/mathlib
        if: matrix.cfg.installed_mathlib
        run: sh scripts/install-mathlib.sh "$RUNNER_TEMP/mathlib"
      - name: Configure, build and install
        run: |
          # The same date on every file, as in a release archive: make then
          # does not regenerate configure, the Makefile.in or the lexer
          find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
          if [ "${{ matrix.cfg.installed_mathlib }}" = true ]; then
            mathlib="--with-mathlib-include=$RUNNER_TEMP/mathlib/include --with-mathlib-lib=$RUNNER_TEMP/mathlib/lib"
          else
            mathlib=""
          fi
          ./configure --prefix="$RUNNER_TEMP/gaol" $mathlib ${{ matrix.cfg.configure }} | tee configure.log
          grep -E "^(CXXFLAGS|CPPFLAGS) =" gaol/Makefile
          make -j 4
          make install
          # The mathlib of 3rd/mathlib is installed with GAOL; one installed apart is not
          if [ -z "$mathlib" ]; then
            grep -q "mathlib: the one of 3rd/mathlib, built with GAOL" configure.log
            test -f "$RUNNER_TEMP/gaol/lib/libultim.a"
          else
            test ! -f "$RUNNER_TEMP/gaol/lib/libultim.a"
          fi
      - name: Tests built with the installed GAOL
        run: |
          mathlib="$RUNNER_TEMP/gaol"
          if [ "${{ matrix.cfg.installed_mathlib }}" = true ]; then mathlib="$RUNNER_TEMP/mathlib"; fi
          sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" "$mathlib" static
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  meson:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     options: '',                                desc: 'Meson, Ubuntu 24.04 x86_64' }
          - { os: ubuntu-24.04-arm, options: '',                                desc: 'Meson, Ubuntu 24.04 arm64' }
          - { os: macos-15,         options: '',                                desc: 'Meson, macOS 15 arm64' }
          - { os: macos-15-intel,   options: '',                                desc: 'Meson, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     options: '-Denable-preserve-rounding=true', desc: 'Meson, Ubuntu 24.04 x86_64, rounding direction preserved' }
          - { os: macos-15,         options: '-Denable-preserve-rounding=true', desc: 'Meson, macOS 15 arm64, rounding direction preserved' }
          - { os: ubuntu-24.04,     options: '', installed_mathlib: true,         desc: 'Meson, Ubuntu 24.04 x86_64, installed mathlib' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ cmake flex bison pipx
          else
            brew install flex bison pipx
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mathlib installed apart, for the job using one rather than the mathlib of 3rd/mathlib
        if: matrix.cfg.installed_mathlib
        run: sh scripts/install-mathlib.sh "$RUNNER_TEMP/mathlib"
      - name: Configure, build and install
        run: |
          meson --version
          if [ "${{ matrix.cfg.installed_mathlib }}" = true ]; then
            mathlib="-Dwith-mathlib-include=$RUNNER_TEMP/mathlib/include -Dwith-mathlib-lib=$RUNNER_TEMP/mathlib/lib"
          else
            mathlib=""
          fi
          meson setup build-meson --prefix="$RUNNER_TEMP/gaol" --libdir=lib $mathlib ${{ matrix.cfg.options }} | tee configure.log
          meson compile -C build-meson
          meson install -C build-meson
          # The mathlib of 3rd/mathlib is installed with GAOL; one installed apart is not
          if [ -z "$mathlib" ]; then
            grep -q "mathlib: the one of 3rd/mathlib, built with GAOL" configure.log
            test -f "$RUNNER_TEMP/gaol/lib/libultim.a"
          else
            test ! -f "$RUNNER_TEMP/gaol/lib/libultim.a"
          fi
      - name: Tests built with the installed GAOL
        run: |
          mathlib="$RUNNER_TEMP/gaol"
          if [ "${{ matrix.cfg.installed_mathlib }}" = true ]; then mathlib="$RUNNER_TEMP/mathlib"; fi
          sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" "$mathlib" shared
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # GAOL built with CRlibm (--with-mathlib=crlibm), whose bounds are certified
  # as those of mathlib: the five tests pass. Built with the math library of the
  # system (--with-mathlib=m), GAOL does not aim at tight bounds: the checks of
  # elementary and other_functions on the distance to the tightest bounds may
  # fail, and no other (.github/scripts/tests.sh). Without these jobs,
  # gaol/gaol_double_op_crlibm.h and gaol/gaol_double_op_m.h were compiled
  # nowhere (issue #12).
  other-mathlib:
    name: ${{ matrix.cfg.desc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, mathlib: crlibm, desc: 'Autotools, Ubuntu 24.04 x86_64, CRlibm' }
          - { build: meson,     mathlib: crlibm, desc: 'Meson, Ubuntu 24.04 x86_64, CRlibm' }
          - { build: autotools, mathlib: m,      desc: 'Autotools, Ubuntu 24.04 x86_64, math library of the system' }
          - { build: meson,     mathlib: m,      desc: 'Meson, Ubuntu 24.04 x86_64, math library of the system' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ make flex bison pipx autoconf automake libtool pkg-config
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: CRlibm
        if: matrix.cfg.mathlib == 'crlibm'
        run: sh scripts/install-crlibm.sh "$RUNNER_TEMP/crlibm"
      - name: Configure, build and install
        run: |
          if [ ${{ matrix.cfg.build }} = autotools ]; then
            find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
            options="--with-mathlib=${{ matrix.cfg.mathlib }}"
            if [ ${{ matrix.cfg.mathlib }} = crlibm ]; then
              options="$options --with-mathlib-include=$RUNNER_TEMP/crlibm/include --with-mathlib-lib=$RUNNER_TEMP/crlibm/lib"
            fi
            ./configure --prefix="$RUNNER_TEMP/gaol" $options | tee configure.log
            make -j 4
            make install
          else
            # The math library of the system is "default" for meson
            if [ ${{ matrix.cfg.mathlib }} = crlibm ]; then
              options="-Dwith-mathlib=crlibm -Dwith-mathlib-include=$RUNNER_TEMP/crlibm/include -Dwith-mathlib-lib=$RUNNER_TEMP/crlibm/lib"
            else
              options="-Dwith-mathlib=default"
            fi
            meson setup build-meson --prefix="$RUNNER_TEMP/gaol" --libdir=lib $options | tee configure.log
            meson compile -C build-meson
            meson install -C build-meson
          fi
          # No mathlib is built nor installed with GAOL
          test ! -f "$RUNNER_TEMP/gaol/lib/libultim.a"
          cat "$RUNNER_TEMP/gaol/lib/pkgconfig/gaol.pc"
      - name: Tests built with the installed GAOL
        run: |
          linking=static
          if [ ${{ matrix.cfg.build }} = meson ]; then linking=shared; fi
          sh .github/scripts/tests.sh "$RUNNER_TEMP/gaol" "$RUNNER_TEMP/crlibm" $linking ${{ matrix.cfg.mathlib }}
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: autotools, desc: 'Autotools, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', build: meson,     desc: 'Meson, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: autotools, desc: 'Autotools, Debian 13 Trixie armhf' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   build: meson,     desc: 'Meson, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Build and tests
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol -e TEST_FLAGS ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ make flex bison meson ninja-build > /dev/null
            uname -m && c++ --version | head -1
            if [ ${{ matrix.cfg.build }} = autotools ]; then
              find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
              ./configure --prefix=/tmp/gaol
              grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
              make -j 4 && make install
              sh .github/scripts/tests.sh /tmp/gaol /tmp/gaol static
            else
              meson setup build-meson --prefix=/tmp/gaol --libdir=lib
              meson compile -C build-meson && meson install -C build-meson
              sh .github/scripts/tests.sh /tmp/gaol /tmp/gaol shared
            fi
            ./performance | tee /gaol/performance.md"
          cat performance.md >> "$GITHUB_STEP_SUMMARY"

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, desc: 'Autotools, MSYS2 UCRT64 GCC x64' }
          - { build: meson,     desc: 'Meson, MSYS2 UCRT64 GCC x64' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson flex bison make libtool
      - name: Configure, build and install
        run: |
          prefix="$(cygpath -m "$RUNNER_TEMP")/gaol"
          if [ ${{ matrix.cfg.build }} = autotools ]; then
            find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
            ./configure --prefix="$prefix"
            grep -E '^(CXXFLAGS|CPPFLAGS) =' gaol/Makefile
            make -j 4 && make install
          else
            meson setup build-meson --prefix="$prefix" --libdir=lib
            meson compile -C build-meson && meson install -C build-meson
          fi
          test -f "$prefix/lib/libultim.a"
      - name: Tests built with the installed GAOL
        run: sh .github/scripts/tests.sh "$(cygpath -m "$RUNNER_TEMP")/gaol" "$(cygpath -m "$RUNNER_TEMP")/gaol" static
      - name: Performance
        run: ./performance | tee -a "$GITHUB_STEP_SUMMARY"

  # The three builds give GAOL the same configuration (.github/audit)
  agree:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'The builds agree, Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'The builds agree, Ubuntu 24.04 arm64 Clang' }
          - { os: macos-15,         cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 arm64' }
          - { os: macos-15-intel,   cc: cc,    cxx: c++,     desc: 'The builds agree, macOS 15 x86_64' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     installed_mathlib: true, desc: 'The builds agree, Ubuntu 24.04 x86_64 GCC, installed mathlib' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q g++ clang cmake flex bison make pipx
          else
            brew install flex bison pipx
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          fi
          pipx install meson
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mathlib installed apart, for the job using one rather than the mathlib of 3rd/mathlib
        if: matrix.cfg.installed_mathlib
        run: sh scripts/install-mathlib.sh "$RUNNER_TEMP/mathlib"
      - name: Configure with the three builds and compare
        run: |
          mathlib=-
          if [ "${{ matrix.cfg.installed_mathlib }}" = true ]; then mathlib="$RUNNER_TEMP/mathlib"; fi
          sh .github/audit/audit.sh audit ${{ matrix.cfg.cc }} ${{ matrix.cfg.cxx }} . "$mathlib" "$RUNNER_TEMP/audit" meson
          status=0; python3 .github/audit/compare.py --check "$RUNNER_TEMP/audit/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$RUNNER_TEMP/audit/audit" $status

  agree-container:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04,     platform: linux/386,    image: 'debian:bookworm', desc: 'The builds agree, Debian 12 Bookworm i386' }
          - { os: ubuntu-24.04-arm, platform: linux/arm/v7, image: 'debian:trixie',   desc: 'The builds agree, Debian 13 Trixie armhf' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure with the three builds and compare
        run: |
          docker run --rm --platform ${{ matrix.cfg.platform }} -v "$PWD:/gaol" -w /gaol ${{ matrix.cfg.image }} sh -c "
            set -e
            apt-get update -qq && apt-get install -y -qq g++ cmake make flex bison meson ninja-build python3 > /dev/null
            sh .github/audit/audit.sh audit gcc g++ /gaol - /tmp/audit meson
            status=0; python3 .github/audit/compare.py --check /tmp/audit/audit.json > /gaol/agree.md || status=\$?
            cat /gaol/agree.md
            sh .github/audit/logs.sh /tmp/audit/audit \$status"
          cat agree.md >> "$GITHUB_STEP_SUMMARY"

  agree-msys2:
    name: The builds agree, MSYS2 UCRT64 GCC x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-python flex bison make libtool
      - name: Configure with the three builds and compare
        run: |
          export CMAKE_GENERATOR=Ninja
          out="$(cygpath -m "$RUNNER_TEMP")/audit"
          sh .github/audit/audit.sh audit gcc g++ . - "$out" meson
          status=0; python3 .github/audit/compare.py --check "$out/audit.json" > agree.md || status=$?
          cat agree.md; cat agree.md >> "$GITHUB_STEP_SUMMARY"
          sh .github/audit/logs.sh "$out/audit" $status

  mingw-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { build: autotools, version: '14.2.0', desc: 'Autotools, MinGW-w64 14.2.0 x64, refused' }
          - { build: meson,     version: '14.2.0', desc: 'Meson, MinGW-w64 14.2.0 x64, refused' }
          - { build: autotools, version: '13.2.0', desc: 'Autotools, MinGW-w64 13.2.0 x64, refused' }
          - { build: meson,     version: '13.2.0', desc: 'Meson, MinGW-w64 13.2.0 x64, refused' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force
          echo 'C:\ProgramData\mingw64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Configure, which has to fail, mingw-w64 being older than version 13
        run: |
          g++ --version
          echo '#include <stdlib.h>' | g++ -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) ' || true
          if [ "${{ matrix.cfg.build }}" = autotools ]; then
            # The same date on every file, as in a release archive
            find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
            configure="sh ./configure"
          else
            python -m pip install -q meson ninja
            configure="python -m mesonbuild.mesonmain setup build-meson"
          fi
          if CC=gcc CXX=g++ $configure > configure.log 2>&1; then
            cat configure.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat configure.log
          grep -q "GAOL cannot be built with" configure.log

  cmake-installed-mathlib:
    name: CMake with an installed mathlib, Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: mathlib
        run: sh scripts/install-mathlib.sh "$RUNNER_TEMP/mathlib"
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=ON -DGAOL_BUILD_MATHLIB=OFF -DMATHLIB_DIR="$RUNNER_TEMP/mathlib" | tee configure.log
          grep -q "Found mathlib: $RUNNER_TEMP/mathlib" configure.log
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Configure without MATHLIB_DIR, the installed mathlib on CMAKE_PREFIX_PATH
        # As a project building GAOL for itself: the mathlib of 3rd/mathlib is
        # built and installed with GAOL, even where CMake would find an
        # installed one, GAOL_FIND_MATHLIB being OFF without MATHLIB_DIR
        run: |
          cmake -S . -B build-own-mathlib -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mathlib" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/gaol-own-mathlib" | tee configure-own-mathlib.log
          grep -q "mathlib: the one of 3rd/mathlib, built with GAOL" configure-own-mathlib.log
      - name: Build and install with the mathlib of 3rd/mathlib
        run: |
          cmake --build build-own-mathlib -j 4
          cmake --install build-own-mathlib
          for file in lib/libgaol.a lib/libultim.a include/MathLib.h include/gaol/gaol.h; do
            test -f "$RUNNER_TEMP/gaol-own-mathlib/$file" || { echo "$file is not installed"; exit 1; }
          done
