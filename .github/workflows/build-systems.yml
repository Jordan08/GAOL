  b6:
    name: 'MSYS2 MINGW32 (3 configurations)'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # One setup of MSYS2 for the group: the configurations choose their
      # environment with MSYSTEM, the action refusing a second installation
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-toolchain mingw-w64-i686-cmake mingw-w64-i686-ninja
            mingw-w64-i686-meson make libtool
            mingw-w64-i686-python
      # The 32-bit Windows of MinGW-w64 with configure and meson, which
      # only simulated it (CXXFLAGS=-D_WIN32) before, and the CMake jobs of
      # windows.yml (Chocolatey) built alone: the SSE2 intervals need
      # -faligned-new=8 there, the memory of new being aligned on 8 bytes
      - id: c1
        name: 'Autotools, MSYS2 MINGW32 GCC x86'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-msys2
        with:
          desc: 'Autotools, MSYS2 MINGW32 GCC x86'
          build: 'autotools'
          msystem: 'MINGW32'
          intervals: 'sse2'
        env:
          MSYSTEM: 'MINGW32'
      - id: c2
        name: 'Meson, MSYS2 MINGW32 GCC x86'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-msys2
        with:
          desc: 'Meson, MSYS2 MINGW32 GCC x86'
          build: 'meson'
          msystem: 'MINGW32'
          intervals: 'sse2'
        env:
          MSYSTEM: 'MINGW32'
      - id: c3
        name: 'The builds agree, MSYS2 MINGW32 GCC x86'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-agree-msys2
        with:
          desc: 'The builds agree, MSYS2 MINGW32 GCC x86'
          msystem: 'MINGW32'
        env:
          MSYSTEM: 'MINGW32'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'MSYS2 MINGW32' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Autotools, MSYS2 MINGW32 GCC x86' ;;
              c2) name='Meson, MSYS2 MINGW32 GCC x86' ;;
              c3) name='The builds agree, MSYS2 MINGW32 GCC x86' ;;
