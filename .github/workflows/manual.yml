# Builds the manuals, the manual of GAOL v5 (manual/v5/gaol.tex) and the manual
# of GAOL 4 (manual/v4/gaol.tex), with the LaTeX of Ubuntu, with the autotools
# build (make -C manual pdf) and with the meson build (-Dwith-doc=true, target
# pdf), so that a change of a manual that no longer compiles shows: gaol.tex had
# stopped compiling with the package marginbib, which no job built (issue #13).
# The PDFs are kept as artifacts of the run. Only runs when the manuals or this
# workflow change.
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Manual

on:
  push:
    branches: ['**']
    paths: ['manual/**', '.github/workflows/manual.yml']
  pull_request:
    paths: ['manual/**', '.github/workflows/manual.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    name: The manual, Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: LaTeX, and the tools of the two builds
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern g++ make flex bison meson ninja-build
      - name: With the autotools build
        run: |
          # The same date on every file, as in a release archive: make then
          # does not regenerate configure nor the Makefile.in
          find . -path ./.git -prune -o -exec touch -h -d '2020-01-01 00:00:00' {} +
          mkdir build-autotools && cd build-autotools
          ../configure > configure.log
          make -C manual pdf
          pdfinfo manual/v5/gaol.pdf || true
          pdfinfo manual/v4/gaol.pdf || true
      - name: With the meson build
        run: |
          meson setup build-meson -Dwith-doc=true
          meson compile -C build-meson pdf
      - name: The same number of pages with both builds, and the fonts embedded as outlines
        run: |
          sudo apt-get install -y -q --no-install-recommends poppler-utils
          # The manual of GAOL v5 had 122 pages when written, that of GAOL 4 94
          for manual in v5:110 v4:90; do
            dir=${manual%:*}
            pages_autotools=$(pdfinfo build-autotools/manual/$dir/gaol.pdf | awk '/^Pages:/ { print $2 }')
            pages_meson=$(pdfinfo build-meson/manual/$dir/gaol.pdf | awk '/^Pages:/ { print $2 }')
            echo "$dir: autotools: $pages_autotools pages, meson: $pages_meson pages"
            test "$pages_autotools" = "$pages_meson"
            test "$pages_autotools" -ge "${manual#*:}"
            pdffonts build-autotools/manual/$dir/gaol.pdf
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gaol-manual-v5
          path: build-autotools/manual/v5/gaol.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: gaol-manual-v4
          path: build-autotools/manual/v4/gaol.pdf
