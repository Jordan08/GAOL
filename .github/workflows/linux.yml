#
# Builds GAOL with CMake on Ubuntu, runs its tests, installs it, and builds the
# tests again with the installed GAOL. Also with the sanitizers, with the
# minimum version of CMake GAOL declares, and as a part of another project,
# brought in by FetchContent (tests/fetch_content).

name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 arm64 Clang' }
          - { os: ubuntu-22.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 22.04 x86_64 GCC' }
          - { os: ubuntu-22.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 22.04 x86_64 Clang' }
          - { os: ubuntu-22.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 22.04 arm64 GCC' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 x86_64 GCC, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 arm64 Clang, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make
          ${{ matrix.cfg.cxx }} --version
          cmake --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Performance
        run: build/tests/gaol_performance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          # With the flags and libraries of gaol.pc alone, then with find_package()
          export PKG_CONFIG_PATH="$PWD/gaol-install/lib/pkgconfig"
          pkg-config --cflags --libs gaol
          ${{ matrix.cfg.cxx }} -std=c++17 -O2 $(pkg-config --cflags gaol) -Itests tests/rounding_direction.cpp $(pkg-config --libs gaol) -o rounding_direction_pc
          ./rounding_direction_pc | tail -1
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure

  clang-14-arm64:
    name: Ubuntu 22.04 arm64 Clang 14, refused
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure with Clang 14, which does not honour the rounding direction on 64-bit ARM and has to be refused
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake make
          clang++ --version
          if cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > configure.log 2>&1; then
            cat configure.log
            echo "Clang 14 was not refused"
            exit 1
          fi
          cat configure.log
          grep -q "GAOL cannot be built with" configure.log

  sanitizers:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang Debug ASan+UBSan' }
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make
          ${{ matrix.cfg.cxx }} --version
      - name: Configure
        run: |
          # halt_on_error (UBSAN_OPTIONS) stops a test on its first undefined
          # behaviour; none is suppressed
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGAOL_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure

  cmake-3-14:
    name: Ubuntu 22.04 x86_64 GCC, CMake 3.14.7
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: CMake 3.14.7, from Kitware's releases
        run: |
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.14.7/cmake-3.14.7-Linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.14.7-Linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Install
        run: cmake --build build --target install
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure

  fetch-content:
    name: Ubuntu 24.04 x86_64 GCC, GAOL built by FetchContent
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure tests/fetch_content, a project building GAOL for itself with FetchContent, from this checkout
        run: |
          cmake -S tests/fetch_content -B build-fetch-content -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_GAOL="$PWD" -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" | tee configure.log
          grep -q "Elementary functions: CORE-MATH" configure.log
      - name: Build
        run: cmake --build build-fetch-content -j 4
      - name: Tests
        run: cd build-fetch-content && ctest -j 4 --output-on-failure
      - name: Install, which installs GAOL with the project
        run: |
          cmake --install build-fetch-content
          for file in lib/libgaol.a include/gaol/gaol.h include/gaol/gaol_u128.h lib/cmake/gaol/gaolConfig.cmake lib/pkgconfig/gaol.pc; do
            test -f "gaol-install/$file" || { echo "$file is not installed"; exit 1; }
          done
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure

  # The 128-bit integer computed with two 64-bit halves, which is the code
  # Visual C++ and the 32-bit targets of GCC take: built and tested on an
  # ordinary machine, where the native type is there to compare with
  # (tests/u128.cpp), so that the path is checked at every change rather than
  # only on the containers of containers.yml (fork of GAOL)
  u128-emulation:
    name: The 128-bit integer emulated, Ubuntu 24.04 x86_64 ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=ON \
            -DGAOL_U128_EMULATION=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} | tee configure.log
          grep -q "128-bit integer: the two halves" configure.log
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure

  # The coverage of the tests, and the page of conclusions of coverage/
  coverage:
    name: Coverage, Ubuntu 24.04 x86_64 GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: gcovr
        run: pipx install gcovr
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGAOL_BUILD_TESTS=ON -DGAOL_COVERAGE=ON
      - name: Tests and report
        run: cmake --build build --target coverage
      - name: The page of conclusions
        run: cat coverage/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: The coverage of GAOL has to stay above 80 %
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("coverage/coverage.json"))
          run = cov = 0
          for f in d["files"]:
              if f["file"].startswith("3rd/"):
                  continue
              for l in f["lines"]:
                  if l.get("gcovr/noncode") is True:
                      continue
                  run += 1
                  cov += l.get("count", 0) > 0
          p = 100.0 * cov / run if run else 0.0
          print("Coverage of GAOL: %.1f %% of %d lines" % (p, run))
          sys.exit(0 if p >= 80.0 else 1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
