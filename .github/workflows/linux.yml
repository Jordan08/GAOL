# Builds GAOL with CMake on Ubuntu, runs its tests (make test), installs it, and
# builds the tests again with the installed GAOL, also as a shared library
# (BUILD_SHARED_LIBS). Also with the sanitizers, with -Wall -Wextra -Werror,
# checking the headers it installs too (GAOL v5), with the minimum version of
# CMake GAOL declares, and as a part of another project, brought in by
# FetchContent (tests/fetch_content). The test cpack_stale_configure also runs
# with ccache in CC and Ninja outside PATH.
#
# The runners have no locale writing a decimal comma, which tests/numbers.cpp
# reads and writes numbers under where there is one, and where there is none it
# says so and passes: each job generates fr_FR.UTF-8 before its tests, and
# checks after them that numbers used it (.github/scripts/comma-locale.sh)
# (GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Linux

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  cmake:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 arm64 Clang' }
          # The compilers of Ubuntu 22.04, whose images GitHub retires by
          # April 2027, on Ubuntu 24.04, which has them too (GAOL v5)
          - { os: ubuntu-24.04,     cc: gcc-11,   cxx: g++-11,     packages: 'gcc-11 g++-11', desc: 'Ubuntu 24.04 x86_64 GCC 11' }
          - { os: ubuntu-24.04,     cc: clang-14, cxx: clang++-14, packages: 'clang-14',      desc: 'Ubuntu 24.04 x86_64 Clang 14' }
          - { os: ubuntu-24.04-arm, cc: gcc-11,   cxx: g++-11,     packages: 'gcc-11 g++-11', desc: 'Ubuntu 24.04 arm64 GCC 11' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 x86_64 GCC, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 arm64 Clang, rounding direction preserved' }
          # libgaol.so.5.0.0, as configure and meson build it: the tests link
          # with it, the expressions included, which it did not export (GAOL v5)
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DBUILD_SHARED_LIBS=ON', desc: 'Ubuntu 24.04 x86_64 GCC, shared library' }
          # The AVX-512 path of +, -, *, / and sqrt (GAOL_PREFER_AVX512):
          # the runners of GitHub are Xeon processors with the instructions,
          # and the whole suite of tests then takes that path, its bounds
          # being those of the SSE2 path, bit for bit (GAOL v5)
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Ubuntu 24.04 x86_64 GCC, AVX-512 arithmetic' }
          # The same, with the rounding direction of the program preserved:
          # the AVX-512 path then spares the store of MXCSR that the SSE2
          # one pays in every operation, which GAOL_PRESERVE_ROUNDING takes
          # by default. The job above takes the path, this one refuses it
          # (-DGAOL_PREFER_AVX512=OFF), the SSE2 operations of the
          # preserved direction staying covered (GAOL v5)
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DGAOL_PRESERVE_ROUNDING=ON -DGAOL_PREFER_AVX512=OFF', desc: 'Ubuntu 24.04 x86_64 GCC, rounding direction preserved, AVX-512 arithmetic not taken' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make ${{ matrix.cfg.packages }}
          ${{ matrix.cfg.cxx }} --version
          cmake --version
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        run: build/tests/gaol_performance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          # With the flags and libraries of gaol.pc alone, then with find_package()
          export PKG_CONFIG_PATH="$PWD/gaol-install/lib/pkgconfig"
          pkg-config --cflags --libs gaol
          ${{ matrix.cfg.cxx }} -std=c++17 -O2 $(pkg-config --cflags gaol) -Itests tests/rounding_direction.cpp $(pkg-config --libs gaol) -Wl,-rpath,"$PWD/gaol-install/lib" -o rounding_direction_pc
          ./rounding_direction_pc | tail -1
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  clang-14-arm64:
    name: Ubuntu 24.04 arm64 Clang 14, refused
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure with Clang 14, which does not honour the rounding direction on 64-bit ARM and has to be refused
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-14 cmake make
          clang++-14 --version
          if cmake -S . -B build -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14 > configure.log 2>&1; then
            cat configure.log
            echo "Clang 14 was not refused"
            exit 1
          fi
          cat configure.log
          grep -q "GAOL cannot be built with" configure.log

  sanitizers:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang Debug ASan+UBSan' }
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make
          ${{ matrix.cfg.cxx }} --version
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: |
          # halt_on_error (UBSAN_OPTIONS) stops a test on its first undefined
          # behaviour; none is suppressed
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build

  # -Wall -Wextra -Werror (GAOL v5): the library, CORE-MATH's sources among
  # them, the tests and the examples compile without a warning with the GCC
  # and the Clang of Ubuntu 26.04, and so does each header GAOL installs,
  # included alone with -std=c++11, whose macros all start with GAOL_ or gaol_
  # (.github/scripts/headers.sh). The flags of the warnings go to every
  # compilation, and -Werror to those of the targets only
  # (CMAKE_COMPILE_WARNING_AS_ERROR), so that no check of CMake fails on a
  # warning of its test program.
  warnings:
    name: ${{ matrix.cfg.desc }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC, -Wall -Wextra -Werror' }
          - { cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang, -Wall -Wextra -Werror' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make pkg-config
          ${{ matrix.cfg.cxx }} --version
      - name: Configure
        run: |
          flags="-Wall -Wextra"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DWITH_EXAMPLES=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Install
        run: cmake --install build
      - name: The headers of the installed GAOL, each alone, and their macros
        run: CXX=${{ matrix.cfg.cxx }} sh .github/scripts/headers.sh "$PWD/gaol-install"

  cmake-3-14:
    name: Ubuntu 24.04 x86_64 GCC, CMake 3.14.7
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: CMake 3.14.7, from Kitware's releases
        run: |
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.14.7/cmake-3.14.7-Linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.14.7-Linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Install
        run: cmake --build build --target install
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  gcc-9:
    name: Ubuntu 24.04 x86_64 GCC 9, without __builtin_roundeven
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          # GCC 9 has no __builtin_roundeven(), which CORE-MATH's sin.c calls
          # unguarded: gaol/core_math_port.h gives it gaol_roundeven()
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-9 g++-9 cmake make
          g++-9 --version
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc-9 -DCMAKE_CXX_COMPILER=g++-9
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build

  # The test cpack_stale_configure configures copies of the tree with the
  # compilers and the generator that configured GAOL: with a compiler given
  # with an argument, which CMake keeps in CMAKE_C_COMPILER_ARG1, and Ninja
  # outside PATH, where CMake finds it by CMAKE_MAKE_PROGRAM only. The test
  # needs no build (GAOL v5)
  launcher-ninja:
    name: Ubuntu 24.04 x86_64 GCC, cpack_stale_configure with ccache in CC and Ninja outside PATH
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: ccache, and Ninja outside PATH
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
          curl -sSL -o "$RUNNER_TEMP/ninja-linux.zip" https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q "$RUNNER_TEMP/ninja-linux.zip" -d "$RUNNER_TEMP/ninja"
          # A Ninja of the image, under the names CMake looks for in PATH
          for name in ninja-build ninja samu; do
            for program in $(which -a "$name"); do sudo rm -f "$program"; done
            if command -v "$name"; then exit 1; fi
          done
      - name: Configure
        run: CC="ccache gcc" CXX="ccache g++" cmake -S . -B build -G Ninja -DCMAKE_MAKE_PROGRAM="$RUNNER_TEMP/ninja/ninja" -DWITH_TESTS=ON
      - name: The test cpack_stale_configure, which has to run, not be skipped
        run: |
          cd build
          ctest -R cpack_stale_configure --no-tests=error > ctest.log 2>&1 || { cat ctest.log; exit 1; }
          cat ctest.log
          if grep -q Skipped ctest.log; then exit 1; fi

  fetch-content:
    name: Ubuntu 24.04 x86_64 GCC, GAOL built by FetchContent
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure tests/fetch_content, a project building GAOL for itself with FetchContent, from this checkout
        run: |
          cmake -S tests/fetch_content -B build-fetch-content -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_GAOL="$PWD" -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" | tee configure.log
          grep -q "Elementary functions: CORE-MATH" configure.log
      - name: Build
        run: cmake --build build-fetch-content -j 4
      - name: Tests (make test)
        run: cmake --build build-fetch-content --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build-fetch-content
      - name: Install, which installs GAOL with the project
        run: |
          cmake --install build-fetch-content
          for file in lib/libgaol.a include/gaol/gaol.h include/gaol/gaol_expression.h lib/cmake/gaol/gaolConfig.cmake lib/pkgconfig/gaol.pc; do
            test -f "gaol-install/$file" || { echo "$file is not installed"; exit 1; }
          done
          # Not the headers of the sources of GAOL only (GAOL v5)
          for file in include/gaol/gaol_u128.h include/gaol/gaol_interval_parser.h include/gaol/sysdeps; do
            test ! -e "gaol-install/$file" || { echo "$file is installed"; exit 1; }
          done
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  # The 128-bit integer computed with two 64-bit halves, which is the code
  # Visual C++ and the 32-bit targets of GCC take: built and tested on an
  # ordinary machine, where the native type is there to compare with
  # (tests/u128.cpp), so that the path is checked at every change rather than
  # only on the containers of containers.yml (GAOL v5)
  u128-emulation:
    name: The 128-bit integer emulated, Ubuntu 24.04 x86_64 ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DGAOL_U128_EMULATION=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} | tee configure.log
          grep -q "128-bit integer: the two halves" configure.log
          # Every source of CORE-MATH compiled with the two halves: the option
          # once reached GAOL's sources only, and CORE-MATH kept the native type
          python3 - <<'EOF'
          import json, sys
          srcs = [e for e in json.load(open("build/compile_commands.json"))
                  if "/3rd/math-core/" in e["file"]]
          native = [e["file"] for e in srcs if "GAOL_U128_FORCE_EMULATION" not in e.get("command", " ".join(e.get("arguments", [])))]
          print(len(srcs), "sources of CORE-MATH,", len(native), "without the emulation")
          sys.exit(1 if native or not srcs else 0)
          EOF
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build

  # The coverage of the tests, and the page of conclusions of coverage/
  coverage:
    name: Coverage, Ubuntu 24.04 x86_64 GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: gcovr
        run: pipx install gcovr
      - name: Locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh generate
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DGAOL_COVERAGE=ON
      - name: Tests and report
        run: cmake --build build --target coverage
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: The page of conclusions
        run: cat coverage/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: The coverage of GAOL has to stay above 80 %
        run: |
          python3 - <<'EOF'
          import json, sys
          # the raw data of gcovr goes to the build directory, coverage/
          # holding only coverage.html and README.md (GAOL v5)
          d = json.load(open("build/coverage.json"))
          run = cov = 0
          for f in d["files"]:
              if f["file"].startswith("3rd/"):
                  continue
              for l in f["lines"]:
                  if l.get("gcovr/noncode") is True:
                      continue
                  run += 1
                  cov += l.get("count", 0) > 0
          p = 100.0 * cov / run if run else 0.0
          print("Coverage of GAOL: %.1f %% of %d lines" % (p, run))
          sys.exit(0 if p >= 80.0 else 1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
