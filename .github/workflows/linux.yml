# Builds GAOL with CMake on Ubuntu, runs its tests, installs it, and builds the
# tests again with the installed GAOL. Also with the sanitizers, and with the
# minimum version of CMake GAOL declares.

name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 x86_64 GCC' }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 x86_64 Clang' }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 24.04 arm64 GCC' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 24.04 arm64 Clang' }
          - { os: ubuntu-22.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 22.04 x86_64 GCC' }
          - { os: ubuntu-22.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 22.04 x86_64 Clang' }
          - { os: ubuntu-22.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 22.04 arm64 GCC' }
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++,     opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 x86_64 GCC, rounding direction preserved' }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Ubuntu 24.04 arm64 Clang, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make
          ${{ matrix.cfg.cxx }} --version
          cmake --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Performance
        run: build/tests/gaol_performance | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure

  clang-14-arm64:
    name: Ubuntu 22.04 arm64 Clang 14, refused
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure with Clang 14, which does not honour the rounding direction on 64-bit ARM and has to be refused
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake make
          clang++ --version
          if cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > configure.log 2>&1; then
            cat configure.log
            echo "Clang 14 was not refused"
            exit 1
          fi
          cat configure.log
          grep -q "GAOL cannot be built with" configure.log

  sanitizers:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-26.04,     cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 x86_64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04,     cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 x86_64 Clang Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: gcc,   cxx: g++,     desc: 'Ubuntu 26.04 arm64 GCC Debug ASan+UBSan' }
          - { os: ubuntu-26.04-arm, cc: clang, cxx: clang++, desc: 'Ubuntu 26.04 arm64 Clang Debug ASan+UBSan' }
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitizers/lsan.supp
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/.github/sanitizers/ubsan.supp
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake make
          ${{ matrix.cfg.cxx }} --version
      - name: Configure
        run: |
          # Not -fno-sanitize-recover: UBSan would then stop on the undefined
          # behaviour of mathlib that ubsan.supp lists; halt_on_error stops on
          # the others
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure

  cmake-3-14:
    name: Ubuntu 22.04 x86_64 GCC, CMake 3.14.7
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: CMake 3.14.7, from Kitware's releases
        run: |
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.14.7/cmake-3.14.7-Linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.14.7-Linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Install
        run: cmake --build build --target install
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure
