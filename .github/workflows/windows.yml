# Builds GAOL with CMake on Windows, with Visual Studio 2022 and 2026 (x86,
# x64, arm64; Release and Debug), the clang-cl of Visual Studio 2022 (x64;
# Release and Debug) and 2026 (x86, x64, arm64; Release), MinGW-w64 15 (x86,
# x64; Release and Debug), 14 (x86, x64), 12 and 13 (x86; 13 without GAOL_FMA
# too), MSYS2 (UCRT64 GCC, CLANG64 Clang) and Cygwin (GCC, x64; GAOL v5), runs
# its tests, installs it, and builds the tests again with the installed GAOL;
# with Visual Studio 2026 x64 and x86 and /W4 /WX too (GAOL v5). The AVX-512
# path of Visual C++ and clang-cl runs under Intel SDE, the runners having no
# AVX-512 instructions.
# Windows has French_France.1252, a locale writing a decimal
# comma: each job that runs the tests checks that numbers read and wrote numbers
# under it (.github/scripts/comma-locale.sh) (GAOL v5). On arm64, the compiler
# of Visual Studio 2022 (toolset v143, MSVC 14.44) is the one installed with
# Visual Studio 2026: the label windows-11-arm runs the image of Visual Studio
# 2026 since September 2026 (actions/runner-images#14602), and no image of
# GitHub has Visual Studio 2022 on arm64 any more.
# Checks that gaol/gaol_config.h refuses the MinGW-w64 whose fma() or round()
# is wrong: on x64, GCC 11 to 13 and MSYS2 MINGW64 (linked with msvcrt.dll),
# whose fma() and round() are those of mingw-w64's own math library; on x86,
# GCC 11, whose fma() rounds each of its partial sums to a double.
# Checks that the objects GCC for Windows builds on x64 and x86 hold the fused
# multiply-add instructions GAOL_FMA gives them (-mfma) and no 256-bit
# instruction (-mprefer-vector-width=128; GCC bug 54412, GAOL v5).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Windows

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  visual-studio:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Release, desc: 'Visual Studio 2026 x86 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, desc: 'Visual Studio 2026 x64 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Release, desc: 'Visual Studio 2026 arm64 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Debug,   desc: 'Visual Studio 2026 x86 Debug' }
          # The control word of the x87 unit and MXCSR are read and written
          # directly on 32-bit x86, with the inline assembly of Visual C++
          # (gaol/gaol_fpu.h, GAOL v5): this job runs it with the rounding
          # direction restored by each operation too, which no job did
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x86 Release, rounding direction preserved' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Debug,   desc: 'Visual Studio 2026 x64 Debug' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Debug,   desc: 'Visual Studio 2026 arm64 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Release, desc: 'Visual Studio 2022 x86 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Release, desc: 'Visual Studio 2022 x64 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T v143', cl: '19.44', arch: ARM64, config: Release, desc: 'Visual Studio 2022 arm64 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Debug,   desc: 'Visual Studio 2022 x86 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Debug,   desc: 'Visual Studio 2022 x64 Debug' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T v143', cl: '19.44', arch: ARM64, config: Debug,   desc: 'Visual Studio 2022 arm64 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x64 Release, rounding direction preserved' }
          # The AVX-512 path of +, -, *, / and sqrt (GAOL_PREFER_AVX512), which
          # Visual C++ and clang-cl take as GCC and Clang do: on a runner with
          # the instructions, which the step after Configure tells, the whole
          # suite of tests takes that path, its bounds being those of the SSE2
          # path (GAOL v5). The job above takes the path too, on such a runner,
          # as GAOL_PREFER_AVX512 follows the rounding direction preserved; the
          # one below refuses it (-DGAOL_PREFER_AVX512=OFF), the SSE2
          # operations of the preserved direction staying covered, as in
          # linux.yml. No asm statement orders the operations of Visual C++:
          # these jobs and tests/rounding_direction.cpp are what checks them
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Visual Studio 2026 x64 Release, AVX-512 arithmetic' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Debug,   opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Visual Studio 2022 x64 Debug, AVX-512 arithmetic' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON -DGAOL_PREFER_AVX512=OFF', desc: 'Visual Studio 2026 x64 Release, rounding direction preserved, AVX-512 arithmetic not taken' }
          # clang-cl, the Clang of Visual Studio (toolset ClangCL, installed
          # with Visual Studio in the images), for which CMake sets MSVC too
          # and GAOL gives /fp:strict (-frounding-math -ffp-contract=off),
          # /arch:AVX2 on x64, and -msse2 on x86, where clang-cl computes
          # doubles on the x87 unit otherwise, /arch:SSE2 included. On x64 it
          # defines __x86_64__ and _WIN32 but not __WIN32__, which upstream
          # CORE-MATH tests to read the rounding direction in cbrt, rsqrt and
          # asinpi (3rd/README.md, item 6): tests/core_math.cpp checks them.
          # gaol/gaol_config.h refuses it without /fp:strict from Clang 16, as
          # it refuses Visual C++, and tests/fp_strict checks both (GAOL v5).
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', toolset: '-T ClangCL', clang_cl: true, arch: x64, config: Release, desc: 'Visual Studio 2022 clang-cl x64 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', toolset: '-T ClangCL', clang_cl: true, arch: x64, config: Debug,   desc: 'Visual Studio 2022 clang-cl x64 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: x64,   config: Release, desc: 'Visual Studio 2026 clang-cl x64 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: Win32, config: Release, desc: 'Visual Studio 2026 clang-cl x86 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: ARM64, config: Release, desc: 'Visual Studio 2026 clang-cl arm64 Release' }
          # clang-cl x64 keeps the asm statements of Clang in the AVX-512 path and
          # takes the SSE2 intervals with the rounding direction preserved through
          # MXCSR alone (/arch:AVX2 defines __FMA__ for it, not for cl), which no
          # job covered before (GAOL v5)
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: x64,   config: Release, opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Visual Studio 2026 clang-cl x64 Release, AVX-512 arithmetic' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: x64,   config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON -DGAOL_PREFER_AVX512=OFF', desc: 'Visual Studio 2026 clang-cl x64 Release, rounding direction preserved, AVX-512 arithmetic not taken' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DWITH_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }} | tee configure.log
          # The compiler of the toolset asked for, not the one of the generator
          if [ -n "${{ matrix.cfg.cl }}" ]; then
            grep "The CXX compiler identification is MSVC ${{ matrix.cfg.cl }}\." configure.log
          fi
          # clang-cl for the C sources of CORE-MATH as for those of GAOL
          if [ "${{ matrix.cfg.clang_cl }}" = "true" ]; then
            test "$(grep -c -E "The (C|CXX) compiler identification is Clang .* with MSVC-like command-line" configure.log)" = 2
          fi
      # The intervals of the build: the SSE2 ones on x64, where Visual C++ and
      # clang-cl take them (GAOL v5), and the FPU ones on x86 and arm64, where
      # NEON is not offered to them (GAOL_ARM64)
      - name: The intervals
        run: |
          if [ "${{ matrix.cfg.arch }}" = "x64" ]; then expected=sse2; else expected=fpu; fi
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h $expected
      # On x64, the processor of the runner, and whether +, -, *, / and sqrt
      # take the AVX-512 path, which the configuration decides from the
      # instructions the runner has (GAOL_AVX512_ARITHMETIC): a warning where
      # GAOL_PREFER_AVX512 asked for it, or took it from the rounding
      # direction preserved, and the runner has none (GAOL v5)
      - name: The processor, and the AVX-512 path
        if: matrix.cfg.arch == 'x64'
        run: |
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          grep -E "^#define GAOL_(HAVE_AVX512_TARGET|PREFER_AVX512|AVX512_ARITHMETIC) " build/gaol/gaol_configuration.h || true
          if ! grep -q "^#define GAOL_HAVE_AVX512_TARGET 1" build/gaol/gaol_configuration.h; then
            echo "::error::the compiler takes no AVX-512 path"
            exit 1
          fi
          if grep -q "^#define GAOL_PREFER_AVX512 1" build/gaol/gaol_configuration.h \
             && ! grep -q "^#define GAOL_AVX512_ARITHMETIC 1" build/gaol/gaol_configuration.h; then
            echo "::warning::GAOL_PREFER_AVX512, on a runner without the AVX-512 instructions: the tests take the SSE2 path"
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.cfg.config }} -j 4
      - name: Tests (make test)
        run: cmake --build build --config ${{ matrix.cfg.config }} --target RUN_TESTS
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: build/tests/${{ matrix.cfg.config }}/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build --config ${{ matrix.cfg.config }}
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package --config ${{ matrix.cfg.config }} -j 4
          cmake --build build-find-package --config ${{ matrix.cfg.config }} --target RUN_TESTS
      - name: GAOL's headers refused without /fp:strict
        run: cmake -S tests/fp_strict -B build-fp-strict -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"

  # /W4 /WX with the Visual C++ of Visual Studio 2026 x64, whose intervals are
  # the SSE2 ones, and x86, where size_t has 32 bits and the intervals are
  # those of the FPU (GAOL v5), as -Wall -Wextra -Werror with GCC and Clang
  # (linux.yml) and AppleClang (macos.yml):
  # the library, the sources of CORE-MATH included, the tests and the examples.
  # /W4 goes to every compilation, through CFLAGS and CXXFLAGS, which CMake
  # puts before the flags it gives Visual C++ (CMAKE_CXX_FLAGS on the command
  # line would replace /GR /EHsc), and /WX to those of the targets only
  # (CMAKE_COMPILE_WARNING_AS_ERROR), so that no check of CMake fails on a
  # warning of its test program. In PowerShell, which passes /W4 as it is.
  # The Debug build has a job too: it finds what the Release build does not,
  # as the unreachable code that Visual C++ reports there (C4702), which
  # CMakeLists.txt turns off for the parser that bison writes.
  warnings:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { arch: x64,   config: Release, desc: 'Visual Studio 2026 x64 Release, /W4 /WX' }
          - { arch: x64,   config: Release, opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Visual Studio 2026 x64 Release, /W4 /WX, AVX-512 arithmetic' }
          - { arch: Win32, config: Release, desc: 'Visual Studio 2026 x86 Release, /W4 /WX' }
          - { arch: x64,   config: Debug,   desc: 'Visual Studio 2026 x64 Debug, /W4 /WX' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        env:
          CFLAGS: /W4
          CXXFLAGS: /W4
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.cfg.arch }} -DWITH_TESTS=ON -DWITH_EXAMPLES=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.cfg.opts }}
          if ($LASTEXITCODE) { exit 1 }
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_(C|CXX)_FLAGS:'
      - name: Build
        run: |
          cmake --build build --config ${{ matrix.cfg.config }} -j 4
          if ($LASTEXITCODE) { exit 1 }

  # The AVX-512 path of +, -, *, / and sqrt with Visual C++ and clang-cl, run
  # (GAOL v5): the runners for Windows have no AVX-512 instructions, and the
  # jobs above that ask for the path leave it out there, with a warning. Intel
  # SDE emulates a Skylake-X processor, 20 to 100 times as slowly: the
  # configuration is told by hand that the machine runs the instructions
  # (-DGAOL_MACHINE_RUNS_AVX512=1, which CMake takes for the result of its own
  # check), and the unit tests run under SDE (.github/scripts/sde-tests.sh),
  # those that compute with intervals only. Visual C++ orders the operations of
  # the path by volatile accesses and calls (gaol/gaol_interval_avx512.cpp),
  # which only the tests of the rounding direction and of the flush-to-zero
  # modes can show wrong. The action sets SDE up from the binaries of its own
  # repository, after checking their SHA-256: by using it, the project accepts
  # Intel's licence of SDE, which is in the files it extracts.
  visual-studio-sde:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025-vs2026, generator: 'Visual Studio 18 2026', config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved' }
          - { os: windows-2025-vs2026, generator: 'Visual Studio 18 2026', config: Release, opts: '-DGAOL_PREFER_AVX512=ON', desc: 'Visual Studio 2026 x64 Release, AVX-512 arithmetic under SDE' }
          - { os: windows-2025-vs2026, generator: 'Visual Studio 18 2026', config: Debug,   opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x64 Debug, AVX-512 arithmetic under SDE, rounding direction preserved' }
          - { os: windows-2022,        generator: 'Visual Studio 17 2022', config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2022 x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved' }
          - { os: windows-2025-vs2026, generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 clang-cl x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.cfg.generator }}" -A x64 ${{ matrix.cfg.toolset }} -DWITH_TESTS=ON -DGAOL_MACHINE_RUNS_AVX512=1 ${{ matrix.cfg.opts }} | tee configure.log
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
          grep -E "^#define GAOL_(HAVE_AVX512_TARGET|PREFER_AVX512|AVX512_ARITHMETIC|PRESERVE_ROUNDING) " build/gaol/gaol_configuration.h || true
          if ! grep -q "^#define GAOL_AVX512_ARITHMETIC 1" build/gaol/gaol_configuration.h; then
            echo "::error::the AVX-512 path is not the one of the build"
            exit 1
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.cfg.config }} -j 4
      - name: Tests under SDE
        run: sh .github/scripts/sde-tests.sh "$(cygpath -u "$SDE_PATH")/sde.exe" build/tests/${{ matrix.cfg.config }}

  mingw:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 15.2.0 x64 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 15.2.0 x86 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Debug,   desc: 'MinGW-w64 15.2.0 x64 Debug' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Debug,   desc: 'MinGW-w64 15.2.0 x86 Debug' }
          # -mfma is on x86 too (GAOL v5, __FMA__ defined): the rounding
          # direction preserved, which no MinGW-w64 job for 32-bit x86 ran,
          # with it
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'MinGW-w64 15.2.0 x86 Release, rounding direction preserved' }
          # The older MinGW-w64 GAOL builds with: GAOL v5 takes no elementary
          # function from the math library of the system and no longer calls
          # fesetround() for its elementary functions. Those whose fma() or
          # round() is wrong are refused, CORE-MATH computing with that fma()
          # (see gaol/gaol_config.h): MinGW-w64 GCC 11 to 13 on x86-64, and GCC
          # 11 on 32-bit x86, which the job mingw-refused checks. GCC 12 and 13
          # on 32-bit x86 compute the fma() of mingw-w64 11 on the x87 unit,
          # in extended precision, when GAOL_FMA is off: it passes the tests,
          # though it is not correctly rounded (the job 13.2.0 x86 Release,
          # no FMA). With GAOL_FMA, the default, they get -mfma (GAOL v5).
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 14.2.0 x64 Release' }
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 14.2.0 x86 Release' }
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 13.2.0 x86 Release' }
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, opts: '-DGAOL_FMA=OFF', desc: 'MinGW-w64 13.2.0 x86 Release, no FMA' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 12.2.0 x86 Release' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: Configure
        run: |
          which gcc g++ mingw32-make
          g++ --version
          g++ -dumpmachine
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      # The SSE2 intervals on x86 as on x64, with -faligned-new=8 on x86, where
      # the C runtime aligns the memory of new on 8 bytes (GAOL v5)
      - name: The intervals
        run: |
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
          if [ "$(g++ -dumpmachine | cut -c1-4)" = "i686" ]; then
            grep -F -e "-faligned-new=8" build/CMakeFiles/gaol.dir/flags.make
          fi
      - name: Build
        run: cmake --build build -j 4
      # GAOL_FMA gives GCC for Windows on x64 and on x86 -mfma
      # -mprefer-vector-width=128 (CMakeLists.txt, point 110 of TODO.md): the
      # objects of the Release builds hold fused multiply-add instructions,
      # which CORE-MATH and the integer powers need to be fast, and none on a
      # 256-bit register, which GCC would spill to a stack that Windows x64
      # aligns on 16 bytes (GCC bug 54412; on x86 the flags are kept for the
      # same objects). Not in Debug, where the vectorizer does not run, nor
      # without GAOL_FMA (GAOL v5)
      - name: Fused multiply-add instructions, and no 256-bit register in the objects
        if: matrix.cfg.config == 'Release' && !contains(matrix.cfg.opts, 'GAOL_FMA=OFF')
        run: |
          PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          export PATH
          sh .github/scripts/check-gcc-windows-fma.sh build
      # The programs are run with the MinGW-w64 first in PATH: bash starts with the
      # mingw64/bin of Git for Windows before it, and the libstdc++-6.dll there (x64
      # only: an x86 program skips a 64-bit DLL) is older than the compiler's, without
      # std::streambuf::seekpos, so that gaol_test_numbers did not start (exit code
      # 0xc0000139, entry point not found).
      - name: Tests (make test)
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          build/tests/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          cmake -S tests/find_package -B build-find-package -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { msystem: UCRT64,  packages: ucrt-x86_64,  cc: gcc,   cxx: g++,     desc: 'MSYS2 UCRT64 GCC x64' }
          # With -mfma (GAOL_FMA, GAOL v5) GCC for Windows defines __FMA__, and
          # GAOL_PRESERVE_ROUNDING then keeps the rounding direction through
          # MXCSR alone (GAOL_RND_ENTER_SSE of gaol/gaol_fpu.h), which only the
          # jobs of Linux and clang-cl ran: this one runs it with GCC for Windows.
          # mingw-w64 13 and later read the direction with a fegetround() that
          # joins the x87 unit and MXCSR, and set it with a fesetround() that
          # clears the exception flags: GAOL reads and writes the registers
          # itself there (GAOL_RND_MINGW64_X87, point 110 of TODO.md)
          - { msystem: UCRT64,  packages: ucrt-x86_64,  cc: gcc,   cxx: g++,     opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'MSYS2 UCRT64 GCC x64, rounding direction preserved' }
          # The same without the fused multiply-add instructions: __FMA__ is
          # not defined, and the operations that are not SSE2 ones (the
          # elementary functions, midpoint()...) keep the direction with the
          # generic macros, as before GAOL_FMA gave -mfma
          - { msystem: UCRT64,  packages: ucrt-x86_64,  cc: gcc,   cxx: g++,     opts: '-DGAOL_FMA=OFF -DGAOL_PRESERVE_ROUNDING=ON', desc: 'MSYS2 UCRT64 GCC x64, rounding direction preserved, no FMA' }
          - { msystem: CLANG64, packages: clang-x86_64, cc: clang, cxx: clang++, desc: 'MSYS2 CLANG64 Clang x64' }
          # Clang for Windows has taken -mfma since GAOL_FMA exists, so that
          # __FMA__ is defined there and the direction is kept through MXCSR
          # alone: the same configuration as the GCC entry above, with the same C
          # runtime (the step that counts the instructions is GCC's)
          - { msystem: CLANG64, packages: clang-x86_64, cc: clang, cxx: clang++, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'MSYS2 CLANG64 Clang x64, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.cfg.msystem }}
          install: mingw-w64-${{ matrix.cfg.packages }}-toolchain mingw-w64-${{ matrix.cfg.packages }}-cmake mingw-w64-${{ matrix.cfg.packages }}-ninja
      - name: Configure
        run: |
          ${{ matrix.cfg.cxx }} --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }} ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build -j 4
      # GAOL_FMA gives GCC for Windows -mfma -mprefer-vector-width=128
      # (CMakeLists.txt, point 110 of TODO.md), as the job above checks (GAOL
      # v5). Not Clang, which aligns its stack and gets -mfma alone
      - name: Fused multiply-add instructions, and no 256-bit register in the objects
        if: matrix.cfg.cc == 'gcc' && !contains(matrix.cfg.opts, 'GAOL_FMA=OFF')
        run: sh .github/scripts/check-gcc-windows-fma.sh build
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        run: build/tests/gaol_performance.exe

  # Cygwin, GCC for x86-64 (GAOL v5). GAOL_FMA gives it -mfma
  # -mprefer-vector-width=128 as the MinGW-w64 and MSYS2 above (CMakeLists.txt:
  # (WIN32 OR CYGWIN)), which no job exercised. Cygwin is not mingw-w64
  # (__CYGWIN__, not __MINGW32__), so gaol/gaol_config.h does not refuse it, and
  # tests/core_math.cpp checks first the fma() and round() of its C library
  cygwin:
    name: Cygwin GCC x64 Release
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      - run: git config --global core.autocrlf input
        shell: pwsh
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            gcc-g++
            cmake
            make
            binutils
      - name: Configure
        run: |
          g++ --version
          g++ -dumpmachine
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      # What the configuration found about the fused multiply-add instructions:
      # the processor, and the log of the test that runs a program built with
      # -mfma (GAOL_MACHINE_RUNS_FMA, CMakeLists.txt)
      - name: The processor, and the test that runs a program with -mfma
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 -o -w 'fma' /proc/cpuinfo || echo "no fma in /proc/cpuinfo"
          grep -n -A70 'GAOL_MACHINE_RUNS_FMA' build/CMakeFiles/CMakeConfigureLog.yaml | head -200 || true
      - name: The intervals, and the flags of the fused multiply-add instructions
        run: |
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
          grep -F -e "-mfma -mprefer-vector-width=128" build/CMakeFiles/gaol.dir/flags.make
      - name: Build
        run: cmake --build build -j 4
      - name: Fused multiply-add instructions, and no 256-bit register in the objects
        run: sh .github/scripts/check-gcc-windows-fma.sh build
      - name: Tests (make test)
        run: cmake --build build --target test

  # The mingw-w64 whose fma() or round() is wrong are refused when compiling
  # (gaol/gaol_config.h): CORE-MATH computes with that fma() where the build
  # has no -mfma (GAOL_FMA OFF; GAOL_FMA gives it to GCC for Windows on x86-64
  # and on 32-bit x86, and these toolchains stay refused, their round() being
  # wrong too), so that the bounds would not enclose the exact values. On x86-64, GCC 12.2.0 and 13.2.0 of Chocolatey are
  # MinGW-Builds of mingw-w64 11 (UCRT) and GCC 11.2.0 is WinLibs mingw-w64 9
  # (msvcrt.dll), all before 12: their fma() and round() are those of
  # mingw-w64's own math library. On 32-bit x86, GCC 11.2.0 is WinLibs
  # mingw-w64 9, whose fma() rounds each of its partial sums to a double. Each
  # job looks for the reason in the message.
  mingw-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 13.2.0 x64, refused' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 12.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 11.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', message: "whose fma(), which CORE-MATH computes with, rounds each of its partial sums to a double", desc: 'MinGW-w64 11.2.0 x86, refused' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: The version of mingw-w64, and a build that has to fail
        run: |
          g++ --version
          echo '#include <stdlib.h>' | g++ -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) '
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          if cmake --build build > build.log 2>&1; then
            cat build.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat build.log
          grep -F -q "GAOL cannot be compiled with this mingw-w64" build.log
          grep -F -q "${{ matrix.cfg.message }}" build.log

  # MSYS2 MINGW64 links msvcrt.dll rather than the UCRT: its mingw-w64, 12 or
  # later, still gives the programs the fma() and round() of mingw-w64's own
  # math library, which gaol/gaol_config.h refuses, with GCC and with Clang
  # (_UCRT undefined). UCRT64 and CLANG64 are built and tested above.
  msys2-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { cc: gcc,   cxx: g++,     packages: '',                       desc: 'MSYS2 MINGW64 GCC x64, refused' }
          - { cc: clang, cxx: clang++, packages: 'mingw-w64-x86_64-clang', desc: 'MSYS2 MINGW64 Clang x64, refused' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # What these jobs check is that GAOL refuses MINGW64, which the action calls deprecated
          suppress-deprecation-warnings: msystem-mingw64
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja ${{ matrix.cfg.packages }}
      - name: The version and the C runtime of mingw-w64, and a build that has to fail
        run: |
          ${{ matrix.cfg.cxx }} --version
          echo '#include <stdlib.h>' | ${{ matrix.cfg.cxx }} -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) |__MSVCRT_VERSION__ |define _UCRT( |$)'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }}
          if cmake --build build > build.log 2>&1; then
            cat build.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat build.log
          grep -F -q "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library" build.log
