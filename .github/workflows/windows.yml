# Builds GAOL with CMake on Windows, with Visual Studio 2022 and 2026 (x86,
# x64, arm64; Release and Debug), the clang-cl of Visual Studio 2022 (x64;
# Release and Debug) and 2026 (x86, x64, arm64; Release), MinGW-w64 15 (x86,
# x64; Release and Debug), 14 (x86, x64), 12 and 13 (x86; 13 without GAOL_FMA
# too), MSYS2 (UCRT64 GCC, CLANG64 Clang, CLANGARM64 Clang) and Cygwin (GCC, x64; GAOL v5), runs
# its tests, installs it, and builds the tests again with the installed GAOL
# (but Cygwin, which builds, checks the objects and runs the tests, and checks
# that a build without FMA is refused); with Visual Studio 2026 x64 and x86
# and /W4 /WX too (GAOL v5). The AVX-512 path of Visual C++ and clang-cl runs
# under Intel SDE, the runners having AVX-512 instructions or not, according to
# the machine GitHub gives.
# Windows has French_France.1252, a locale writing a decimal comma: each job
# that runs the tests but Cygwin's checks that numbers read and wrote numbers
# under it (.github/scripts/comma-locale.sh) (GAOL v5). On arm64, the compiler
# of Visual Studio 2022 (toolset v143, MSVC 14.44) is the one installed with
# Visual Studio 2026: the label windows-11-arm runs the image of Visual Studio
# 2026 since September 2026 (actions/runner-images#14602), and no image of
# GitHub has Visual Studio 2022 on arm64 any more.
# Checks that gaol/gaol_config.h refuses the MinGW-w64 whose fma() or round()
# is wrong: on x64, GCC 11 to 13 and MSYS2 MINGW64 (linked with msvcrt.dll),
# whose fma() and round() are those of mingw-w64's own math library; on x86,
# GCC 11, whose fma() rounds each of its partial sums to a double.
# Checks that the objects GCC for Windows builds on x64 and x86 hold the fused
# multiply-add instructions GAOL_FMA gives them (-mfma) and no 256-bit
# instruction (-mprefer-vector-width=128; GCC bug 54412, GAOL v5).
#
# A job is a group of configurations that run one after the other on the
# same image of runner, each one an action of .github/actions/ called
# with the row of the matrix it had when it was a job of its own: the
# configurations, their options and their checks are those of the jobs
# they replace (GAOL v5). Below, a job is one of these configurations.
#
# Copyright (c) 2026 ENSTA, France
#
# By: Jordan NININ (created 2026-09-20)
#
# GAOL is a software distributed WITHOUT ANY WARRANTY. Read the associated
# COPYING.LIB file for information.

name: Windows

on:
  push:
    branches: [master, configure-clean, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  # actions/checkout runs git init, whose hint about the name of the initial
  # branch was in the log of every job
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:

  w1:
    name: 'Visual Studio 2022 x64, clang-cl x64 Release (4 configurations)'
    runs-on: windows-2022
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'Visual Studio 2022 x64 Debug'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 x64 Debug'
          generator: 'Visual Studio 17 2022'
          arch: 'x64'
          config: 'Debug'
      - id: c2
        name: 'Visual Studio 2022 x64 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 x64 Release'
          generator: 'Visual Studio 17 2022'
          arch: 'x64'
          config: 'Release'
      - id: c3
        name: 'Visual Studio 2022 x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio-sde
        timeout-minutes: 90
        with:
          desc: 'Visual Studio 2022 x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved'
          generator: 'Visual Studio 17 2022'
          config: 'Release'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
      # clang-cl, the Clang of Visual Studio (toolset ClangCL, installed
      # with Visual Studio in the images), for which CMake sets MSVC too
      # and GAOL gives /fp:strict (-frounding-math -ffp-contract=off),
      # /arch:AVX2 on x64, and -msse2 on x86, where clang-cl computes
      # doubles on the x87 unit otherwise, /arch:SSE2 included. On x64 it
      # defines __x86_64__ and _WIN32 but not __WIN32__, which upstream
      # CORE-MATH tests to read the rounding direction in cbrt, rsqrt and
      # asinpi (3rd/README.md, item 6): tests/core_math.cpp checks them.
      # gaol/gaol_config.h refuses it without /fp:strict from Clang 16, as
      # it refuses Visual C++, and tests/fp_strict checks both (GAOL v5).
      - id: c4
        name: 'Visual Studio 2022 clang-cl x64 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 clang-cl x64 Release'
          generator: 'Visual Studio 17 2022'
          toolset: '-T ClangCL'
          clang_cl: 'true'
          arch: 'x64'
          config: 'Release'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'Visual Studio 2022 x64, clang-cl x64 Release' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Visual Studio 2022 x64 Debug' ;;
              c2) name='Visual Studio 2022 x64 Release' ;;
              c3) name='Visual Studio 2022 x64 Release, AVX-512 arithmetic under SDE, rounding direction preserved' ;;
              c4) name='Visual Studio 2022 clang-cl x64 Release' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w2:
    name: 'Visual Studio 2022 x86 and clang-cl x64 Debug (3 configurations)'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'Visual Studio 2022 x86 Debug'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 x86 Debug'
          generator: 'Visual Studio 17 2022'
          arch: 'Win32'
          config: 'Debug'
      - id: c2
        name: 'Visual Studio 2022 x86 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 x86 Release'
          generator: 'Visual Studio 17 2022'
          arch: 'Win32'
          config: 'Release'
      - id: c3
        name: 'Visual Studio 2022 clang-cl x64 Debug'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 clang-cl x64 Debug'
          generator: 'Visual Studio 17 2022'
          toolset: '-T ClangCL'
          clang_cl: 'true'
          arch: 'x64'
          config: 'Debug'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'Visual Studio 2022 x86 and clang-cl x64 Debug' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Visual Studio 2022 x86 Debug' ;;
              c2) name='Visual Studio 2022 x86 Release' ;;
              c3) name='Visual Studio 2022 clang-cl x64 Debug' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w3:
    name: 'VS 2022 AVX-512 Debug, Clang for Visual C++, MSYS2 refused (6 configurations)'
    runs-on: windows-2022
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7
      # One setup of MSYS2 for the group: the configurations choose their
      # environment with MSYSTEM, the action refusing a second installation
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-clang mingw-w64-i686-toolchain mingw-w64-i686-cmake
            mingw-w64-i686-ninja
      - id: c1
        name: 'MSYS2 MINGW64 GCC x64, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2-refused
        timeout-minutes: 30
        with:
          desc: 'MSYS2 MINGW64 GCC x64, refused'
          msystem: 'MINGW64'
          cc: 'gcc'
          cxx: 'g++'
          opts: ''
          message: 'or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64''s own math library'
        env:
          MSYSTEM: 'MINGW64'
      - id: c2
        name: 'MSYS2 MINGW64 Clang x64, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2-refused
        timeout-minutes: 30
        with:
          desc: 'MSYS2 MINGW64 Clang x64, refused'
          msystem: 'MINGW64'
          cc: 'clang'
          cxx: 'clang++'
          opts: ''
          message: 'or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64''s own math library'
        env:
          MSYSTEM: 'MINGW64'
      - id: c3
        name: 'MSYS2 MINGW32 GCC x86 without FMA, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2-refused
        timeout-minutes: 30
        with:
          desc: 'MSYS2 MINGW32 GCC x86 without FMA, refused'
          msystem: 'MINGW32'
          cc: 'gcc'
          cxx: 'g++'
          opts: '-DGAOL_FMA=OFF'
          message: 'linked with msvcrt.dll rather than the UCRT, without the fused multiply-add instructions'
        env:
          MSYSTEM: 'MINGW32'
      - id: c4
        name: 'Visual Studio 2022 x64 Debug, AVX-512 arithmetic'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2022 x64 Debug, AVX-512 arithmetic'
          generator: 'Visual Studio 17 2022'
          arch: 'x64'
          config: 'Debug'
          opts: '-DGAOL_PREFER_AVX512=ON'
      - id: c5
        name: 'Clang for Visual C++ x86 (clang++), Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-clang-msvc
        timeout-minutes: 60
        with:
          desc: 'Clang for Visual C++ x86 (clang++), Release'
          arch: 'x86'
          target: 'i686-pc-windows-msvc'
      - id: c6
        name: 'Clang for Visual C++ x64 (clang++), Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-clang-msvc
        timeout-minutes: 60
        with:
          desc: 'Clang for Visual C++ x64 (clang++), Release'
          arch: 'x64'
          target: 'x86_64-pc-windows-msvc'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }} c5=${{ steps.c5.outcome }} c6=${{ steps.c6.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'VS 2022 AVX-512 Debug, Clang for Visual C++, MSYS2 refused' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='MSYS2 MINGW64 GCC x64, refused' ;;
              c2) name='MSYS2 MINGW64 Clang x64, refused' ;;
              c3) name='MSYS2 MINGW32 GCC x86 without FMA, refused' ;;
              c4) name='Visual Studio 2022 x64 Debug, AVX-512 arithmetic' ;;
              c5) name='Clang for Visual C++ x86 (clang++), Release' ;;
              c6) name='Clang for Visual C++ x64 (clang++), Release' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w4:
    name: 'MSYS2 UCRT64 and CLANG64 (5 configurations)'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      # One setup of MSYS2 for the group: the configurations choose their
      # environment with MSYSTEM, the action refusing a second installation
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
      - id: c1
        name: 'MSYS2 UCRT64 GCC x64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 UCRT64 GCC x64'
          msystem: 'UCRT64'
          cc: 'gcc'
          cxx: 'g++'
        env:
          MSYSTEM: 'UCRT64'
      # With -mfma (GAOL_FMA, GAOL v5) GCC for Windows defines __FMA__, and
      # GAOL_PRESERVE_ROUNDING then keeps the rounding direction through
      # MXCSR alone (GAOL_RND_ENTER_SSE of gaol/gaol_fpu.h), which only the
      # jobs of Linux and clang-cl ran: this one runs it with GCC for Windows.
      # mingw-w64 13 and later read the direction with a fegetround() that
      # joins the x87 unit and MXCSR, and set it with a fesetround() that
      # clears the exception flags: GAOL reads and writes the registers
      # itself there (GAOL_RND_X86_64_DIRECT)
      - id: c2
        name: 'MSYS2 UCRT64 GCC x64, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 UCRT64 GCC x64, rounding direction preserved'
          msystem: 'UCRT64'
          cc: 'gcc'
          cxx: 'g++'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
        env:
          MSYSTEM: 'UCRT64'
      # The same without the fused multiply-add instructions: __FMA__ is
      # not defined, and the operations that are not SSE2 ones (the
      # elementary functions, midpoint()...) keep the direction with the
      # generic macros, as before GAOL_FMA gave -mfma
      - id: c3
        name: 'MSYS2 UCRT64 GCC x64, rounding direction preserved, no FMA'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 UCRT64 GCC x64, rounding direction preserved, no FMA'
          msystem: 'UCRT64'
          cc: 'gcc'
          cxx: 'g++'
          opts: '-DGAOL_FMA=OFF -DGAOL_PRESERVE_ROUNDING=ON'
        env:
          MSYSTEM: 'UCRT64'
      - id: c4
        name: 'MSYS2 CLANG64 Clang x64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 CLANG64 Clang x64'
          msystem: 'CLANG64'
          cc: 'clang'
          cxx: 'clang++'
        env:
          MSYSTEM: 'CLANG64'
      # Clang for Windows has taken -mfma since GAOL_FMA exists, so that
      # __FMA__ is defined there and the direction is kept through MXCSR
      # alone: the same configuration as the GCC entry above, with the same C
      # runtime (the step that counts the instructions is GCC's), but for the
      # AVX-512 path: Clang takes it where the runner has the instructions
      # (the step tells), GCC for Windows never does. Then +, -, *, /, sqr and
      # sqrt of this job set no direction, and GAOL_RND_ENTER_SSE() is only
      # covered by the GCC entry; the readers and writers of the registers
      # (midpoint(), chi(), split(), the reading and the writing of an
      # interval), which this job runs, are covered whatever the runner
      - id: c5
        name: 'MSYS2 CLANG64 Clang x64, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 CLANG64 Clang x64, rounding direction preserved'
          msystem: 'CLANG64'
          cc: 'clang'
          cxx: 'clang++'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
        env:
          MSYSTEM: 'CLANG64'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }} c5=${{ steps.c5.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'MSYS2 UCRT64 and CLANG64' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='MSYS2 UCRT64 GCC x64' ;;
              c2) name='MSYS2 UCRT64 GCC x64, rounding direction preserved' ;;
              c3) name='MSYS2 UCRT64 GCC x64, rounding direction preserved, no FMA' ;;
              c4) name='MSYS2 CLANG64 Clang x64' ;;
              c5) name='MSYS2 CLANG64 Clang x64, rounding direction preserved' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w5:
    name: 'MinGW-w64 11.2, 12.2, 13.2 x64 (refused) and 12.2 x86 (5 configurations)'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'MinGW-w64 11.2.0 x64, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw-refused
        timeout-minutes: 30
        with:
          desc: 'MinGW-w64 11.2.0 x64, refused'
          version: '11.2.0.07112021'
          bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          choco_flags: ''
          message: 'or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64''s own math library'
      - id: c2
        name: 'MinGW-w64 11.2.0 x86, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw-refused
        timeout-minutes: 30
        with:
          desc: 'MinGW-w64 11.2.0 x86, refused'
          version: '11.2.0.07112021'
          bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin'
          choco_flags: '--x86'
          message: 'whose fma(), which CORE-MATH computes with, rounds each of its partial sums to a double'
      - id: c3
        name: 'MinGW-w64 12.2.0 x64, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw-refused
        timeout-minutes: 30
        with:
          desc: 'MinGW-w64 12.2.0 x64, refused'
          version: '12.2.0.03042023'
          bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          choco_flags: ''
          message: 'or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64''s own math library'
      - id: c4
        name: 'MinGW-w64 12.2.0 x86 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw
        timeout-minutes: 60
        with:
          desc: 'MinGW-w64 12.2.0 x86 Release'
          version: '12.2.0.03042023'
          bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin'
          choco_flags: '--x86'
          config: 'Release'
      - id: c5
        name: 'MinGW-w64 13.2.0 x64, refused'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw-refused
        timeout-minutes: 30
        with:
          desc: 'MinGW-w64 13.2.0 x64, refused'
          version: '13.2.0'
          bin: 'C:\ProgramData\mingw64\mingw64\bin'
          choco_flags: ''
          message: 'or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64''s own math library'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }} c5=${{ steps.c5.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'MinGW-w64 11.2, 12.2, 13.2 x64 (refused) and 12.2 x86' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='MinGW-w64 11.2.0 x64, refused' ;;
              c2) name='MinGW-w64 11.2.0 x86, refused' ;;
              c3) name='MinGW-w64 12.2.0 x64, refused' ;;
              c4) name='MinGW-w64 12.2.0 x86 Release' ;;
              c5) name='MinGW-w64 13.2.0 x64, refused' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w6:
    name: 'MinGW-w64 13.2 x86 (2 configurations)'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'MinGW-w64 13.2.0 x86 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw
        timeout-minutes: 60
        with:
          desc: 'MinGW-w64 13.2.0 x86 Release'
          version: '13.2.0'
          bin: 'C:\ProgramData\mingw64\mingw32\bin'
          choco_flags: '--x86'
          config: 'Release'
      - id: c2
        name: 'MinGW-w64 13.2.0 x86 Release, no FMA'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-mingw
        timeout-minutes: 60
        with:
          desc: 'MinGW-w64 13.2.0 x86 Release, no FMA'
          version: '13.2.0'
          bin: 'C:\ProgramData\mingw64\mingw32\bin'
          choco_flags: '--x86'
          config: 'Release'
          opts: '-DGAOL_FMA=OFF'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'MinGW-w64 13.2 x86' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
