          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'Visual Studio 2022 and 2026 arm64, Debug' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Visual Studio 2022 arm64 Debug' ;;
              c2) name='Visual Studio 2022 arm64 Release' ;;
              c3) name='Visual Studio 2026 arm64 Debug' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w15:
    name: 'Visual Studio 2026 arm64 Release, clang-cl Release (4 configurations)'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - id: c1
        name: 'Visual Studio 2026 arm64 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2026 arm64 Release'
          generator: 'Visual Studio 18 2026'
          arch: 'ARM64'
          config: 'Release'
      # The NEON intervals of Visual C++ for arm64 (GAOL v5) read and write
      # FPCR through _ReadStatusReg() and _WriteStatusReg(), and no asm
      # statement orders their operations: the other configurations for
      # arm64 and tests/rounding_direction.cpp are what checks them. This
      # one runs them with the rounding direction restored by each
      # operation too, and "Visual Studio 2026 arm64 Release, FPU
      # intervals" the FPU intervals, which -DGAOL_SIMD=OFF gives
      - id: c2
        name: 'Visual Studio 2026 arm64 Release, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2026 arm64 Release, rounding direction preserved'
          generator: 'Visual Studio 18 2026'
          arch: 'ARM64'
          config: 'Release'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
      - id: c3
        name: 'Visual Studio 2026 arm64 Release, FPU intervals'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2026 arm64 Release, FPU intervals'
          generator: 'Visual Studio 18 2026'
          arch: 'ARM64'
          config: 'Release'
          opts: '-DGAOL_SIMD=OFF'
      - id: c4
        name: 'Visual Studio 2026 clang-cl arm64 Release'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2026 clang-cl arm64 Release'
          generator: 'Visual Studio 18 2026'
          toolset: '-T ClangCL'
          clang_cl: 'true'
          arch: 'ARM64'
          config: 'Release'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }} c4=${{ steps.c4.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'Visual Studio 2026 arm64 Release, clang-cl Release' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='Visual Studio 2026 arm64 Release' ;;
              c2) name='Visual Studio 2026 arm64 Release, rounding direction preserved' ;;
              c3) name='Visual Studio 2026 arm64 Release, FPU intervals' ;;
              c4) name='Visual Studio 2026 clang-cl arm64 Release' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  w16:
    name: 'MSYS2 CLANGARM64 and clang-cl arm64 FPU (3 configurations)'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # One setup of MSYS2 for the group: the configurations choose their
      # environment with MSYSTEM, the action refusing a second installation
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: >-
            mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja
      # MSYS2 for arm64, on the arm64 runners: the Clang of MinGW-w64 takes the
      # NEON intervals as that of Linux and macOS does, FPCR being read and
      # written by the asm statements of Clang, and the UCRT of Windows having
      # FE_* values that are not the bits of FPCR (GAOL v5)
      - id: c1
        name: 'MSYS2 CLANGARM64 Clang arm64'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 CLANGARM64 Clang arm64'
          msystem: 'CLANGARM64'
          cc: 'clang'
          cxx: 'clang++'
        env:
          MSYSTEM: 'CLANGARM64'
      - id: c2
        name: 'MSYS2 CLANGARM64 Clang arm64, rounding direction preserved'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-msys2
        timeout-minutes: 60
        with:
          desc: 'MSYS2 CLANGARM64 Clang arm64, rounding direction preserved'
          msystem: 'CLANGARM64'
          cc: 'clang'
          cxx: 'clang++'
          opts: '-DGAOL_PRESERVE_ROUNDING=ON'
        env:
          MSYSTEM: 'CLANGARM64'
      # The FPU intervals of clang-cl on arm64, which the NEON ones replace
      # there (GAOL v5): they read and write FPCR with asm, as the NEON ones
      - id: c3
        name: 'Visual Studio 2026 clang-cl arm64 Release, FPU intervals'
        if: ${{ !cancelled() }}
        uses: ./.github/actions/windows-visual-studio
        timeout-minutes: 60
        with:
          desc: 'Visual Studio 2026 clang-cl arm64 Release, FPU intervals'
          generator: 'Visual Studio 18 2026'
          toolset: '-T ClangCL'
          clang_cl: 'true'
          arch: 'ARM64'
          config: 'Release'
          opts: '-DGAOL_SIMD=OFF'
      - name: Results of the configurations
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            c1=${{ steps.c1.outcome }} c2=${{ steps.c2.outcome }} c3=${{ steps.c3.outcome }}
        run: |
          status=0
          printf '### %s\n\n| Configuration | Result |\n| --- | --- |\n' 'MSYS2 CLANGARM64 and clang-cl arm64 FPU' >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            case "${kv%%=*}" in
              c1) name='MSYS2 CLANGARM64 Clang arm64' ;;
              c2) name='MSYS2 CLANGARM64 Clang arm64, rounding direction preserved' ;;
              c3) name='Visual Studio 2026 clang-cl arm64 Release, FPU intervals' ;;
            esac
            printf '| %s | %s |\n' "$name" "${kv#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${kv#*=}" = success ] || status=1
          done
          exit $status

  # Cygwin, GCC for x86-64 (GAOL v5). GAOL_FMA gives it -mfma
  # -mprefer-vector-width=128 as the MinGW-w64 and MSYS2 above (CMakeLists.txt:
  # (WIN32 OR CYGWIN)). Cygwin is not mingw-w64 (__CYGWIN__, not __MINGW32__):
  # its fma() is not correctly rounded (fma(1 + 2^-30, 1 - 2^-30, -1) is 0), so
  # that gaol/gaol_config.h refuses it without -mfma, and GAOL calls
  # __builtin_fma, which is the instruction at every level of optimization;
  # tests/core_math.cpp checks first the fma() and round() of its C library
  cygwin:
    name: Cygwin GCC x64 Release and Debug
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      - run: git config --global core.autocrlf input
        shell: pwsh
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            gcc-g++
            cmake
            make
            binutils
      - name: Configure
        run: |
          g++ --version
          g++ -dumpmachine
          # The make of Cygwin: the gmake.exe of Strawberry Perl, first in PATH,
          # does not know the /cygdrive paths ("No rule to make target")
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_MAKE_PROGRAM=/usr/bin/make
      - name: The intervals, and the flags of the fused multiply-add instructions
        run: |
          sh .github/scripts/check-intervals.sh build/gaol/gaol_configuration.h sse2
          grep -F -e "-mfma -mprefer-vector-width=128" build/CMakeFiles/gaol.dir/flags.make
      - name: Build
        run: cmake --build build -j 4
      - name: Fused multiply-add instructions, and no 256-bit register in the objects
        run: sh .github/scripts/check-gcc-windows-fma.sh build
      - name: Tests (make test)
        run: cmake --build build --target test
      # fma_once(): without optimization the objects of GAOL call no fma() of the
      # C library, which is the one of Cygwin, not correctly rounded, where
      # std::fma is such a call. The tests are built and run too (GAOL v5): the
      # Debug build of Cygwin was only compiled before
      - name: No call of the fma() of the library in a build without optimization
        run: |
          cmake -S . -B build-debug -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_MAKE_PROGRAM=/usr/bin/make
          cmake --build build-debug -j 4
          object=build-debug/CMakeFiles/gaol.dir/gaol/core/gaol_interval_core.cpp.o
          count=$(objdump -d --no-show-raw-insn "$object" | grep -c 'vfmadd' || true)
          echo "$count fused multiply-add instructions"
          # not grep -q: it ends before objdump does, which pipefail reads as 141
          [ "$count" -gt 0 ]
          # fma_once() is in gaol/core/gaol_interval_internal.h, which each
          # source of the intervals includes: all their objects are read
          for object in build-debug/CMakeFiles/gaol.dir/gaol/core/*.cpp.o; do
            if nm -u "$object" | grep -w 'fma'; then
              echo "$(basename "$object") calls the fma() of the C library"
              exit 1
            fi
          done
      - name: Tests (make test), Debug
        run: cmake --build build-debug --target test
      # Without the fused multiply-add instructions Cygwin has the fma() of its
      # C library, which is wrong: the build has to be refused
      - name: Cygwin without GAOL_FMA is refused
        run: |
          cmake -S . -B build-no-fma -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_MAKE_PROGRAM=/usr/bin/make -DGAOL_FMA=OFF
          if cmake --build build-no-fma > build-no-fma.log 2>&1; then
            cat build-no-fma.log
            echo "Cygwin without -mfma was not refused"
            exit 1
          fi
          grep -F -q "GAOL cannot be compiled with Cygwin without the fused multiply-add instructions" build-no-fma.log || {
            cat build-no-fma.log
            echo "The build was refused, but not for that reason"
            exit 1
          }
