# Builds GAOL with CMake on Windows, with Visual Studio 2022 and 2026 (x86, x64,
# arm64; Release and Debug), MinGW-w64 15 (x86, x64) and MSYS2 (UCRT64
# GCC, CLANG64 Clang), runs its tests, installs it, and builds the tests again
# with the installed GAOL. Builds with MinGW-w64 11 to 15, x64 and x86: the older ones are no longer
# refused (GAOL v5, see CMakeLists.txt).
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-studio:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Release, desc: 'Visual Studio 2026 x86 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, desc: 'Visual Studio 2026 x64 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Release, desc: 'Visual Studio 2026 arm64 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Debug,   desc: 'Visual Studio 2026 x86 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Debug,   desc: 'Visual Studio 2026 x64 Debug' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Debug,   desc: 'Visual Studio 2026 arm64 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Release, desc: 'Visual Studio 2022 x86 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Release, desc: 'Visual Studio 2022 x64 Release' }
          - { os: windows-11-arm,        generator: 'Visual Studio 17 2022', arch: ARM64, config: Release, desc: 'Visual Studio 2022 arm64 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Debug,   desc: 'Visual Studio 2022 x86 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Debug,   desc: 'Visual Studio 2022 x64 Debug' }
          - { os: windows-11-arm,        generator: 'Visual Studio 17 2022', arch: ARM64, config: Debug,   desc: 'Visual Studio 2022 arm64 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x64 Release, rounding direction preserved' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} -DGAOL_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }}
      - name: Build
        run: cmake --build build --config ${{ matrix.cfg.config }} -j 4
      - name: Tests
        run: ctest --test-dir build -C ${{ matrix.cfg.config }} -j 4 --output-on-failure
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: build/tests/${{ matrix.cfg.config }}/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build --config ${{ matrix.cfg.config }}
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package --config ${{ matrix.cfg.config }} -j 4
          ctest --test-dir build-find-package -C ${{ matrix.cfg.config }} -j 4 --output-on-failure
      - name: GAOL's headers refused without /fp:strict
        run: cmake -S tests/fp_strict -B build-fp-strict -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"

  mingw:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 15.2.0 x64 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 15.2.0 x86 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Debug,   desc: 'MinGW-w64 15.2.0 x64 Debug' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Debug,   desc: 'MinGW-w64 15.2.0 x86 Debug' }
          # The older MinGW-w64 that GAOL builds with again: the two reasons it
          # refused them are gone with mathlib (the hyperbolic functions of the
          # math library of the system, and the cost of fesetround()). Those
          # whose <fenv.h> answers fegetround() from a state of its own are
          # still refused, the elementary functions of CORE-MATH reading it
          # (see gaol/gaol_config.h): MinGW-w64 GCC 11 to 13 on x86-64, and
          # GCC 11 on 32-bit x86, which the job below checks are refused.
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 14.2.0 x64 Release' }
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 14.2.0 x86 Release' }
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 13.2.0 x86 Release' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 12.2.0 x86 Release' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: Configure
        run: |
          which gcc g++ mingw32-make
          g++ --version
          g++ -dumpmachine
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DGAOL_BUILD_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: build/tests/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cd build-find-package && ctest -j 4 --output-on-failure

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { msystem: UCRT64,  packages: ucrt-x86_64,  cc: gcc,   cxx: g++,     desc: 'MSYS2 UCRT64 GCC x64' }
          - { msystem: CLANG64, packages: clang-x86_64, cc: clang, cxx: clang++, desc: 'MSYS2 CLANG64 Clang x64' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.cfg.msystem }}
          install: mingw-w64-${{ matrix.cfg.packages }}-toolchain mingw-w64-${{ matrix.cfg.packages }}-cmake mingw-w64-${{ matrix.cfg.packages }}-ninja
      - name: Configure
        run: |
          ${{ matrix.cfg.cxx }} --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAOL_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: cd build && ctest -j 4 --output-on-failure
      - name: Performance
        run: build/tests/gaol_performance.exe

  # The mingw-w64 whose <fenv.h> answers fegetround() from a state of its own
  # are refused when compiling (gaol/gaol_config.h): GAOL sets the rounding
  # direction by writing the registers, and the elementary functions of
  # CORE-MATH read fegetround() to know it, so the bounds would not enclose
  mingw-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      desc: 'MinGW-w64 13.2.0 x64, refused' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      desc: 'MinGW-w64 12.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      desc: 'MinGW-w64 11.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', desc: 'MinGW-w64 11.2.0 x86, refused' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: The version of mingw-w64, and a build that has to fail
        run: |
          g++ --version
          echo '#include <stdlib.h>' | g++ -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) '
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          if cmake --build build > build.log 2>&1; then
            cat build.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat build.log
          grep -q "GAOL cannot be compiled with this mingw-w64" build.log
