# Builds GAOL with CMake on Windows, with Visual Studio 2022 and 2026 (x86, x64,
# arm64; Release and Debug), the clang-cl of Visual Studio 2022 (x64; Release
# and Debug) and 2026 (x86, x64, arm64; Release), MinGW-w64 15 (x86, x64;
# Release and Debug), 14 (x86, x64), 12 and 13 (x86), and MSYS2 (UCRT64 GCC,
# CLANG64 Clang), runs its tests, installs it, and builds the tests again with
# the installed GAOL; with Visual Studio 2026 x64 and x86 and /W4 /WX too (GAOL
# v5).
# Windows has French_France.1252, a locale writing a decimal
# comma: each job that runs the tests checks that numbers read and wrote numbers
# under it (.github/scripts/comma-locale.sh) (GAOL v5). On arm64, the compiler
# of Visual Studio 2022 (toolset v143, MSVC 14.44) is the one installed with
# Visual Studio 2026: the label windows-11-arm runs the image of Visual Studio
# 2026 since September 2026 (actions/runner-images#14602), and no image of
# GitHub has Visual Studio 2022 on arm64 any more.
# Checks that gaol/gaol_config.h refuses the MinGW-w64 whose fma() or round()
# is wrong: on x64, GCC 11 to 13 and MSYS2 MINGW64 (linked with msvcrt.dll),
# whose fma() and round() are those of mingw-w64's own math library; on x86,
# GCC 11, whose fma() rounds each of its partial sums to a double.
#
# Copyright (c) 2026 ENSTA, France
#
# Created 2026-09-20 by Jordan NININ

name: Windows

on:
  push:
    branches: [master, MATH-CORE, configure-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# make test (the target test of CMake, RUN_TESTS with Visual Studio) runs
# ctest, which reads these: four tests at a time, and the output of those that
# fail (GAOL v5)
env:
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  visual-studio:
    name: ${{ matrix.cfg.desc }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Release, desc: 'Visual Studio 2026 x86 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, desc: 'Visual Studio 2026 x64 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Release, desc: 'Visual Studio 2026 arm64 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: Win32, config: Debug,   desc: 'Visual Studio 2026 x86 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Debug,   desc: 'Visual Studio 2026 x64 Debug' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', arch: ARM64, config: Debug,   desc: 'Visual Studio 2026 arm64 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Release, desc: 'Visual Studio 2022 x86 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Release, desc: 'Visual Studio 2022 x64 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T v143', cl: '19.44', arch: ARM64, config: Release, desc: 'Visual Studio 2022 arm64 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: Win32, config: Debug,   desc: 'Visual Studio 2022 x86 Debug' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', arch: x64,   config: Debug,   desc: 'Visual Studio 2022 x64 Debug' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T v143', cl: '19.44', arch: ARM64, config: Debug,   desc: 'Visual Studio 2022 arm64 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', arch: x64,   config: Release, opts: '-DGAOL_PRESERVE_ROUNDING=ON', desc: 'Visual Studio 2026 x64 Release, rounding direction preserved' }
          # clang-cl, the Clang of Visual Studio (toolset ClangCL, installed
          # with Visual Studio in the images), for which CMake sets MSVC too
          # and GAOL gives /fp:strict (-frounding-math -ffp-contract=off),
          # /arch:AVX2 on x64, and -msse2 on x86, where clang-cl computes
          # doubles on the x87 unit otherwise, /arch:SSE2 included. On x64 it
          # defines __x86_64__ and _WIN32 but not __WIN32__, which the sources
          # of CORE-MATH test to read the rounding direction in cbrt, rsqrt and
          # asinpi (3rd/README.md, item 7): tests/core_math.cpp checks them.
          # gaol/gaol_config.h refuses it without /fp:strict from Clang 16, as
          # it refuses Visual C++, and tests/fp_strict checks both (GAOL v5).
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', toolset: '-T ClangCL', clang_cl: true, arch: x64, config: Release, desc: 'Visual Studio 2022 clang-cl x64 Release' }
          - { os: windows-2022,          generator: 'Visual Studio 17 2022', toolset: '-T ClangCL', clang_cl: true, arch: x64, config: Debug,   desc: 'Visual Studio 2022 clang-cl x64 Debug' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: x64,   config: Release, desc: 'Visual Studio 2026 clang-cl x64 Release' }
          - { os: windows-2025-vs2026,   generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: Win32, config: Release, desc: 'Visual Studio 2026 clang-cl x86 Release' }
          - { os: windows-11-vs2026-arm, generator: 'Visual Studio 18 2026', toolset: '-T ClangCL', clang_cl: true, arch: ARM64, config: Release, desc: 'Visual Studio 2026 clang-cl arm64 Release' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DWITH_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install" ${{ matrix.cfg.opts }} | tee configure.log
          # The compiler of the toolset asked for, not the one of the generator
          if [ -n "${{ matrix.cfg.cl }}" ]; then
            grep "The CXX compiler identification is MSVC ${{ matrix.cfg.cl }}\." configure.log
          fi
          # clang-cl for the C sources of CORE-MATH as for those of GAOL
          if [ "${{ matrix.cfg.clang_cl }}" = "true" ]; then
            test "$(grep -c -E "The (C|CXX) compiler identification is Clang .* with MSVC-like command-line" configure.log)" = 2
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.cfg.config }} -j 4
      - name: Tests (make test)
        run: cmake --build build --config ${{ matrix.cfg.config }} --target RUN_TESTS
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: build/tests/${{ matrix.cfg.config }}/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build --config ${{ matrix.cfg.config }}
      - name: Tests built with the installed GAOL
        run: |
          cmake -S tests/find_package -B build-find-package -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package --config ${{ matrix.cfg.config }} -j 4
          cmake --build build-find-package --config ${{ matrix.cfg.config }} --target RUN_TESTS
      - name: GAOL's headers refused without /fp:strict
        run: cmake -S tests/fp_strict -B build-fp-strict -G "${{ matrix.cfg.generator }}" -A ${{ matrix.cfg.arch }} ${{ matrix.cfg.toolset }} -DCMAKE_PREFIX_PATH="$PWD/gaol-install"

  # /W4 /WX with the Visual C++ of Visual Studio 2026 x64 and x86 (GAOL v5),
  # where size_t has 32 bits and the intervals are those of the FPU, as -Wall
  # -Wextra -Werror with GCC and Clang (linux.yml) and AppleClang (macos.yml):
  # the library, the sources of CORE-MATH included, the tests and the examples.
  # /W4 goes to every compilation, through CFLAGS and CXXFLAGS, which CMake
  # puts before the flags it gives Visual C++ (CMAKE_CXX_FLAGS on the command
  # line would replace /GR /EHsc), and /WX to those of the targets only
  # (CMAKE_COMPILE_WARNING_AS_ERROR), so that no check of CMake fails on a
  # warning of its test program. In PowerShell, which passes /W4 as it is.
  warnings:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { arch: x64,   desc: 'Visual Studio 2026 x64 Release, /W4 /WX' }
          - { arch: Win32, desc: 'Visual Studio 2026 x86 Release, /W4 /WX' }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        env:
          CFLAGS: /W4
          CXXFLAGS: /W4
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.cfg.arch }} -DWITH_TESTS=ON -DWITH_EXAMPLES=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          if ($LASTEXITCODE) { exit 1 }
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_(C|CXX)_FLAGS:'
      - name: Build
        run: |
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE) { exit 1 }

  mingw:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 15.2.0 x64 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 15.2.0 x86 Release' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Debug,   desc: 'MinGW-w64 15.2.0 x64 Debug' }
          - { version: '15.2.0',         bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Debug,   desc: 'MinGW-w64 15.2.0 x86 Debug' }
          # The older MinGW-w64 GAOL builds with: GAOL v5 takes no elementary
          # function from the math library of the system and no longer calls
          # fesetround() for its elementary functions. Those whose fma() or
          # round() is wrong are refused, CORE-MATH computing with that fma()
          # (see gaol/gaol_config.h): MinGW-w64 GCC 11 to 13 on x86-64, and GCC
          # 11 on 32-bit x86, which the job mingw-refused checks. GCC 12 and 13
          # on 32-bit x86 compute the fma() of mingw-w64 11 on the x87 unit,
          # in extended precision: it passes the tests, though it is not
          # correctly rounded.
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      config: Release, desc: 'MinGW-w64 14.2.0 x64 Release' }
          - { version: '14.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 14.2.0 x86 Release' }
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 13.2.0 x86 Release' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', config: Release, desc: 'MinGW-w64 12.2.0 x86 Release' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: Configure
        run: |
          which gcc g++ mingw32-make
          g++ --version
          g++ -dumpmachine
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DWITH_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_INSTALL_PREFIX="$PWD/gaol-install"
      - name: Build
        run: cmake --build build -j 4
      # The programs are run with the MinGW-w64 first in PATH: bash starts with the
      # mingw64/bin of Git for Windows before it, and the libstdc++-6.dll there (x64
      # only: an x86 program skips a 64-bit DLL) is older than the compiler's, without
      # std::streambuf::seekpos, so that gaol_test_numbers did not start (exit code
      # 0xc0000139, entry point not found).
      - name: Tests (make test)
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        if: matrix.cfg.config == 'Release'
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          build/tests/gaol_performance.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build
      - name: Tests built with the installed GAOL
        run: |
          export PATH="$(cygpath -u '${{ matrix.cfg.bin }}'):$PATH"
          cmake -S tests/find_package -B build-find-package -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cfg.config }} -DCMAKE_CXX_COMPILER=g++ -DCMAKE_PREFIX_PATH="$PWD/gaol-install"
          cmake --build build-find-package -j 4
          cmake --build build-find-package --target test

  msys2:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { msystem: UCRT64,  packages: ucrt-x86_64,  cc: gcc,   cxx: g++,     desc: 'MSYS2 UCRT64 GCC x64' }
          - { msystem: CLANG64, packages: clang-x86_64, cc: clang, cxx: clang++, desc: 'MSYS2 CLANG64 Clang x64' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.cfg.msystem }}
          install: mingw-w64-${{ matrix.cfg.packages }}-toolchain mingw-w64-${{ matrix.cfg.packages }}-cmake mingw-w64-${{ matrix.cfg.packages }}-ninja
      - name: Configure
        run: |
          ${{ matrix.cfg.cxx }} --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }}
      - name: Build
        run: cmake --build build -j 4
      - name: Tests (make test)
        run: cmake --build build --target test
      - name: The test numbers ran under a locale writing a decimal comma
        run: sh .github/scripts/comma-locale.sh check build
      - name: Performance
        run: build/tests/gaol_performance.exe

  # The mingw-w64 whose fma() or round() is wrong are refused when compiling
  # (gaol/gaol_config.h): CORE-MATH computes with that fma(), so that the
  # bounds would not enclose the exact values. On x86-64, GCC 12.2.0 and
  # 13.2.0 of Chocolatey are MinGW-Builds of mingw-w64 11 (UCRT) and GCC 11.2.0
  # is WinLibs mingw-w64 9 (msvcrt.dll), all before 12: their fma() and
  # round() are those of mingw-w64's own math library. On 32-bit x86, GCC
  # 11.2.0 is WinLibs mingw-w64 9, whose fma() rounds each of its partial sums
  # to a double. Each job looks for the reason in the message.
  mingw-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { version: '13.2.0',          bin: 'C:\ProgramData\mingw64\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 13.2.0 x64, refused' }
          - { version: '12.2.0.03042023', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 12.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin', choco_flags: '',      message: "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library", desc: 'MinGW-w64 11.2.0 x64, refused' }
          - { version: '11.2.0.07112021', bin: 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin', choco_flags: '--x86', message: "whose fma(), which CORE-MATH computes with, rounds each of its partial sums to a double", desc: 'MinGW-w64 11.2.0 x86, refused' }
    steps:
      - uses: actions/checkout@v7
      - name: MinGW-w64, from Chocolatey
        run: |
          choco install -y -r --no-progress mingw --version=${{ matrix.cfg.version }} --force ${{ matrix.cfg.choco_flags }}
          echo '${{ matrix.cfg.bin }}' >> "$GITHUB_PATH"
      - name: The version of mingw-w64, and a build that has to fail
        run: |
          g++ --version
          echo '#include <stdlib.h>' | g++ -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) '
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          if cmake --build build > build.log 2>&1; then
            cat build.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat build.log
          grep -F -q "GAOL cannot be compiled with this mingw-w64" build.log
          grep -F -q "${{ matrix.cfg.message }}" build.log

  # MSYS2 MINGW64 links msvcrt.dll rather than the UCRT: its mingw-w64, 12 or
  # later, still gives the programs the fma() and round() of mingw-w64's own
  # math library, which gaol/gaol_config.h refuses, with GCC and with Clang
  # (_UCRT undefined). UCRT64 and CLANG64 are built and tested above.
  msys2-refused:
    name: ${{ matrix.cfg.desc }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { cc: gcc,   cxx: g++,     packages: '',                       desc: 'MSYS2 MINGW64 GCC x64, refused' }
          - { cc: clang, cxx: clang++, packages: 'mingw-w64-x86_64-clang', desc: 'MSYS2 MINGW64 Clang x64, refused' }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja ${{ matrix.cfg.packages }}
      - name: The version and the C runtime of mingw-w64, and a build that has to fail
        run: |
          ${{ matrix.cfg.cxx }} --version
          echo '#include <stdlib.h>' | ${{ matrix.cfg.cxx }} -dM -E -x c++ - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR) |__MSVCRT_VERSION__ |define _UCRT( |$)'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }}
          if cmake --build build > build.log 2>&1; then
            cat build.log
            echo "This MinGW-w64 was not refused"
            exit 1
          fi
          cat build.log
          grep -F -q "or linked with msvcrt.dll rather than the UCRT, its fma() and round() are those of mingw-w64's own math library" build.log
